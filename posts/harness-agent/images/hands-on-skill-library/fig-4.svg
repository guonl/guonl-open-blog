<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker><marker id="a16A34A" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#16A34A"/></marker><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">三道闸门：把自动生成的技能关进可回溯的笼子</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">新旧版本对照、留出集盲审、版本留档与回滚</text><rect x="80" y="180" width="1440" height="86" rx="16" fill="#D97706" fill-opacity="0.10" stroke="#D97706" stroke-width="3"/><text x="800" y="233" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">候选技能：reflect 自动生成，单次运行拿了 1.000</text><line x1="800" y1="266" x2="800" y2="332" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="80" y="340" width="420" height="230" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="110" y="392" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">第一关  新旧版本对照</text><text x="110" y="444" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 新旧版本跑同一批固定任务</text><text x="110" y="490" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 新版本要高出设定幅度才放行</text><text x="110" y="536" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 只比较分数，不比较措辞</text><rect x="590" y="340" width="420" height="230" rx="18" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="620" y="392" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">第二关  留出集盲审</text><text x="620" y="444" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 用门禁平时看不到的那组任务</text><text x="620" y="490" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 评审方不知道哪份是新版本</text><text x="620" y="536" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 防止朝着测试集过拟合</text><rect x="1100" y="340" width="420" height="230" rx="18" fill="#7C3AED" fill-opacity="0.06" stroke="#7C3AED" stroke-width="3"/><text x="1130" y="392" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">第三关  留档与回滚</text><text x="1130" y="444" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 旧版本先存进 archive/ 目录</text><text x="1130" y="490" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 文件名带上版本号，可追溯</text><text x="1130" y="536" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 新版本出问题能退回上一版</text><line x1="500" y1="455" x2="590" y2="455" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="1010" y1="455" x2="1100" y2="455" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="290" y1="570" x2="380" y2="650" stroke="#16A34A" stroke-width="3" marker-end="url(#a16A34A)"/><text x="398" y="618" fill="#16A34A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">放行</text><line x1="1310" y1="570" x2="1220" y2="650" stroke="#DC2626" stroke-width="3" marker-end="url(#aDC2626)"/><text x="1202" y="618" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">拦下</text><rect x="80" y="655" width="600" height="120" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="380.0" y="711.0" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">接受：写入 skills/，旧版本已存档</text><text x="380.0" y="746.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">门禁只放明确更好的版本</text><rect x="920" y="655" width="600" height="120" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="1220.0" y="711.0" fill="#DC2626" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">拒绝：候选不入库，旧版本继续生效</text><text x="1220.0" y="746.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">同一颗种子，有门禁就长不起来</text><text x="800" y="830" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">门禁看的不是技能自称的分数，是把它扔进一组环境重跑出来的分数</text></svg>