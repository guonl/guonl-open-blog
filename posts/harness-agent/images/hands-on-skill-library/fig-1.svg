<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">技能库的三块：技能文件、元信息、检索</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">文件是内容，元信息是索引，检索在两者之上</text><rect x="110" y="215" width="1380" height="130" rx="18" fill="#0891B2" fill-opacity="0.10" stroke="#0891B2" stroke-width="3"/><text x="800" y="270" fill="#0891B2" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">检索：在两者之上</text><text x="800" y="314" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">拿任务的关键词去匹配技能的关键词，IDF 加权排序，取前 k 条</text><line x1="435" y1="455" x2="435" y2="352" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="457" y="406" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">读取步骤</text><line x1="1165" y1="455" x2="1165" y2="352" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="1187" y="406" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">读取关键词</text><rect x="110" y="455" width="650" height="270" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="150" y="512" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">技能文件：内容</text><text x="150" y="550" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">skills/deploy-node.json</text><text x="150" y="604" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">steps</text><text x="250" y="604" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">跑测试 / 检查端口占用 / 同步环境变量</text><text x="150" y="646" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">keywords</text><text x="250" y="646" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">部署 / deploy / node / 预发</text><text x="150" y="688" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">note</text><text x="250" y="688" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">人工整理的标准部署流程</text><rect x="840" y="455" width="650" height="270" rx="18" fill="#7C3AED" fill-opacity="0.06" stroke="#7C3AED" stroke-width="3"/><text x="880" y="512" fill="#7C3AED" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">元信息：索引</text><text x="880" y="550" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">name / task_type / keywords</text><text x="880" y="604" fill="#7C3AED" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">version</text><text x="1010" y="604" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">版本号，回滚时按它找文件</text><text x="880" y="646" fill="#7C3AED" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">status</text><text x="1010" y="646" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">active 表示当前生效</text><text x="880" y="688" fill="#7C3AED" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">score</text><text x="1010" y="688" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">诞生时的单次成绩，门禁会重算</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">文件管内容，元信息管索引和版本，检索只负责匹配：三块分开存，改一块不影响另两块</text></svg>