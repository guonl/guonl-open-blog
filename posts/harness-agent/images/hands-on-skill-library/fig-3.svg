no Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">污染技能均分 0.250</text><rect x="720" y="587" width="160" height="113" rx="6" fill="#64748B" fill-opacity="0.75"/><text x="800.0" y="572.72" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">0.708</text><text x="800.0" y="736" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">默认步骤均分 0.708</text><rect x="1200" y="540" width="160" height="160" rx="6" fill="#16A34A" fill-opacity="0.75"/><text x="1280.0" y="526.0" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1.000</text><text x="1280.0" y="736" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">正确流程均分 1.000</text><text x="800" y="820" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">技能文件里记的 score 来自诞生时那一次运行，不是整组环境里的真实成绩</text></svg>