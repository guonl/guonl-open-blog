<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">五个部件，缺一个就有一类故障</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">每一栏对应一类典型问题，以及对应的设计抓手</text><rect x="80" y="180" width="1440" height="118" rx="16" fill="#2563EB" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="80" y="180" width="10" height="118" rx="5" fill="#2563EB"/><text x="124" y="232" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">工具调用编排</text><line x1="450" y1="198" x2="450" y2="280" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="228" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">缺了只能空谈，一步落不了地</text><text x="480" y="268" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">设计：把工具描述当接口契约写</text><rect x="80" y="314" width="1440" height="118" rx="16" fill="#0891B2" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="80" y="314" width="10" height="118" rx="5" fill="#0891B2"/><text x="124" y="366" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">上下文管理</text><line x1="450" y1="332" x2="450" y2="414" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="362" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">缺了窗口被噪声挤爆，关键信息被淹没</text><text x="480" y="402" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">设计：预算、压缩、按需检索</text><rect x="80" y="448" width="1440" height="118" rx="16" fill="#16A34A" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="80" y="448" width="10" height="118" rx="5" fill="#16A34A"/><text x="124" y="500" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">持久记忆</text><line x1="450" y1="466" x2="450" y2="548" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="496" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">缺了每次从零开始，重复劳动</text><text x="480" y="536" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">设计：存得下、召得回、过期能失效</text><rect x="80" y="582" width="1440" height="118" rx="16" fill="#D97706" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="80" y="582" width="10" height="118" rx="5" fill="#D97706"/><text x="124" y="634" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">反思循环</text><line x1="450" y1="600" x2="450" y2="682" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="630" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">缺了同一个错误反复犯</text><text x="480" y="670" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">设计：先有可靠的成败信号</text><rect x="80" y="716" width="1440" height="118" rx="16" fill="#DC2626" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="80" y="716" width="10" height="118" rx="5" fill="#DC2626"/><text x="124" y="768" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">安全护栏</text><line x1="450" y1="734" x2="450" y2="816" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="764" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">缺了一次误判就可能不可逆</text><text x="480" y="804" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">设计：最小权限，默认拒绝</text></svg>