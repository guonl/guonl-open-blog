<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">记忆留在会话里，还是分成好几层</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">分水岭在「跨会话」：它记不记得上次做到哪</text><rect x="140" y="360" width="480" height="190" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="380.0" y="451.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">会话级上下文</text><text x="380.0" y="488.0" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">一次对话一个工作台，结束即清空</text><text x="380" y="590" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">长期记忆需额外配置</text><rect x="820" y="618.0" width="660" height="88.0" rx="12" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="3"/><text x="848" y="656.0" fill="#64748B" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">工作上下文</text><text x="848" y="686.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">正在干活的那一段</text><rect x="820" y="522.0" width="660" height="88.0" rx="12" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="848" y="560.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">会话摘要</text><text x="848" y="590.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">对长对话做压缩</text><rect x="820" y="426.0" width="660" height="88.0" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="848" y="464.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">用户画像</text><text x="848" y="494.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">记住用户是谁</text><rect x="820" y="330.0" width="660" height="88.0" rx="12" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="848" y="368.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">环境记忆</text><text x="848" y="398.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">描述运行的环境</text><rect x="820" y="234.0" width="660" height="88.0" rx="12" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="3"/><text x="848" y="272.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">技能库</text><text x="848" y="302.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">会不断长大的技能</text><text x="1150" y="780" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">分层长期记忆</text></svg>