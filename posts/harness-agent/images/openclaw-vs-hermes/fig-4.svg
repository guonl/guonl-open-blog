<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">该不该跟风换工具</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">先问自己几个问题，再决定往哪边靠</text><path d="M80.0,210 L408.5,210 L432.5,258.0 L408.5,306 L80.0,306 L104.0,258.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="264.25" y="268.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">标准化任务？</text><path d="M442.5,210 L771.0,210 L795.0,258.0 L771.0,306 L442.5,306 L466.5,258.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="626.75" y="268.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">要跨会话记忆？</text><path d="M805.0,210 L1133.5,210 L1157.5,258.0 L1133.5,306 L805.0,306 L829.0,258.0 Z" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="989.25" y="268.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">接受不可控？</text><path d="M1167.5,210 L1496.0,210 L1520.0,258.0 L1496.0,306 L1167.5,306 L1191.5,258.0 Z" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><text x="1351.75" y="268.0" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">能做技能审计？</text><rect x="80" y="380" width="680" height="330" rx="18" fill="#0891B2" fill-opacity="0.08" stroke="#0891B2" stroke-width="3"/><text x="120" y="444" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">更贴触达型，如果</text><text x="130" y="512" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 任务多为一次性、标准化流程</text><text x="130" y="568" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 不需要它记住上一次</text><text x="130" y="624" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 希望技能都有人写过、可审计</text><rect x="840" y="380" width="680" height="330" rx="18" fill="#7C3AED" fill-opacity="0.08" stroke="#7C3AED" stroke-width="3"/><text x="880" y="444" fill="#7C3AED" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">更贴自进化型，如果</text><text x="890" y="512" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 任务长期、跨多个场景</text><text x="890" y="568" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 需要它记住上次做到哪</text><text x="890" y="624" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 接受自动技能，并愿意做审计</text><text x="800" y="792" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">多数团队两个都用：一个干标准化的活，一个啃需要沉淀的任务</text></svg>