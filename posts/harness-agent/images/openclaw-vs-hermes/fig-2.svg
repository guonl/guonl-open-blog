<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">技能从哪来：写出来的，还是长出来的</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">区别不在自动化程度，而在验证的顺序</text><rect x="80" y="220" width="680" height="500" rx="18" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="116" y="286" fill="#0891B2" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">人工编写 + 社区共享</text><text x="116" y="322" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">先验证，再落地</text><text x="126" y="400" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 一份技能是一段可读的配置</text><text x="126" y="466" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 谁写的、改了什么，一查便知</text><text x="126" y="532" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 据报道社区技能已到数万级别</text><text x="126" y="598" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 好处：可控、可审计</text><rect x="840" y="220" width="680" height="500" rx="18" fill="#7C3AED" fill-opacity="0.06" stroke="#7C3AED" stroke-width="3"/><text x="876" y="286" fill="#7C3AED" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">任务完成后自动提炼</text><text x="876" y="322" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">先落地，再补验证</text><text x="886" y="400" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 复盘执行过程，存成 Markdown</text><text x="886" y="466" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 下次同类任务自动检索注入</text><text x="886" y="532" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 技能会被持续打磨、不断长大</text><text x="886" y="598" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 风险：缺对照，可能经验污染</text><text x="800" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">自动生成的经验缺回放验证，完全可能是错的</text></svg>