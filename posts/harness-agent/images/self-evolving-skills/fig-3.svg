<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">经验污染：一次错误会自己长大</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">缺了对照验证，错误技能被反复引用，越滚越大</text><rect x="180" y="280" width="520" height="120" rx="16" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="3"/><text x="440.0" y="336.0" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1. 一次执行出错</text><text x="440.0" y="371.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">绕过根因或侥幸成功</text><rect x="900" y="280" width="520" height="120" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="1160.0" y="336.0" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2. 被沉淀成错误技能</text><text x="1160.0" y="371.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">复盘时没人对照</text><rect x="900" y="580" width="520" height="120" rx="16" fill="#DC2626" fill-opacity="0.14" stroke="#DC2626" stroke-width="3"/><text x="1160.0" y="636.0" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3. 后续任务反复引用</text><text x="1160.0" y="671.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">检索命中，照着做</text><rect x="180" y="580" width="520" height="120" rx="16" fill="#DC2626" fill-opacity="0.18" stroke="#DC2626" stroke-width="3"/><text x="440.0" y="636.0" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4. 错误被进一步放大</text><text x="440.0" y="671.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">又被复盘、又被沉淀</text><line x1="700" y1="340" x2="900" y2="340" stroke="#DC2626" stroke-width="4" marker-end="url(#aDC2626)"/><text x="800" y="322" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">复盘入库</text><line x1="1160" y1="400" x2="1160" y2="580" stroke="#DC2626" stroke-width="4" marker-end="url(#aDC2626)"/><text x="1174" y="490" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">检索命中</text><line x1="900" y1="640" x2="700" y2="640" stroke="#DC2626" stroke-width="4" marker-end="url(#aDC2626)"/><text x="800" y="622" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">执行</text><line x1="440" y1="580" x2="440" y2="400" stroke="#DC2626" stroke-width="4" marker-end="url(#aDC2626)"/><text x="426" y="490" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">再沉淀</text><text x="800" y="490" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">循环一圈，错误深一层</text><text x="800" y="800" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">技能库像一本不断加印的教材：第一版混进一个错误知识点，后面每一版都照着它编</text></svg>