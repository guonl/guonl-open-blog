<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">技能沉淀：一条会自己转起来的闭环</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">执行、复盘、提炼、入库、检索、复用，六个环节首尾相接</text><rect x="180" y="250" width="340" height="120" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="350.0" y="306.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1. 执行任务</text><text x="350.0" y="342.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">留下完整的执行轨迹</text><rect x="630" y="250" width="340" height="120" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="800.0" y="306.0" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2. 复盘</text><text x="800.0" y="342.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">回读轨迹，找成功路径</text><rect x="1080" y="250" width="340" height="120" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1250.0" y="306.0" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3. 提炼技能文件</text><text x="1250.0" y="342.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">写成结构化 Markdown</text><rect x="1080" y="600" width="340" height="120" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1250.0" y="656.0" fill="#7C3AED" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4. 存入技能库</text><text x="1250.0" y="692.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">落到本地目录</text><rect x="630" y="600" width="340" height="120" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="800.0" y="656.0" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5. 检索</text><text x="800.0" y="692.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">按任务类型匹配</text><rect x="180" y="600" width="340" height="120" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="350.0" y="656.0" fill="#DC2626" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">6. 复用</text><text x="350.0" y="692.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">注入上下文，照着做</text><line x1="520" y1="310.0" x2="630" y2="310.0" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="970" y1="310.0" x2="1080" y2="310.0" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="1250.0" y1="370" x2="1250.0" y2="600" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="1264.0" y="485.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">任务结束即沉淀</text><line x1="1080" y1="660.0" x2="970" y2="660.0" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="630" y1="660.0" x2="520" y2="660.0" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="350.0" y1="600" x2="350.0" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="336.0" y="485.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">下一轮任务</text><text x="800" y="500" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">技能库每转一圈，就厚一分</text><text x="800" y="800" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">闭环的关键在第二步和第五步：复盘的质量决定技能对不对，检索的精度决定用不用得上</text></svg>