<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker><marker id="a16A34A" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#16A34A"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" font-weight="700">Chatbot 会说话，Agent 会干活</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" font-weight="400">同样是「看看服务器 CPU 是否过载」，两者的差别在哪</text><rect x="60" y="150" width="700" height="650" rx="22" fill="#0891B2" fill-opacity="0.045" stroke="#CBD5E1" stroke-width="3"/><text x="410.0" y="198" fill="#0891B2" font-size="30" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">普通 Chatbot：只会说</text><rect x="130" y="250" width="560" height="120" rx="22" fill="#0891B2" fill-opacity="0.08" stroke="#0891B2" stroke-width="3"/><path d="M170,370 L204,370 L176,394 Z" fill="#0891B2" fill-opacity="0.08" stroke="#0891B2" stroke-width="3"/><text x="410.0" y="319.0" fill="#0891B2" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="600">问：服务器 CPU 是不是过载了？</text><rect x="200" y="400" width="490" height="120" rx="22" fill="#0891B2" fill-opacity="0.08" stroke="#0891B2" stroke-width="3"/><path d="M616,520 L650,520 L644,544 Z" fill="#0891B2" fill-opacity="0.08" stroke="#0891B2" stroke-width="3"/><text x="445.0" y="469.0" fill="#0891B2" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="600">答：建议你登录服务器自己看看。</text><circle cx="160" cy="592" r="20" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="3"/><path d="M151.0,583.0 L169.0,601.0 M169.0,583.0 L151.0,601.0" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round"/><text x="200" y="600" fill="#64748B" font-size="21" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="start" font-weight="400">不能获取实时数据，只能靠训练时的知识猜</text><circle cx="160" cy="654" r="20" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="3"/><path d="M151.0,645.0 L169.0,663.0 M169.0,645.0 L151.0,663.0" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round"/><text x="200" y="662" fill="#64748B" font-size="21" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="start" font-weight="400">不能产生副作用，改不了任何东西</text><circle cx="160" cy="716" r="20" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="3"/><path d="M151.0,707.0 L169.0,725.0 M169.0,707.0 L151.0,725.0" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round"/><text x="200" y="724" fill="#64748B" font-size="21" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="start" font-weight="400">只有一步，失败只能重新问一遍</text><rect x="840" y="150" width="700" height="650" rx="22" fill="#2563EB" fill-opacity="0.045" stroke="#CBD5E1" stroke-width="3"/><text x="1190.0" y="198" fill="#2563EB" font-size="30" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">AI Agent：会干活</text><circle cx="960" cy="288.0" r="36" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="3"/><rect x="908.0" y="330.0" width="104" height="140" rx="43.68" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="3"/><text x="960" y="518.0" fill="#2563EB" font-size="26" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">Agent</text><rect x="1150" y="250" width="330" height="78" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1315.0" y="297.75" fill="#D97706" font-size="25" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">查监控接口</text><line x1="1022" y1="400" x2="1150" y2="289" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><rect x="1150" y="370" width="330" height="78" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1315.0" y="417.75" fill="#D97706" font-size="25" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">执行重启命令</text><line x1="1022" y1="400" x2="1150" y2="409" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><rect x="1150" y="490" width="330" height="78" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1315.0" y="537.75" fill="#D97706" font-size="25" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">读取日志</text><line x1="1022" y1="400" x2="1150" y2="529" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><rect x="1150" y="620" width="330" height="96" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1315.0" y="676.05" fill="#16A34A" font-size="23" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">已重启服务，恢复正常</text><circle cx="1050" cy="668" r="26" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M1038.3,668 L1047.4,678.4 L1063.0,658.9" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="1022" y1="470" x2="1120" y2="660" stroke="#16A34A" stroke-width="3" marker-end="url(#a16A34A)"/><text x="800" y="858" fill="#0F172A" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">Chatbot 是「输入文本、输出文本」的一次性函数；Agent 是「输入目标、输出结果」的循环</text></svg>