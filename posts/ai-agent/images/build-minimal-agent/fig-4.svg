<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" font-weight="700">把错误回传给模型，让它自我修正</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" font-weight="400">工具出错不要抛异常，转成结构化 error 交给模型处理</text><rect x="60" y="280" width="340" height="170" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="230.0" y="361.0" fill="#DC2626" font-size="25" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">① 工具执行失败</text><text x="230.0" y="397.0" fill="#64748B" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="400">暂不支持城市：纽约</text><rect x="440" y="280" width="340" height="170" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="610.0" y="361.0" fill="#D97706" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">② 包装成结构化错误</text><text x="610.0" y="397.0" fill="#64748B" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="400">{"error": "..."}</text><rect x="820" y="280" width="340" height="170" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="990.0" y="361.0" fill="#2563EB" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">③ 作为观察结果回传</text><text x="990.0" y="397.0" fill="#64748B" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="400">role=tool + tool_call_id</text><rect x="1200" y="280" width="340" height="170" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="1370.0" y="361.0" fill="#0891B2" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">④ 模型读错误、换策略</text><text x="1370.0" y="397.0" fill="#64748B" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="400">换城市 / 告知用户 / 换工具</text><line x1="400" y1="365" x2="440" y2="365" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="780" y1="365" x2="820" y2="365" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="1160" y1="365" x2="1200" y2="365" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><path d="M1370,450 L1370,600 L230,600 L230,452" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><text x="800" y="585" fill="#2563EB" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">回到 ①，重新发起调用</text><text x="800" y="730" fill="#DC2626" font-size="30" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">{"error": "暂不支持城市：纽约"}</text><text x="800" y="800" fill="#0F172A" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">模型读到错误后会改主意：换个城市、如实告知用户、或改用其它工具</text><text x="800" y="850" fill="#64748B" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">原则：任何问题都转成结构化错误信息，而不是抛异常把程序搞崩</text></svg>