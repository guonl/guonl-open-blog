<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" font-weight="700">工具描述怎么写才准</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" font-weight="400">name / description / parameters 三段结构，就是模型的「岗位说明书」</text><rect x="80" y="190" width="720" height="600" rx="16" fill="#0B1220" stroke="#CBD5E1" stroke-width="2"/><rect x="80" y="190" width="720" height="40" rx="16" fill="#16233B"/><circle cx="106" cy="210" r="7" fill="#EF4444"/><circle cx="132" cy="210" r="7" fill="#F59E0B"/><circle cx="158" cy="210" r="7" fill="#22C55E"/><text x="104" y="262" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">{</text><text x="126" y="292" fill="#7DD3FC" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"type": "function",</text><text x="126" y="322" fill="#7DD3FC" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"function": {</text><text x="148" y="352" fill="#86EFAC" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"name": "get_weather",</text><text x="148" y="382" fill="#86EFAC" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif">"description": "查询指定城市的当前天气，当用户询问天气时使用",</text><text x="148" y="412" fill="#7DD3FC" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"parameters": {</text><text x="170" y="442" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"type": "object",</text><text x="170" y="472" fill="#7DD3FC" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"properties": {</text><text x="192" y="502" fill="#7DD3FC" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"city": {</text><text x="214" y="532" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"type": "string",</text><text x="214" y="562" fill="#86EFAC" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif">"description": "城市名称，例如：北京、上海"</text><text x="192" y="592" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">}</text><text x="170" y="622" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">},</text><text x="170" y="652" fill="#FCD34D" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">"required": ["city"]</text><text x="148" y="682" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">}</text><text x="126" y="712" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">}</text><text x="104" y="742" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace">}</text><text x="440" y="828" fill="#64748B" font-size="22" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">工具清单会原封不动发给模型，措辞直接决定调用成功率</text><rect x="860" y="190" width="660" height="180" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="1190.0" y="276.0" fill="#2563EB" font-size="27" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">name：函数名</text><text x="1190.0" y="312.0" fill="#64748B" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="400">模型的点名依据，唯一、动词开头</text><line x1="806" y1="280" x2="860" y2="280" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="860" y="400" width="660" height="180" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="1190.0" y="486.0" fill="#0891B2" font-size="27" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">description：什么时候用</text><text x="1190.0" y="522.0" fill="#64748B" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="400">决定模型会不会调、何时调，写清触发场景</text><line x1="806" y1="490" x2="860" y2="490" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="860" y="610" width="660" height="180" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1190.0" y="696.0" fill="#D97706" font-size="27" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">parameters：参数格式</text><text x="1190.0" y="732.0" fill="#64748B" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="400">类型 + 说明 + 示例，required 标注必填</text><line x1="806" y1="700" x2="860" y2="700" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/></svg>