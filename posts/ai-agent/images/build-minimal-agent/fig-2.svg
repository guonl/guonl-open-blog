="520" y1="312" x2="520" y2="350" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><polygon points="520,350 700,440 520,530 340,440" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="520" y="449" fill="#D97706" font-size="26" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">模型是否请求工具？</text><line x1="700" y1="440" x2="790" y2="440" stroke="#16A34A" stroke-width="3" marker-end="url(#a16A34A)"/><text x="745.0" y="424.0" fill="#16A34A" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">否</text><rect x="790" y="395" width="400" height="90" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="990.0" y="448.4" fill="#16A34A" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">返回最终回答（结束）</text><line x1="520" y1="530" x2="520" y2="580" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><text x="520.0" y="539.0" fill="#2563EB" font-size="20" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="500">是</text><rect x="370" y="580" width="300" height="72" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="520.0" y="624.4" fill="#2563EB" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">执行工具（真实函数）</text><line x1="520" y1="652" x2="520" y2="690" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><rect x="370" y="690" width="300" height="72" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="520.0" y="734.4" fill="#0891B2" font-size="24" font-family="'Heiti SC','STHeiti','Hiragino Sans GB',sans-serif" text-anchor="middle" font-weight="700">回填 tool 消息</text><line x1="520" y1="762" x2="520" y2="786" stroke="#0891B2" strok