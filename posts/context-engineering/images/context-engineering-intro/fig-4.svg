<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">系统化落地：R-C-A-M 四层方法</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">四层：Retrieve · Compress · Arrange · Maintain</text><path d="M180,160 L1420,160 L1320,278 L280,278 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="800" y="214" fill="#2563EB" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">Retrieve 获取</text><text x="800" y="250" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">把对的信息拿进来 · 决定『有什么』</text><path d="M280,278 L1320,278 L1220,396 L380,396 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="800" y="332" fill="#0891B2" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">Compress 压缩</text><text x="800" y="368" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">把信息瘦身 · 决定『留多少』</text><path d="M380,396 L1220,396 L1120,514 L480,514 Z" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="800" y="450" fill="#D97706" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">Arrange 编排</text><text x="800" y="486" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">把信息放到对的位置 · 决定『放哪里』</text><path d="M480,514 L1120,514 L1020,632 L580,632 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="800" y="568" fill="#16A34A" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">Maintain 维护</text><text x="800" y="604" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">管理上下文的生命周期 · 决定『何时变』</text><path d="M580,632 L1020,632 L880,706 L720,706 Z" fill="#64748B" fill-opacity="0.10" stroke="#64748B" stroke-width="3"/><text x="800" y="682" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">有效上下文</text><text x="800" y="790" fill="#0F172A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">四层环环相扣：缺一层，长链路任务就会暴露问题</text></svg>