<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">上下文窗口的 token 预算</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">把窗口当成一份有限的预算，每块信息都要问一句：值不值这个价</text><rect x="120" y="300" width="204" height="130" rx="8" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="3"/><text x="222.0" y="274" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">系统提示</text><text x="222.0" y="377.0" fill="#2563EB" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">15%</text><rect x="324" y="300" width="340" height="130" rx="8" fill="#0891B2" fill-opacity="0.16" stroke="#0891B2" stroke-width="3"/><text x="494.0" y="274" fill="#0891B2" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">历史对话</text><text x="494.0" y="377.0" fill="#0891B2" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">25%</text><rect x="664" y="300" width="408" height="130" rx="8" fill="#D97706" fill-opacity="0.16" stroke="#D97706" stroke-width="3"/><text x="868.0" y="274" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">工具输出</text><text x="868.0" y="377.0" fill="#D97706" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">30%</text><rect x="1072" y="300" width="272" height="130" rx="8" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-width="3"/><text x="1208.0" y="274" fill="#7C3AED" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">检索资料</text><text x="1208.0" y="377.0" fill="#7C3AED" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">20%</text><rect x="1344" y="300" width="136" height="130" rx="8" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-width="3"/><text x="1412.0" y="274" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">留给回答</text><text x="1412.0" y="377.0" fill="#16A34A" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">10%</text><text x="800" y="486" fill="#64748B" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">窗口越大，不等于有效上下文越多：位置与相关性同样决定信息能否被用上</text><rect x="120" y="530" width="430" height="190" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="335.0" y="621.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">token 预算是真金白银</text><text x="335.0" y="656.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">长度线性增长，调用次数是乘法</text><rect x="585" y="530" width="430" height="190" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="800.0" y="621.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">注意力会衰减</text><text x="800.0" y="656.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">迷失在中间：首尾牢，中间易忽略</text><rect x="1050" y="530" width="430" height="190" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1265.0" y="621.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">无关信息是干扰源</text><text x="1265.0" y="656.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">辨识噪声本身就增加出错概率</text><text x="800" y="800" fill="#0F172A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">结论：窗口虽大，有效上下文依然是稀缺资源</text></svg>