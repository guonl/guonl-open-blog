<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">现实里的组合拳：仿真打底，真机精修</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">两条路子常常叠在一起用</text><text x="80" y="200" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">路线一：先在仿真里大规模试错</text><rect x="80" y="230" width="380" height="140" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="270.0" y="296.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">仿真大规模训练</text><text x="270.0" y="331.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">几千个环境并行试错</text><line x1="460" y1="300" x2="540" y2="300" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="540" y="230" width="380" height="140" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="730.0" y="296.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">域随机化</text><text x="730.0" y="331.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">摩擦、质量、延迟随机取</text><line x1="920" y1="300" x2="1000" y2="300" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="1000" y="230" width="440" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1220.0" y="296.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真机少量微调</text><text x="1220.0" y="331.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">几百到几千条数据</text><text x="80" y="510" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">路线二：先有起点，再谈提升</text><rect x="80" y="540" width="380" height="140" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="270.0" y="606.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">模仿学习打底</text><text x="270.0" y="641.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">示教给出可用起点</text><line x1="460" y1="610" x2="540" y2="610" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="540" y="540" width="380" height="140" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="730.0" y="606.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">强化学习精修</text><text x="730.0" y="641.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">在起点附近探索提升</text><line x1="920" y1="610" x2="1000" y2="610" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="1000" y="540" width="440" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1220.0" y="606.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">能跑通的策略</text><text x="1220.0" y="641.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">仿真负责试错，真机负责落地</text><text x="800" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">强化学习最怕没有信号，给一个好起点，搜索范围就小得多</text></svg>