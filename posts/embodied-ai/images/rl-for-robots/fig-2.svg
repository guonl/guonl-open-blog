<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">同样一小时，两个世界的交互量差几个数量级</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">以下为量级估算，不代表精确倍数</text><rect x="100" y="190" width="1400" height="250" rx="18" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="2"/><text x="140" y="252" fill="#DC2626" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">真机交互</text><text x="140" y="294" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每个 episode 要真机执行，还要人工把场景摆回去</text><rect x="140" y="330" width="1320" height="56" rx="12" fill="#E2E8F0"/><rect x="140" y="330" width="80" height="56" rx="12" fill="#DC2626" fill-opacity="0.8"/><text x="250" y="368" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">每秒几条</text><text x="1460" y="312" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">一天约一千次</text><rect x="100" y="490" width="1400" height="250" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="2"/><text x="140" y="552" fill="#2563EB" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">仿真交互</text><text x="140" y="594" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">几千个环境并行，每一步都只是数值计算</text><rect x="140" y="630" width="1320" height="56" rx="12" fill="#E2E8F0"/><rect x="140" y="630" width="1320" height="56" rx="12" fill="#2563EB" fill-opacity="0.8"/><text x="1460" y="612" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">每秒成千上万条</text><text x="800" y="810" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">样本效率这道坎，靠调代码补不上</text></svg>