<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">安全验证清单</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">重点不是跑通正常流程，而是覆盖各种坏掉的方式</text><rect x="90" y="210" width="460" height="500" rx="20" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="3"/><circle cx="320.0" cy="288" r="34" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><path d="M304.7,288 L316.6,301.6 L337.0,276.1" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="320.0" y="378" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">硬件安全功能独立验证</text><text x="134" y="458" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 急停按钮、光栅、看门狗单独测</text><text x="134" y="520" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 用外部仪器测响应时间</text><text x="134" y="582" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 不能只信软件自己报的日志</text><rect x="580" y="210" width="460" height="500" rx="20" fill="#7C3AED" fill-opacity="0.07" stroke="#7C3AED" stroke-width="3"/><circle cx="810.0" cy="288" r="34" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="3"/><path d="M794.7,288 L806.6,301.6 L827.0,276.1" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="810.0" y="378" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">软件故障注入</text><text x="624" y="458" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 让传感器报错</text><text x="624" y="520" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 让通信丢包、节点挂掉</text><text x="624" y="582" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 让时间戳跳变</text><rect x="1070" y="210" width="460" height="500" rx="20" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><circle cx="1300.0" cy="288" r="34" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><path d="M1284.7,288 L1296.6,301.6 L1317.0,276.1" fill="none" stroke="#D97706" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="1300.0" y="378" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">异常场景覆盖</text><text x="1114" y="458" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 传感器坏掉一种、两种</text><text x="1114" y="520" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 通信断掉一路、全部</text><text x="1114" y="582" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 突然断电、人突然出现</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">不去证明系统能正常工作，而去证明系统在坏掉时仍然安全</text></svg>