<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">为什么安全逻辑不能交给大模型</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">两者对确定性和可验证性的要求完全相反</text><rect x="90" y="200" width="660" height="500" rx="20" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="3"/><circle cx="150" cy="262" r="30" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M136.5,248.5 L163.5,275.5 M163.5,248.5 L136.5,275.5" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="200" y="274" fill="#DC2626" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">学习策略（大模型）</text><text x="130" y="372" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 输出不确定，同一输入可能给出两种结果</text><text x="130" y="430" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 内部参数难以逐条解释</text><text x="130" y="488" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 没见过的情况上突然失效</text><rect x="130" y="560" width="580" height="106" rx="14" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 8"/><text x="158" y="600" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">模型输出</text><text x="158" y="640" fill="#0F172A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">“我认为现在很危险”</text><rect x="850" y="200" width="660" height="500" rx="20" fill="#16A34A" fill-opacity="0.07" stroke="#16A34A" stroke-width="3"/><circle cx="910" cy="262" r="30" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M896.5,262 L907.0,274.0 L925.0,251.5" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="960" y="274" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">安全层（独立逻辑）</text><text x="890" y="372" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 行为确定，同一输入同一结果</text><text x="890" y="430" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 逻辑简单，可以逐条读懂</text><text x="890" y="488" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 可被反复测试与形式化验证</text><rect x="890" y="560" width="580" height="106" rx="14" fill="#16A34A" fill-opacity="0.06" stroke="#16A34A" stroke-width="2" stroke-dasharray="8 8"/><text x="918" y="600" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">安全规则</text><text x="918" y="640" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">“若光栅被遮挡，则 50 毫秒内切断动力”</text><line x1="800" y1="226" x2="800" y2="674" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/><text x="800" y="456" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">分层</text><text x="800" y="786" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">安全要的是确定性与可验证性，所以它必须和学习策略分层隔离</text></svg>