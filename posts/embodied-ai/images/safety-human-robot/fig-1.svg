<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">安全的五个层次</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">从底到上堆叠，越往下越不依赖软件</text><line x1="120" y1="770" x2="120" y2="200" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="120" y="178" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">自下而上</text><rect x="180" y="658.0" width="1240" height="108.0" rx="12" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="3"/><text x="208" y="706.0" fill="#64748B" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">硬件与机械层</text><text x="208" y="736.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">限位、机械止挡、力矩限制、柔顺关节、急停按钮</text><rect x="180" y="542.0" width="1240" height="108.0" rx="12" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="208" y="590.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">感知层</text><text x="208" y="620.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">安全光栅、激光雷达安全区、深度相机检测人</text><rect x="180" y="426.0" width="1240" height="108.0" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="208" y="474.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">控制层</text><text x="208" y="504.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">力矩限制、碰撞检测、柔顺控制</text><rect x="180" y="310.0" width="1240" height="108.0" rx="12" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="3"/><text x="208" y="358.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">规划层</text><text x="208" y="388.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">速度缩放、受限工作空间、禁止区域</text><rect x="180" y="194.0" width="1240" height="108.0" rx="12" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="208" y="242.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">系统层</text><text x="208" y="272.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">安全状态机、看门狗、急停链路、故障降级</text><text x="800" y="828" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">最下面一层不依赖任何软件，也是其他一切都失效时唯一还成立的防线</text></svg>