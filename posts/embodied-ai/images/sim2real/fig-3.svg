<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">系统辨识：让仿真去对齐真机</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">把真机参数测出来填进仿真模型，再训练、再验证，循环往复</text><rect x="70" y="300" width="300" height="140" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="220.0" y="366.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真机测参数</text><text x="220.0" y="401.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">摩擦、质量、延迟</text><rect x="470" y="300" width="300" height="140" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="620.0" y="366.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">更新仿真模型</text><text x="620.0" y="401.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">把数值填进引擎</text><rect x="870" y="300" width="300" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1020.0" y="366.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">在仿真里训练</text><text x="1020.0" y="401.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">大规模并行训练</text><rect x="1270" y="300" width="300" height="140" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1420.0" y="366.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">部署真机验证</text><text x="1420.0" y="401.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">看真实表现</text><line x1="372" y1="370" x2="468" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="772" y1="370" x2="868" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="1172" y1="370" x2="1268" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><path d="M1420,445 Q820,600 220,445" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a64748B)"/><text x="820" y="625" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">根据验证结果再测一轮</text><rect x="70" y="670" width="1460" height="170" rx="18" fill="#64748B" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="728" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">能测的：摩擦、质量、延迟，可以参数化</text><text x="110" y="782" fill="#DC2626" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">难测的：接触的软性、复杂形变；参数还会随磨损和温度漂移</text></s