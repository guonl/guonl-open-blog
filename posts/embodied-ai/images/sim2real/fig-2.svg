<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">域随机化：让策略对参数不敏感</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">训练时在一堆参数上随机采样，策略的适用区间要覆盖真机参数的落点</text><rect x="430" y="280" width="700" height="220" rx="18" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="3" stroke-dasharray="10 8"/><text x="780" y="262" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">随机化采样范围</text><circle cx="470" cy="350" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="545" cy="410" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="615" cy="325" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="690" cy="440" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="765" cy="360" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="835" cy="465" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="905" cy="335" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="965" cy="420" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="1035" cy="375" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="1100" cy="455" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="525" cy="470" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="650" cy="470" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="745" cy="310" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="880" cy="310" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="1005" cy="470" r="9" fill="#0891B2" fill-opacity="0.75"/><circle cx="1090" cy="330" r="9" fill="#0891B2" fill-opacity="0.75"/><line x1="180" y1="530" x2="1430" y2="530" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="830" y="572" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">参数取值：摩擦、质量、光照、延迟…</text><circle cx="210" cy="566" r="9" fill="#0891B2" fill-opacity="0.75"/><text x="232" y="574" fill="#0891B2" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每个点是一轮训练采到的环境参数</text><line x1="980" y1="266" x2="980" y2="556" stroke="#DC2626" stroke-width="4"/><circle cx="980" cy="390" r="12" fill="#DC2626"/><text x="980" y="252" fill="#DC2626" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真机参数落点</text><line x1="430" y1="640" x2="1130" y2="640" stroke="#16A34A" stroke-width="4"/><line x1="430" y1="628" x2="430" y2="652" stroke="#16A34A" stroke-width="4"/><line x1="1130" y1="628" x2="1130" y2="652" stroke="#16A34A" stroke-width="4"/><text x="780" y="676" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">策略适用区间（覆盖随机化范围）</text><rect x="120" y="730" width="620" height="130" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="430.0" y="791.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">范围太小</text><text x="430.0" y="826.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">真机参数落在范围外，策略没见过</text><rect x="860" y="730" width="620" height="130" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="1170.0" y="791.0" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">范围太大</text><text x="1170.0" y="826.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">策略变保守，甚至学不动</text></svg>