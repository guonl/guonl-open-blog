<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">迁移难度分层</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">任务越依赖接触和力，越难迁移，需要的真机数据也越多</text><rect x="80" y="200" width="680" height="560" rx="18" fill="#16A34A" fill-opacity="0.08" stroke="#16A34A" stroke-width="3"/><text x="120" y="268" fill="#16A34A" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">较易迁移</text><text x="120" y="314" fill="#64748B" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">慢速、准静态、视觉为主</text><text x="130" y="386" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 抓一个静止的物体</text><text x="130" y="440" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 按固定轨迹操作</text><text x="130" y="494" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 允许反复调整</text><line x1="120" y1="560" x2="720" y2="560" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="120" y="612" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">真机数据需求：少</text><text x="120" y="656" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">仿真训练加域随机化常常就够用</text><rect x="840" y="200" width="680" height="560" rx="18" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="3"/><text x="880" y="268" fill="#DC2626" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">最难迁移</text><text x="880" y="314" fill="#64748B" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">快速、强接触、力控为主</text><text x="890" y="386" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 插拔、拧螺丝</text><text x="890" y="440" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 灵巧手在手里的操作</text><text x="890" y="494" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 半拍之差就错过时机</text><line x1="880" y1="560" x2="1480" y2="560" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="880" y="612" fill="#DC2626" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">真机数据需求：多</text><text x="880" y="656" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">往往必须用真机数据</text><defs><linearGradient id="diffgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#DC2626"/></linearGradient></defs><rect x="80" y="805" width="1440" height="44" rx="22" fill="url(#diffgrad)" fill-opacity="0.85"/><text x="90" y="878" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">依赖接触力少</text><text x="1510" y="878" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">依赖接触力多</text></svg>