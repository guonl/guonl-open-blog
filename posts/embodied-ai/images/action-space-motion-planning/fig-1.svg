<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker><marker id="aD97706" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#D97706"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">关节空间与笛卡尔空间</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">同一个姿势有两种坐标，两条换算通路各管一个方向</text><rect x="80" y="250" width="620" height="550" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="312" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">关节空间</text><text x="112" y="348" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">坐标是每个关节的角度</text><text x="150" y="424" fill="#0F172A" font-size="26" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">q1 = 35</text><text x="150" y="476" fill="#0F172A" font-size="26" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">q2 = -20</text><text x="150" y="528" fill="#0F172A" font-size="26" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">q3 = 90</text><text x="150" y="580" fill="#0F172A" font-size="26" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">q4 = 0</text><text x="150" y="632" fill="#0F172A" font-size="26" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">q5 = 45</text><text x="150" y="684" fill="#0F172A" font-size="26" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">q6 = 15</text><text x="390" y="758" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">六个数字唯一确定机器人此刻的姿势</text><rect x="900" y="250" width="620" height="550" rx="18" fill="#0891B2" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="932" y="312" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">笛卡尔空间</text><text x="932" y="348" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">坐标是末端的位置和姿态</text><text x="970" y="410" fill="#0F172A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">位置  x, y, z</text><text x="970" y="456" fill="#0F172A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">姿态  roll, pitch, yaw</text><rect x="990" y="686" width="34" height="20" rx="5" fill="#0891B2" fill-opacity="0.7"/><polyline points="1007,686 1120,600 1250,536" fill="none" stroke="#0891B2" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1007" cy="686" r="11" fill="#FFFFFF" stroke="#0891B2" stroke-width="5"/><circle cx="1120" cy="600" r="11" fill="#FFFFFF" stroke="#0891B2" stroke-width="5"/><circle cx="1250" cy="536" r="11" fill="#FFFFFF" stroke="#0891B2" stroke-width="5"/><circle cx="1352" cy="498" r="11" fill="#16A34A"/><text x="1352" y="462" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">目标位姿</text><text x="1210" y="758" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">同样六个数字描述手在哪、朝向如何</text><line x1="715" y1="400" x2="885" y2="400" stroke="#2563EB" stroke-width="4" marker-end="url(#a2563EB)"/><text x="800" y="380" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">正运动学</text><line x1="885" y1="470" x2="715" y2="470" stroke="#D97706" stroke-width="4" marker-end="url(#aD97706)"/><text x="800" y="502" fill="#D97706" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">逆运动学</text></svg>