<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">逆运动学为什么难</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">同一个问题，三种不同的麻烦</text><rect x="80" y="240" width="460" height="520" rx="18" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="302" fill="#DC2626" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">无解</text><text x="112" y="340" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">目标够不到</text><circle cx="310" cy="560" r="130" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="3" stroke-dasharray="10 10"/><polyline points="310,640 380,560" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round"/><circle cx="310" cy="640" r="10" fill="#64748B"/><circle cx="466" cy="430" r="10" fill="#DC2626"/><text x="466" y="398" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">目标</text><text x="310" y="730" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">无论怎么转关节都到不了</text><rect x="570" y="240" width="460" height="520" rx="