 Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">奇异位形</text><text x="1092" y="340" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">手肘伸直时最危险</text><polyline points="1240,690 1240,590 1240,490" fill="none" stroke="#7C3AED" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1240,690 1266,592 1356,520" fill="none" stroke="#7C3AED" stroke-width="8" stroke-dasharray="12 10" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1240" cy="690" r="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/><circle cx="1240" cy="590" r="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/><circle cx="1240" cy="490" r="10" fill="#7C3AED"/><circle cx="1356" cy="520" r="10" fill="#7C3AED" fill-opacity="0.5"/><path d="M1252,476 Q1310,440 1352,506" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#aDC2626)"/><text x="1290" y="730" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">微小的手部移动需要巨大的关节变化</text></svg>