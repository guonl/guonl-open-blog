<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">路径与轨迹：差在时间上</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">同一条避障路线，一个只有形状，一个带时间与速度</text><rect x="80" y="225" width="1440" height="250" rx="18" fill="#2563EB" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="282" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">路径：只回答经过哪些位置，不带时间信息</text><rect x="700" y="320" width="150" height="80" rx="8" fill="#64748B" fill-opacity="0.16" stroke="#64748B" stroke-width="2"/><text x="775" y="368" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">障碍</text><path d="M210,424 Q700,530 1400,300" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#a2563EB)"/><circle cx="210" cy="424" r="11" fill="#16A34A"/><text x="210" y="400" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">起点</text><circle cx="1400" cy="300" r="11" fill="#16A34A"/><text x="1400" y="276" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">终点</text><text x="112" y="356" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">路径只管几何形状，只要求走不走得通</text><rect x="80" y="515" width="1440" height="320" rx="18" fill="#D97706" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="572" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">轨迹：给路径上的点配上时刻，还要满足速度和加速度限制</text><line x1="240" y1="800" x2="1440" y2="800" stroke="#64748B" stroke-width="2"/><line x1="240" y1="800" x2="240" y2="620" stroke="#64748B" stroke-width="2"/><path d="M240,800 C 440,800 640,650 840,650 C 1040,650 1240,800 1440,800" fill="none" stroke="#D97706" stroke-width="5"/><text x="214" y="660" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">速度</text><text x="1436" y="826" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">时间</text><text x="280" y="826" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">起点和终点速度为零，中间平滑升起再落回</text></svg>