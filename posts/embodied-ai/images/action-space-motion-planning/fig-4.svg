<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">从轨迹到电机</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">规划的输出要经过几层，才变成真实的转动</text><path d="M80.0,280 L336.0,280 L360.0,340.0 L336.0,400 L80.0,400 L104.0,340.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="228.0" y="350.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">轨迹路点</text><path d="M370.0,280 L626.0,280 L650.0,340.0 L626.0,400 L370.0,400 L394.0,340.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="518.0" y="350.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">插补</text><path d="M660.0,280 L916.0,280 L940.0,340.0 L916.0,400 L660.0,400 L684.0,340.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="808.0" y="350.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">伺服控制</text><path d="M950.0,280 L1206.0,280 L1230.0,340.0 L1206.0,400 L950.0,400 L974.0,340.0 Z" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="1098.0" y="350.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">力矩输出</text><path d="M1240.0,280 L1496.0,280 L1520.0,340.0 L1496.0,400 L1240.0,400 L1264.0,340.0 Z" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="3"/><text x="1388.0" y="350.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真实运动</text><path d="M1388,410 Q1100,530 808,410" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#aDC2626)"/><text x="1100" y="556" fill="#DC2626" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">编码器把实际位置反馈回来</text><rect x="80" y="620" width="700" height="180" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="430.0" y="706.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">慢回路：规划</text><text x="430.0" y="742.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">给出离散的关节路点，可以花几十毫秒甚至更久</text><rect x="820" y="620" width="700" height="180" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1170.0" y="706.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">快回路：插补与控制</text><text x="1170.0" y="742.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">每个周期算出力矩，频率在百赫兹到千赫兹</text></svg>