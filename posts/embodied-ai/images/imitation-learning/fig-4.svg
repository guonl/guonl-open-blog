<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a16A34A" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#16A34A"/></marker><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">模仿学习与强化学习的分工</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">模仿学习给一个能用的起点，强化学习在这个起点上继续往上推</text><line x1="180" y1="200" x2="180" y2="760" stroke="#CBD5E1" stroke-width="3"/><line x1="180" y1="760" x2="1520" y2="760" stroke="#CBD5E1" stroke-width="3"/><text x="180" y="175" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">任务成功率（示意）</text><text x="180" y="805" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">优化过程</text><path d="M180,730 C320,730 460,420 660,400 L900,398" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="730" r="9" fill="#2563EB"/><path d="M900,398 C1080,398 1200,290 1520,215" fill="none" stroke="#16A34A" stroke-width="6" stroke-linecap="round" marker-end="url(#a16A34A)"/><circle cx="900" cy="398" r="8" fill="#16A34A"/><text x="925" y="372" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">交给强化学习</text><line x1="900" y1="406" x2="900" y2="760" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/><text x="240" y="268" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">模仿学习</text><text x="240" y="312" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">· 从示教里直接学怎么做，不需要奖励函数</text><text x="240" y="348" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">· 起步快，但上限常常等于示教者</text><line x1="310" y1="388" x2="420" y2="528" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><text x="700" y="360" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">模仿学习的天花板</text><text x="1120" y="480" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">强化学习</text><text x="1120" y="516" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">· 靠奖励信号继续搜索，能超过示教者</text><text x="1120" y="552" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">· 需要仿真或真机反复交互，代价高</text><text x="1120" y="588" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">· 从模仿的起点出发，收敛更快</text><text x="800" y="850" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">实践中常用组合：先用示教数据训一个能用的策略，再用强化学习继续改进</text></svg>