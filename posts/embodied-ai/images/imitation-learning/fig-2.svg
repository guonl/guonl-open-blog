<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">分布偏移：一步跑偏，步步跑偏</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">策略的微小偏差改变了下一帧的观测，误差随步数放大</text><path d="M180,740 L1520,740 L1520,220 C1080,420 620,735 180,725 Z" fill="#DC2626" fill-opacity="0.08"/><line x1="180" y1="200" x2="180" y2="760" stroke="#CBD5E1" stroke-width="3"/><line x1="180" y1="760" x2="1520" y2="760" stroke="#CBD5E1" stroke-width="3"/><text x="180" y="175" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">与专家状态的偏差</text><text x="850" y="808" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">任务步数（时间）</text><text x="188" y="800" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">开始</text><text x="1512" y="800" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">任务结束</text><line x1="180" y1="740" x2="1520" y2="740" stroke="#64748B" stroke-width="3" stroke-dasharray="6 6"/><text x="1512" y="726" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',san