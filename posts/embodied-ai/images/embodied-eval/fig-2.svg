<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">现有基准大致分四类</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">各自测一个侧面，盲区也各不相同</text><rect x="80" y="226" width="680" height="240" rx="18" fill="#7C3AED" fill-opacity="0.06" stroke="#7C3AED" stroke-width="3"/><text x="116" y="292" fill="#7C3AED" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">认知类</text><text x="116" y="348" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">测的是理解</text><text x="116" y="392" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">指令解析、物体指代、视觉问答</text><text x="116" y="434" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">成本低、可复现，但离动手还远</text><rect x="840" y="226" width="680" height="240" rx="18" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="876" y="292" fill="#0891B2" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">导航类</text><text x="876" y="348" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">测的是移动</text><text x="876" y="392" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">点到点、找物体、避开障碍</text><text x="876" y="434" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">状态空间较小，仿真比较成熟</text><rect x="80" y="516" width="680" height="240" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="116" y="582" fill="#2563EB" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">操作类</text><text x="116" y="638" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">测的是动手</text><text x="116" y="682" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">抓取、放置、堆叠、开门、插拔、倒水</text><text x="116" y="724" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">数量最多，最贴近会不会干活</text><rect x="840" y="516" width="680" height="240" rx="18" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="3"/><text x="876" y="582" fill="#DC2626" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">安全类</text><text x="876" y="638" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">测的是不出事</text><text x="876" y="682" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">遇人停机、限力保护、异常安全停止</text><text x="876" y="724" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">数量最少，重要性最高</text><text x="800" y="828" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">还有一类是数据集本身的评测：把数据切成训练与测试，看泛化，便宜但容易被过拟合</text></svg>