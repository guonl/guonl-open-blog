<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker><marker id="a7C3AED" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7C3AED"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">一个机器人系统由哪些部分构成</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">传感器进来，动作出去，数据在下面兜住整个循环</text><rect x="80" y="300" width="300" height="140" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="230.0" y="366.0" fill="#0891B2" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">传感器</text><text x="230.0" y="399.0" fill="#64748B" font-size="17" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">相机、深度、IMU、力矩、触觉</text><rect x="460" y="300" width="300" height="140" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="610.0" y="366.0" fill="#2563EB" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">决策与规划</text><text x="610.0" y="399.0" fill="#64748B" font-size="17" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">模型推理、任务与路径规划</text><rect x="840" y="300" width="300" height="140" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="990.0" y="366.0" fill="#D97706" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">控制</text><text x="990.0" y="399.0" fill="#64748B" font-size="17" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">实时伺服环、关节指令</text><rect x="1220" y="300" width="300" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1370.0" y="366.0" fill="#16A34A" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">本体</text><text x="1370.0" y="399.0" fill="#64748B" font-size="17" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">机械结构、关节、末端执行器</text><line x1="385" y1="370" x2="455" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="420" y="344" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">观测</text><line x1="765" y1="370" x2="835" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="800" y="344" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">指令</text><line x1="1145" y1="370" x2="1215" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="1180" y="344" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">驱动</text><rect x="80" y="580" width="1440" height="140" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="800.0" y="646.0" fill="#7C3AED" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">数据</text><text x="800.0" y="682.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">真机采集、遥操作、仿真合成，用来训练和迭代上面的模型</text><line x1="230" y1="448" x2="230" y2="572" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a7C3AED)"/><text x="262" y="512" fill="#7C3AED" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">记录</text><line x1="610" y1="575" x2="610" y2="448" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a7C3AED)"/><text x="642" y="512" fill="#7C3AED" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">训练与微调</text><text x="800" y="790" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">本体决定能干什么，传感器决定看得见什么</text><text x="800" y="840" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">决策决定怎么干，控制决定干得稳不稳，数据决定它能不能越干越好</text></svg>