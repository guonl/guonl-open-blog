<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">为什么难：三条互相牵制的约束</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">单独解决任何一条都不算解决，它们会互相拉扯</text><rect x="80.0" y="230.0" width="453.3333333333333" height="420.0" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="306.66666666666663" y="436.0" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">物理世界不可逆</text><text x="306.66666666666663" y="471.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">撞坏了不能回滚，每次试错都有真实代价</text><rect x="573.3333333333333" y="230.0" width="453.3333333333333" height="420.0" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="799.9999999999999" y="436.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">数据稀缺</text><text x="799.9999999999999" y="471.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">真机采集慢且贵，失败样本很难复现</text><rect x="1066.6666666666665" y="230.0" width="453.3333333333333" height="420.0" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1293.3333333333333" y="436.0" fill="#7C3AED" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">实时性要求</text><text x="1293.3333333333333" y="471.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">控制环要毫秒级，模型算得慢就来不及</text><rect x="80" y="700" width="1440" height="120" rx="18" fill="#0F172A" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="752" fill="#0F172A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">要毫秒级就得用小模型，小模型要泛化又得靠海量数据</text><text x="800" y="794" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">而海量真机数据既慢又贵，三条约束就绕成了一个圈</text></svg>