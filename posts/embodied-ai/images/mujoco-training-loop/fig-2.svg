<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">环境接口的两个方法</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">算法那一侧只认识这四个返回值，换环境不用改训练代码</text><text x="110" y="196" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">reset：把世界恢复到初始状态</text><rect x="110" y="220" width="400" height="110" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="310.0" y="283.75" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">env.reset(seed=7)</text><line x1="520" y1="275" x2="596" y2="275" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="558.0" y="261.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">返回</text><rect x="606" y="220" width="440" height="110" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="826.0" y="271.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">初始观测 obs</text><text x="826.0" y="305.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">位置、速度、目标方向</text><rect x="1080" y="220" width="410" height="110" rx="16" fill="#64748B" fill-opacity="0.1" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8"/><text x="1285.0" y="271.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">种子决定这一局怎么摆</text><text x="1285.0" y="305.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">同一个种子必须给出同一局</text><text x="110" y="452" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">step：推进一步，返回四样东西</text><rect x="110" y="476" width="400" height="110" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="310.0" y="539.75" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">env.step(action)</text><line x1="520" y1="531" x2="596" y2="531" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="558.0" y="517.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">返回</text><rect x="606" y="476" width="430" height="110" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="821.0" y="527.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">观测 obs</text><text x="821.0" y="561.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">这一步看到什么</text><rect x="1070" y="476" width="430" height="110" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="1285.0" y="527.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">奖励 reward</text><text x="1285.0" y="561.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">刚才那一下得了几分</text><rect x="606" y="616" width="430" height="110" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="821.0" y="667.0" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">是否结束 done</text><text x="821.0" y="701.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">任务完成或步数用尽</text><rect x="1070" y="616" width="430" height="110" rx="16" fill="#64748B" fill-opacity="0.1" stroke="#64748B" stroke-width="3"/><text x="1285.0" y="667.0" fill="#64748B" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">附加信息 info</text><text x="1285.0" y="701.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">成功与否、离目标多远</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">Gymnasium 把 done 拆成 terminated 和 truncated</text><text x="800" y="840" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">完成后的状态和超时截断的状态，算回报的方式不一样</text></svg>