<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">仿真训练闭环：六块东西绕一圈</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">环境给出观测，策略给出动作，采样攒数据，更新改参数，评估在旁边打分</text><rect x="110" y="230" width="250" height="140" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="235.0" y="296.0" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">环境</text><text x="235.0" y="330.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">推进一步，返回观测与奖励</text><rect x="500" y="230" width="250" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="625.0" y="296.0" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">策略</text><text x="625.0" y="330.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">观测进，动作出</text><rect x="890" y="230" width="250" height="140" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="1015.0" y="296.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">采样</text><text x="1015.0" y="330.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">把一条条轨迹收进缓冲区</text><rect x="1280" y="230" width="250" height="140" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1405.0" y="296.0" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">更新</text><text x="1405.0" y="330.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">用缓冲区里的数据改参数</text><line x1="366" y1="300.0" x2="494" y2="300.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><line x1="756" y1="300.0" x2="884" y2="300.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><line x1="1146" y1="300.0" x2="1274" y2="300.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="430" y="258" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">观测</text><text x="820" y="258" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">动作</text><text x="1210" y="258" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">缓冲区</text><path d="M1500,380 L1500,790 L245,790" fill="none" stroke="#64748B" stroke-width="4"/><line x1="245" y1="790" x2="245" y2="388" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="870" y="760" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">新参数回到环境</text><rect x="890" y="560" width="250" height="140" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="1015.0" y="626.0" fill="#DC2626" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">评估</text><text x="1015.0" y="660.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">固定种子，另开一份题</text><path d="M625,380 L625,470 L1015,470" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 8"/><line x1="1015" y1="470" x2="1015" y2="552" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#aDC2626)"/><text x="830" y="442" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">拿另一批题考它</text><rect x="1230" y="560" width="220" height="140" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1340.0" y="626.0" fill="#7C3AED" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">日志与可视化</text><text x="1340.0" y="659.0" fill="#64748B" font-size="17" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">回报、成功率、轨迹回放</text><line x1="1146" y1="630" x2="1224" y2="630" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a64748B)"/><text x="1185" y="596" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">记录</text><text x="800" y="858" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">虚线只读不参与决策，实线是这个环真正流动的东西</text></svg>