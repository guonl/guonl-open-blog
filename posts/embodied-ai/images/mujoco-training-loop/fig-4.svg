<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">从 numpy 玩具环境升级到 MuJoCo</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">接口不动，物理、观测、并行规模这三处要换</text><rect x="110" y="176" width="620" height="72" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="420.0" y="221.45" fill="#0891B2" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">numpy 玩具环境</text><rect x="870" y="176" width="620" height="72" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1180.0" y="221.45" fill="#D97706" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">MuJoCo</text><rect x="110" y="276" width="620" height="120" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="420.0" y="332.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">物理：手写三条规则</text><text x="420.0" y="367.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">推子平移、接触推挤、滑动衰减</text><rect x="870" y="276" width="620" height="120" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1180.0" y="332.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">物理：MJCF 描述加求解器</text><text x="1180.0" y="367.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">接触、摩擦、约束、积分交给引擎</text><line x1="742" y1="336" x2="858" y2="336" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="110" y="418" width="620" height="120" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="420.0" y="474.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">观测：四个数字</text><text x="420.0" y="509.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">相对位置两维，目标方向两维</text><rect x="870" y="418" width="620" height="120" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1180.0" y="474.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">观测：几十维加图像</text><text x="1180.0" y="509.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">关节角、关节速度、力矩、相机</text><line x1="742" y1="478" x2="858" y2="478" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="110" y="560" width="620" height="120" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="420.0" y="616.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">动作：位移增量</text><text x="420.0" y="651.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">限幅到单步 6 厘米</text><rect x="870" y="560" width="620" height="120" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1180.0" y="616.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">动作：力矩或位置指令</text><text x="1180.0" y="651.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">策略学的是用多大力，不是走多远</text><line x1="742" y1="620" x2="858" y2="620" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="110" y="702" width="620" height="120" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="420.0" y="758.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">并行：numpy 批量推进</text><text x="420.0" y="793.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">1024 个环境，每秒一千万步</text><rect x="870" y="702" width="620" height="120" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1180.0" y="758.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">并行：多进程或 GPU 批量</text><text x="1180.0" y="793.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">上万个环境，走共享内存或 MJX</text><line x1="742" y1="762" x2="858" y2="762" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="800" y="862" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">换掉这三处之后，训练循环那几十行一个字都不用改</text></svg>