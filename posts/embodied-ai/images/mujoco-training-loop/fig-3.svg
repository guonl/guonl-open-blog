<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a0891B2" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#0891B2"/></marker><marker id="aCBD5E1" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#CBD5E1"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">并行采样：策略一份，环境一千份</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">仿真是唯一能同时跑一千个副本的地方，真机的上限是 1</text><rect x="110" y="180" width="420" height="96" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="320.0" y="224.0" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">策略</text><text x="320.0" y="259.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只有一份，参数共享</text><line x1="320" y1="284" x2="320" y2="348" stroke="#0891B2" stroke-width="4" marker-end="url(#a0891B2)"/><text x="350" y="330" fill="#0891B2" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">参数广播</text><rect x="110" y="360" width="420" height="70" rx="16" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="3"/><text x="320.0" y="403.05" fill="#2563EB" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-wei