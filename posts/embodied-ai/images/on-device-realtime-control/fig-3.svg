<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">分层架构：慢思考与快反应</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">大模型只在慢回路，控制环里永远是确定性的小控制器</text><rect x="140" y="190" width="1320" height="180" rx="20" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="3"/><text x="180" y="252" fill="#2563EB" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">高层：慢回路</text><text x="180" y="302" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">理解任务、拆解步骤、做规划；可以用大模型</text><text x="180" y="342" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">频率 1 - 10 Hz，几百毫秒的延迟可以接受</text><rect x="1220" y="216" width="200" height="54" rx="27" fill="#2563EB" fill-opacity="0.16"/><text x="1320" y="250" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">1 - 10 Hz</text><rect x="140" y="510" width="1320" height="180" rx="20" fill="#16A34A" fill-opacity="0.08" stroke="#16A34A" stroke-width="3"/><text x="180" y="572" fill="#16A34A" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">低层：快回路</text><text x="180" y="622" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">把意图变成关节指令，用小的专用控制器</text><text x="180" y="662" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">频率 100 Hz - kHz，要求确定、快速、可预测</text><rect x="1220" y="536" width="200" height="54" rx="27" fill="#16A34A" fill-opacity="0.16"/><text x="1320" y="570" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">100 Hz - kHz</text><line x1="700" y1="374" x2="700" y2="506" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="730" y="428" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">下发目标</text><line x1="980" y1="506" x2="980" y2="374" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="950" y="482" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">回传状态</text><text x="800" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">两层靠接口解耦：高层怎么变，低层的时序都不能变</text></svg>