<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">大模型的时间花在哪</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">一次推理的耗时分布，和控制周期不在一个量级</text><text x="160" y="214" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">控制环 100 Hz：整个周期 10 ms</text><rect x="160" y="240" width="1200" height="96" rx="16" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="3"/><rect x="160" y="240" width="120" height="96" rx="16" fill="#2563EB" fill-opacity="0.30"/><text x="300" y="298" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">留给计算 1 ms 左右</text><text x="160" y="452" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一次大模型推理：顺利的话几百毫秒</text><rect x="160" y="478" width="320" height="96" rx="14" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-width="3"/><text x="320.0" y="536" fill="#7C3AED" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">排队</text><rect x="480" y="478" width="240" height="96" rx="14" fill="#0891B2" fill-opacity="0.16" stroke="#0891B2" stroke-width="3"/><text x="600.0" y="536" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">预处理</text><rect x="720" y="478" width="480" height="96" rx="14" fill="#D97706" fill-opacity="0.16" stroke="#D97706" stroke-width="3"/><text x="960.0" y="536" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">逐 token 生成</text><rect x="1200" y="478" width="160" height="96" rx="14" fill="#64748B" fill-opacity="0.16" stroke="#64748B" stroke-width="3"/><text x="1280.0" y="536" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">网络往返</text><text x="800" y="660" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">两条横轴比例不同：上面整段代表 10 ms，下面整段代表约 300 ms</text><text x="800" y="712" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">控制环要的是确定，大模型给的是概率</text></svg>