<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">控制环有多快，预算有多紧</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">频率越高，留给单次决策的时间越少</text><rect x="80" y="250" width="440" height="56" rx="14" fill="#64748B" fill-opacity="0.07"/><text x="110" y="287" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">10 Hz</text><text x="500" y="287" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">周期 100 ms</text><rect x="560" y="250" width="860" height="56" rx="14" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-width="3"/><text x="584" y="287" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">留给计算约 20 ms</text><rect x="80" y="390" width="440" height="56" rx="14" fill="#64748B" fill-opacity="0.07"/><text x="110" y="427" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">100 Hz</text><text x="500" y="427" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">周期 10 ms</text><rect x="560" y="390" width="680" height="56" rx="14" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="3"/><text x="584" y="427" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">留给计算约 2 ms</text><rect x="80" y="530" width="440" height="56" rx="14" fill="#64748B" fill-opacity="0.07"/><text x="110" y="567" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">1000 Hz</text><text x="500" y="567" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">周期 1 ms</text><rect x="560" y="530" width="500" height="56" rx="14" fill="#0891B2" fill-opacity="0.16" stroke="#0891B2" stroke-width="3"/><text x="584" y="567" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">留给计算约 0.2 ms</text><rect x="80" y="670" width="440" height="56" rx="14" fill="#64748B" fill-opacity="0.07"/><text x="110" y="707" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">4000 Hz 以上</text><text x="500" y="707" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">周期 0.25 ms 以下</text><rect x="560" y="670" width="320" height="56" rx="14" fill="#DC2626" fill-opacity="0.16" stroke="#DC2626" stroke-width="3"/><text x="584" y="707" fill="#DC2626" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">留给计算约 0.05 ms</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">周期越短，留给单次决策的时间越少；kHz 级的环里，几百微秒就是全部预算</text></svg>