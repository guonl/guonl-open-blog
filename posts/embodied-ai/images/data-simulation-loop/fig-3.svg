<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">数据、模型与评测的关系</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">数据是原材料，模型是加工工艺，评测是质检</text><rect x="100" y="230" width="400" height="190" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="300.0" y="321.0" fill="#2563EB" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">数据</text><text x="300.0" y="357.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">原材料，决定了模型的上限</text><rect x="600" y="230" width="400" height="190" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="800.0" y="321.0" fill="#16A34A" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">模型</text><text x="800.0" y="357.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">加工工艺，迭代最快的一环</text><rect x="1100" y="230" width="400" height="190" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="1300.0" y="321.0" fill="#DC2626" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">评测</text><text x="1300.0" y="357.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">质检，判断有没有变好</text><line x1="500" y1="325" x2="596" y2="325" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><line x1="1000" y1="325" x2="1096" y2="325" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="100" y="520" width="400" height="150" rx="16" fill="#64748B" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><text x="300" y="572" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">现状</text><text x="300" y="620" fill="#2563EB" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">贵且少，采集靠人力</text><rect x="600" y="520" width="400" height="150" rx="16" fill="#64748B" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><text x="800" y="572" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">现状</text><text x="800" y="620" fill="#16A34A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">路线还没收敛</text><rect x="1100" y="520" width="400" height="150" rx="16" fill="#64748B" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><text x="1300" y="572" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">现状</text><text x="1300" y="620" fill="#DC2626" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">最不成熟，尺子还没造好</text><text x="800" y="760" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">任何一环弱了，整条线都出不了好产品</text><text x="800" y="806" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">具身智能当下的状态：原材料贵、工艺在快速迭代、质检最不成熟</text></svg>