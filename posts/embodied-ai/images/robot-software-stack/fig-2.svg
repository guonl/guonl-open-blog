<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a0891B2" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#0891B2"/></marker><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker><marker id="a7C3AED" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7C3AED"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">三种通信原语：话题、服务、动作</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">按这件事是一直在发生、还是发生一次来选</text><rect x="80" y="230" width="460" height="520" rx="20" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="310" y="296" fill="#0891B2" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">话题 Topic</text><rect x="210" y="322" width="200" height="52" rx="26" fill="#0891B2" fill-opacity="0.16"/><text x="310" y="356" fill="#0891B2" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">发布订阅</text><text x="120" y="440" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 发布者持续发，订阅者持续收</text><text x="120" y="502" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 单向、多对多、互不知道对方</text><text x="120" y="564" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 例：关节角广播、相机图像</text><rect x="120" y="640" width="380" height="90" rx="14" fill="#0891B2" fill-opacity="0.10" stroke="#0891B2" stroke-width="2" stroke-dasharray="8 8"/><text x="310" y="676" fill="#0891B2" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">持续发布，谁来订都收</text><line x1="150" y1="706" x2="470" y2="706" stroke="#0891B2" stroke-width="3" marker-end="url(#a0891B2)"/><rect x="570" y="230" width="460" height="520" rx="20" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="800" y="296" fill="#2563EB" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">服务 Service</text><rect x="700" y="322" width="200" height="52" rx="26" fill="#2563EB" fill-opacity="0.16"/><text x="800" y="356" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">请求响应</text><text x="610" y="440" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 客户端发请求，服务端返回结果</text><text x="610" y="502" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 双向、一对一、一次性</text><text x="610" y="564" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 例：能否走通、开关、查询</text><rect x="610" y="640" width="380" height="90" rx="14" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 8"/><text x="800" y="676" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">一来一回，等结果</text><line x1="640" y1="706" x2="750" y2="706" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><line x1="880" y1="706" x2="770" y2="706" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><rect x="1060" y="230" width="460" height="520" rx="20" fill="#7C3AED" fill-opacity="0.06" stroke="#7C3AED" stroke-width="3"/><text x="1290" y="296" fill="#7C3AED" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">动作 Action</text><rect x="1190" y="322" width="200" height="52" rx="26" fill="#7C3AED" fill-opacity="0.16"/><text x="1290" y="356" fill="#7C3AED" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">长任务</text><text x="1100" y="440" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 跑一会儿，中间回报进度</text><text x="1100" y="502" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 可以被监控，也可以中途取消</text><text x="1100" y="564" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 例：取一杯水、导航到点</text><rect x="1100" y="640" width="380" height="90" rx="14" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-width="2" stroke-dasharray="8 8"/><text x="1290" y="676" fill="#7C3AED" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">长任务，可取消</text><line x1="1130" y1="706" x2="1450" y2="706" stroke="#7C3AED" stroke-width="3" marker-end="url(#a7C3AED)"/><text x="800" y="812" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">选错原语不会立刻报错，但系统的性格会变差</text></svg>