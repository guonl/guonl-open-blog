<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">QoS 配错，数据就悄悄收不到</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">只有发布端和订阅端的 QoS 兼容，连接才会建立</text><rect x="80" y="230" width="660" height="210" rx="18" fill="#16A34A" fill-opacity="0.06" stroke="#16A34A" stroke-width="3"/><text x="112" y="288" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">可靠 reliable</text><text x="122" y="344" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 丢失会重传，每条消息都到</text><text x="122" y="392" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 适合控制指令、任务下发</text><rect x="80" y="470" width="660" height="210" rx="18" fill="#D97706" fill-opacity="0.06" stroke="#D97706" stroke-width="3"/><text x="112" y="528" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">尽力而为 best effort</text><text x="122" y="584" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 丢了就丢了，不重传</text><text x="122" y="632" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 适合图像、点云这类高频大数据</text><text x="112" y="740" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">历史深度：两端各缓存多少条，太浅会丢，太深会拿到过期数据</text><rect x="840" y="230" width="680" height="450" rx="18" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="870" y="288" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">配错时的表现</text><rect x="880" y="360" width="240" height="110" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1000.0" y="411.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">发布端</text><text x="1000.0" y="447.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">尽力而为</text><rect x="1240" y="360" width="240" height="110" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1360.0" y="411.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">订阅端</text><text x="1360.0" y="447.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">可靠</text><line x1="1120" y1="415" x2="1152" y2="415" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 6"/><line x1="1208" y1="415" x2="1240" y2="415" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 6"/><circle cx="1180" cy="415" r="30" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M1166.5,401.5 L1193.5,428.5 M1193.5,401.5 L1166.5,428.5" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="1180" y="340" fill="#DC2626" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">连接不建立</text><text x="1180" y="540" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">两端都不报错，只是安静地收不到数据</text><text x="870" y="620" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">排查顺序：先确认话题有数据，再对比两端 QoS</text></svg>