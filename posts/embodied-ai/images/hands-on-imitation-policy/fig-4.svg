<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">从玩具链路到真实项目，要补的四件事</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">同一套代码骨架，四个地方得换掉</text><rect x="120" y="190" width="620" height="66" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="430.0" y="232.1" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">这篇的玩具链路</text><rect x="860" y="190" width="620" height="66" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1170.0" y="232.1" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真实抓取项目</text><rect x="120" y="292" width="620" height="118" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="430.0" y="347.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">观测：五个数字</text><text x="430.0" y="382.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">末端 x/y、夹爪开合、目标 x/y</text><rect x="860" y="292" width="620" height="118" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1170.0" y="347.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">观测：相机图像加关节角度</text><text x="1170.0" y="382.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">视觉编码器压成特征，再和状态拼接</text><line x1="752" y1="351" x2="850" y2="351" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="120" y="432" width="620" height="118" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="430.0" y="487.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">动作：每步一个位移增量</text><text x="430.0" y="522.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">逐帧决策，漂移机会多</text><rect x="860" y="432" width="620" height="118" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1170.0" y="487.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">动作：动作分块</text><text x="1170.0" y="522.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">一次预测未来若干步，执行完再重新预测</text><line x1="752" y1="491" x2="850" y2="491" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="120" y="572" width="620" height="118" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="430.0" y="627.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">输出分布：均方误差回归</text><text x="430.0" y="662.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只能表达单峰的动作分布</text><rect x="860" y="572" width="620" height="118" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1170.0" y="627.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">输出分布：生成式建模</text><text x="1170.0" y="662.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">扩散策略、动作 token 化，保留多个峰</text><line x1="752" y1="631" x2="850" y2="631" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="120" y="712" width="620" height="118" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="430.0" y="767.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">数据：合成 200 条示教</text><text x="430.0" y="802.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">训练不到一分钟，随时可复现</text><rect x="860" y="712" width="620" height="118" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="1170.0" y="767.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">数据：真机遥操作</text><text x="1170.0" y="802.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">几万到几十万条，还要配数据增广</text><line x1="752" y1="771" x2="850" y2="771" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="800" y="866" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">换掉这四件之后，评估指标才是真的指标</text></svg>