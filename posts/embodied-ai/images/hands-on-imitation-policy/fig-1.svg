<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker><marker id="aD97706" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#D97706"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">一条抓取策略的完整链路</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">四个环节走一轮，每一环都留下能单独验证的产物</text><rect x="110" y="250" width="300" height="150" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="260.0" y="321.0" fill="#0891B2" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1. 合成示教数据</text><text x="260.0" y="356.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">200 条轨迹，带手抖和目标</text><rect x="470" y="250" width="300" height="150" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="620.0" y="321.0" fill="#2563EB" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2. 训练行为克隆</text><text x="620.0" y="356.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">5 维观测进，3 维动作出</text><rect x="830" y="250" width="300" height="150" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="980.0" y="321.0" fill="#16A34A" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3. 闭环评估</text><text x="980.0" y="356.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">100 个目标，量到目标距离</text><rect x="1190" y="250" width="300" height="150" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1340.0" y="321.0" fill="#D97706" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4. 改数据再训一轮</text><text x="1340.0" y="356.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">加示教、加增广、换损失</text><line x1="416" y1="325.0" x2="464" y2="325.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><line x1="776" y1="325.0" x2="824" y2="325.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><line x1="1136" y1="325.0" x2="1184" y2="325.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><path d="M1340.0,412 Q800,600 260.0,412" fill="none" stroke="#D97706" stroke-width="4" marker-end="url(#aD97706)"/><text x="800" y="585" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">评估结果反过来改数据</text><text x="800" y="700" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">这一环跑通，链路才算真的通了</text><text x="800" y="745" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">每一环的产物都能单独检查：数据看分布，模型看损失，策略看成功率</text></svg>