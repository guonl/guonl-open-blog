<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker><marker id="a0891B2" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#0891B2"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">抓取检测在算什么</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">把深度图或点云变成一批候选抓取位姿</text><rect x="80" y="250" width="400" height="300" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="306" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">输入</text><rect x="112" y="340" width="150" height="110" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><rect x="126" y="354" width="46" height="34" rx="3" fill="#94A3B8"/><rect x="180" y="354" width="46" height="34" rx="3" fill="#64748B"/><rect x="126" y="396" width="46" height="40" rx="3" fill="#CBD5E1"/><rect x="180" y="396" width="46" height="40" rx="3" fill="#94A3B8"/><rect x="234" y="354" width="14" height="82" rx="3" fill="#475569"/><text x="187" y="486" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">深度图</text><circle cx="305" cy="405" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="330" cy="375" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="355" cy="410" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="380" cy="375" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="405" cy="405" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="430" cy="375" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="455" cy="410" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="320" cy="435" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="370" cy="435" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="420" cy="435" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="350" cy="340" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="400" cy="340" r="5" fill="#0891B2" fill-opacity="0.85"/><circle cx="450" cy="340" r="5" fill="#0891B2" fill-opacity="0.85"/><text x="378" y="486" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">点云</text><line x1="490" y1="400" x2="600" y2="400" stroke="#2563EB" stroke-width="4" marker-end="url(#a2563EB)"/><text x="545.0" y="384.0" fill="#2563EB" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">送入网络</text><rect x="610" y="250" width="360" height="300" rx="18" fill="#0891B2" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="642" y="306" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">网络</text><text x="658" y="372" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 逐点打分</text><text x="658" y="418" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 方向回归</text><text x="658" y="464" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 候选生成与排序</text><text x="790" y="512" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">对姿态变化更适应</text><line x1="980" y1="400" x2="1090" y2="400" stroke="#0891B2" stroke-width="4" marker-end="url(#a0891B2)"/><text x="1035.0" y="384.0" fill="#0891B2" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">输出</text><rect x="1100" y="250" width="420" height="300" rx="18" fill="#16A34A" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="1132" y="306" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">候选抓取位姿</text><text x="1146" y="372" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">候选 1</text><text x="1290" y="372" fill="#16A34A" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">0.92</text><text x="1146" y="420" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">候选 2</text><text x="1290" y="420" fill="#16A34A" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">0.85</text><text x="1146" y="468" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">候选 3</text><text x="1290" y="468" fill="#16A34A" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">0.71</text><text x="1310" y="512" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">按得分排序，交给上层挑</text><rect x="80" y="590" width="1440" height="240" rx="18" fill="#2563EB" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="648" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一个抓取位姿包含四样东西</text><text x="260" y="716" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">抓取点位置</text><text x="260" y="752" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">手指在哪里碰上物体</text><text x="620" y="716" fill="#0891B2" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">接近方向</text><text x="620" y="752" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">夹爪从哪个方向过来</text><text x="980" y="716" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">绕轴转角</text><text x="980" y="752" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">夹爪绕自身轴转多少</text><text x="1340" y="716" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">夹爪宽度</text><text x="1340" y="752" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">开度要和物体匹配</text><text x="800" y="800" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">前三项合起来是位姿，第四项是开口大小，开度不匹配就会撞上物体</text></svg>