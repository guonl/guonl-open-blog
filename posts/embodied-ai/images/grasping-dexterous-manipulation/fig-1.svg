<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker><marker id="aD97706" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#D97706"/></marker><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">形封闭与力封闭</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">一个靠几何把物体卡死，一个靠摩擦把物体按住</text><rect x="80" y="230" width="700" height="460" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="292" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">形封闭：靠几何卡死</text><text x="112" y="328" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">理想接触只能推不能拉，堵住各个方向</text><circle cx="430" cy="510" r="72" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="3"/><line x1="430" y1="345" x2="430" y2="432" stroke="#2563EB" stroke-width="4" marker-end="url(#a2563EB)"/><line x1="287" y1="592" x2="363" y2="549" stroke="#2563EB" stroke-width="4" marker-end="url(#a2563EB)"/><line x1="573" y1="592" x2="497" y2="549" stroke="#2563EB" stroke-width="4" marker-end="url(#a2563EB)"/><circle cx="430" cy="436" r="7" fill="#2563EB"/><circle cx="366" cy="547" r="7" fill="#2563EB"/><circle cx="494" cy="547" r="7" fill="#2563EB"/><text x="430" y="645" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">三根手指从三个方向顶住，想动就被挡住</text><rect x="820" y="230" width="700" height="460" rx="18" fill="#D97706" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="852" y="292" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">力封闭：靠摩擦按住</text><text x="852" y="328" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">摩擦力和法向力配合，平衡外力</text><rect x="1136" y="370" width="28" height="230" rx="14" fill="#64748B" fill-opacity="0.22" stroke="#64748B" stroke-width="3"/><rect x="1076" y="400" width="60" height="70" rx="14" fill="#D97706" fill-opacity="0.16" stroke="#D97706" stroke-width="3"/><rect x="1164" y="400" width="60" height="70" rx="14" fill="#D97706" fill-opacity="0.16" stroke="#D97706" stroke-width="3"/><circle cx="1136" cy="435" r="7" fill="#D97706"/><circle cx="1164" cy="435" r="7" fill="#D97706"/><line x1="986" y1="435" x2="1069" y2="435" stroke="#D97706" stroke-width="4" marker-end="url(#aD97706)"/><line x1="1314" y1="435" x2="1231" y2="435" stroke="#D97706" stroke-width="4" marker-end="url(#aD97706)"/><text x="1027" y="413" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">法向力</text><text x="1272" y="413" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">法向力</text><line x1="1120" y1="560" x2="1120" y2="492" stroke="#D97706" stroke-width="4" marker-end="url(#aD97706)"/><line x1="1180" y1="560" x2="1180" y2="492" stroke="#D97706" stroke-width="4" marker-end="url(#aD97706)"/><text x="1090" y="585" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">摩擦力</text><text x="1210" y="585" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">摩擦力</text><line x1="1150" y1="606" x2="1150" y2="646" stroke="#DC2626" stroke-width="4" marker-end="url(#aDC2626)"/><text x="1168" y="628" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">重力</text><text x="1170" y="674" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">只要外力不超过摩擦锥</text><text x="430" y="752" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">形封闭：物体被卡死了，不挑力</text><text x="1170" y="752" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">力封闭：物体被按住了，要算力</text></svg>