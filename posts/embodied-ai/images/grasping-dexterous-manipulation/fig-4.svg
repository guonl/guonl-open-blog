<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="aDC2626" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#DC2626"/></marker><marker id="aD97706" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#D97706"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">抓取是静态，操作是动态</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">接触点固定还是变化，决定了问题的性质</text><rect x="80" y="230" width="680" height="290" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="288" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">抓取</text><text x="112" y="322" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">让物体离开桌面</text><text x="112" y="356" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">接触点固定，静态问题</text><line x1="112" y1="470" x2="728" y2="470" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8"/><text x="712" y="496" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">桌面</text><rect x="380" y="350" width="100" height="90" rx="8" fill="#64748B" fill-opacity="0.22" stroke="#64748B" stroke-width="3"/><rect x="350" y="370" width="30" height="70" rx="8" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="3"/><rect x="480" y="370" width="30" height="70" rx="8" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="3"/><circle cx="380" cy="405" r="7" fill="#2563EB"/><circle cx="480" cy="405" r="7" fill="#2563EB"/><line x1="560" y1="370" x2="560" y2="430" stroke="#DC2626" stroke-width="4" marker-end="url(#aDC2626)"/><text x="582" y="408" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">重力</text><rect x="840" y="230" width="680" height="290" rx="18" fill="#D97706" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="872" y="288" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">操作</text><text x="872" y="322" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">让物体在手里改变状态</text><text x="872" y="356" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">接触点一直在变，动态问题</text><path d="M1105,350 Q1180,285 1255,350" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#aD97706)"/><text x="1180" y="275" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">在手里转个方向</text><circle cx="1180" cy="415" r="60" fill="#D97706" fill-opacity="0.14" stroke="#D97706" stroke-width="3"/><rect x="1090" y="385" width="30" height="60" rx="8" fill="#D97706" fill-opacity="0.20" stroke="#D97706" stroke-width="3"/><rect x="1240" y="385" width="30" height="60" rx="8" fill="#D97706" fill-opacity="0.20" stroke="#D97706" stroke-width="3"/><circle cx="1120" cy="415" r="7" fill="#D97706"/><circle cx="1240" cy="415" r="7" fill="#D97706"/><text x="1180" y="500" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">手指松开又重新接触，还有相对滑动</text><rect x="80" y="570" width="1440" height="260" rx="18" fill="#7C3AED" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="630" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">视觉和触觉的分工</text><text x="112" y="668" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">手指还没碰上时视觉是主要信息源，碰上的那一刻起触觉变成关键信息源</text><rect x="112" y="720" width="676" height="62" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/><text x="450" y="760" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">接触前：视觉主导</text><rect x="812" y="720" width="676" height="62" rx="12" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-width="2"/><text x="1150" y="760" fill="#7C3AED" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">接触后：触觉与力觉主导</text><text x="800" y="812" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">触觉给出接触力、接触点与滑动，这些量视觉看不到</text></svg>