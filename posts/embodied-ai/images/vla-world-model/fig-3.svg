<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">世界模型：先在内部推演，再动手</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">把试错搬进模型里，用算力换安全</text><rect x="480" y="190" width="1020" height="220" rx="20" fill="#7C3AED" fill-opacity="0.05" stroke="#7C3AED" stroke-width="3" stroke-dasharray="10 8"/><text x="488" y="172" fill="#7C3AED" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">想象空间：在模型里试错，不动真机</text><rect x="120" y="230" width="300" height="140" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="270.0" y="296.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">当前观测</text><text x="270.0" y="330.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">一帧或多帧画面</text><rect x="500" y="230" width="360" height="140" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="680.0" y="296.0" fill="#7C3AED" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">世界模型</text><text x="680.0" y="330.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">推演环境的下一步</text><rect x="940" y="230" width="540" height="140" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1210.0" y="296.0" fill="#7C3AED" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">多条候选未来</text><text x="1210.0" y="330.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">同一个动作可能导向不同结果</text><line x1="425" y1="300" x2="495" y2="300" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="865" y1="300" x2="935" y2="300" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="940" y="490" width="540" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1210.0" y="556.0" fill="#16A34A" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">评估与选择</text><text x="1210.0" y="590.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">给每条轨迹打分，挑一条</text><rect x="500" y="490" width="360" height="140" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="680.0" y="556.0" fill="#D97706" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">在真机上执行</text><text x="680.0" y="590.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只执行选中的动作</text><rect x="120" y="490" width="300" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="270.0" y="556.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真实世界改变</text><text x="270.0" y="590.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">新状态成为下一步观测</text><line x1="1210" y1="375" x2="1210" y2="485" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="1244" y="434" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">打分排序</text><line x1="935" y1="560" x2="865" y2="560" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="495" y1="560" x2="425" y2="560" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="270" y1="485" x2="270" y2="375" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="304" y="434" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">下一步</text><text x="800" y="712" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">好处是危险动作可以先在模型里筛掉，不必拿真机去撞</text><text x="800" y="762" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">代价是每次决策都要跑一遍推演，算力和延迟一起上去</text><text x="800" y="810" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">推演越准模型越大，延迟越高，就越难塞进实时控制环</text></svg>