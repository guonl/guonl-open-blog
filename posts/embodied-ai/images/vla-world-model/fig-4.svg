<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">融合趋势：不是三选一，而是分层</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">慢的负责理解与规划，快的负责接触与稳定</text><rect x="120" y="210" width="380" height="110" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="310.0" y="261.0" fill="#0891B2" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">VLA</text><text x="310.0" y="296.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">从数据里学映射</text><rect x="610" y="210" width="380" height="110" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="800.0" y="261.0" fill="#7C3AED" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">世界模型</text><text x="800.0" y="296.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">先推演再执行</text><rect x="1100" y="210" width="380" height="110" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1290.0" y="261.0" fill="#D97706" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">本能驱动</text><text x="1290.0" y="296.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">毫秒级反射</text><line x1="310" y1="325" x2="700" y2="393" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="800" y1="325" x2="800" y2="393" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="1290" y1="325" x2="900" y2="393" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="300" y="400" width="1000" height="110" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="800.0" y="451.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">融合：一条决策链上分工</text><text x="800.0" y="486.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">不同环节交给不同的路线，谁擅长什么就干什么</text><rect x="300" y="684.0" width="1000" height="112.0" rx="12" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="328" y="734.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">快反射层：本能驱动</text><text x="328" y="764.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">毫秒级闭环，管接触、抓稳、防滑</text><rect x="300" y="564.0" width="1000" height="112.0" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="328" y="614.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">慢思考层：VLA 与世界模型</text><text x="328" y="644.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">几十到几百毫秒，管理解任务、规划动作</text><text x="800" y="848" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真实系统多半是分层：慢的那层给出意图，快的那层把它稳稳落地</text></svg>