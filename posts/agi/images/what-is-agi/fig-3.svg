<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">智能水平的三级分级</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">专用 AI、人类水平（AGI）、超级智能（ASI），越往上边界越模糊</text><rect x="80" y="270" width="1000" height="130" rx="16" fill="#7C3AED" fill-opacity="0.07" stroke="#7C3AED" stroke-width="3" stroke-dasharray="10 12" stroke-opacity="0.5"/><text x="120" y="326" fill="#7C3AED" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">超过人类（ASI）</text><text x="120" y="369" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">在各个维度都全面超越最聪明的人类</text><text x="1210" y="336" fill="#7C3AED" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">边界最模糊</text><rect x="80" y="440" width="1000" height="130" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3" stroke-dasharray="16 7" stroke-opacity="0.75"/><text x="120" y="496" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">人类水平（AGI）</text><text x="120" y="539" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">绝大多数动脑的任务上，表现和人不相上下</text><text x="1210" y="506" fill="#0891B2" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">分界线很粗</text><rect x="80" y="610" width="1000" height="130" rx="16" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="3"  stroke-opacity="1.0"/><text x="120" y="666" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">专用 AI</text><text x="120" y="709" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">一个模型干一件事，任务在训练前就定好</text><text x="1210" y="676" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">边界清晰</text><line x1="1160" y1="730" x2="1160" y2="292" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><text x="1160" y="250" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">智能水平</text><text x="800" y="820" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">分级是方便讨论的脚手架，不是能拿卡尺去量的刻度</text></svg>