<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">围绕 AGI 的三场争论</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">每场争论都分成两边，而两边都还没有定论</text><rect x="80" y="210" width="460" height="400" rx="18" fill="#2563EB" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="262" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">争论一：规模能不能到 AGI</text><rect x="108" y="296" width="404" height="140" rx="14" fill="#2563EB" fill-opacity="0.09" stroke="#2563EB" stroke-width="2"/><text x="130" y="342" fill="#2563EB" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一边：能，或已经很接近</text><text x="130" y="384" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">语言、知识、推理一直在往上爬</text><text x="130" y="416" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">剩下的是长程规划与可靠推理</text><rect x="108" y="456" width="404" height="140" rx="14" fill="#2563EB" fill-opacity="0.09" stroke="#2563EB" stroke-width="2"/><text x="130" y="502" fill="#2563EB" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">另一边：这条路走不通</text><text x="130" y="544" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">学到的是统计拟合，不是世界模型</text><text x="130" y="576" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">规模再大也只是拟合更精细</text><rect x="570" y="210" width="460" height="400" rx="18" fill="#0891B2" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="598" y="262" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">争论二：智能要不要身体</text><rect x="598" y="296" width="404" height="140" rx="14" fill="#0891B2" fill-opacity="0.09" stroke="#0891B2" stroke-width="2"/><text x="620" y="342" fill="#0891B2" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一边：要</text><text x="620" y="384" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">因果和常识在打交道时长出来</text><text x="620" y="416" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">具身智能走的就是这条路</text><rect x="598" y="456" width="404" height="140" rx="14" fill="#0891B2" fill-opacity="0.09" stroke="#0891B2" stroke-width="2"/><text x="620" y="502" fill="#0891B2" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">另一边：不必</text><text x="620" y="544" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">数学、编程、写作不依赖身体</text><text x="620" y="576" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">没碰过实物，也很难说不智能</text><rect x="1060" y="210" width="460" height="400" rx="18" fill="#D97706" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="1088" y="262" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">争论三：时间表靠不靠谱</text><rect x="1088" y="296" width="404" height="140" rx="14" fill="#D97706" fill-opacity="0.09" stroke="#D97706" stroke-width="2"/><text x="1110" y="342" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一边：押具体年份</text><text x="1110" y="384" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每隔几年就冒出一批某年实现</text><text x="1110" y="416" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">回顾历史，几乎全错</text><rect x="1088" y="456" width="404" height="140" rx="14" fill="#D97706" fill-opacity="0.09" stroke="#D97706" stroke-width="2"/><text x="1110" y="502" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">另一边：断言永远不行</text><text x="1110" y="544" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">同样斩钉截铁地否定掉</text><text x="1110" y="576" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">错的方向两边都有</text><line x1="310" y1="616" x2="600" y2="678" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="800" y1="616" x2="800" y2="678" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="1290" y1="616" x2="1000" y2="678" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="400" y="680" width="800" height="110" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="800.0" y="731.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">最后都回到最基础的「通用」二字</text><text x="800.0" y="767.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">争论的不是技术本身，而是「通用」这条线该画在哪</text><text x="800" y="850" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">尺子不同，量出来的「更接近」就完全不同</text></svg>