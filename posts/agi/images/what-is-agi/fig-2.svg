<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">四类 AGI 定义，各有一处站不住</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">每类都盯住一个侧面，也都漏掉另一个侧面</text><rect x="80" y="240" width="680" height="230" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="110" y="294" fill="#2563EB" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">1. 能力清单式</text><text x="110" y="344" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">会推理、会学习、会计划、会使用语言</text><line x1="110" y1="376" x2="730" y2="376" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="110" y="418" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">毛病</text><text x="176" y="418" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">表永远列不完，标准由列的人定</text><rect x="840" y="240" width="680" height="230" rx="18" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="870" y="294" fill="#0891B2" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">2. 行为式</text><text x="870" y="344" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">隔着屏幕对话，人分不出对面是人是机器</text><line x1="870" y1="376" x2="1490" y2="376" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="418" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">毛病</text><text x="936" y="418" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">测的是像不像人，不是强不强</text><rect x="80" y="500" width="680" height="230" rx="18" fill="#D97706" fill-opacity="0.06" stroke="#D97706" stroke-width="3"/><text x="110" y="554" fill="#D97706" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">3. 经济价值式</text><text x="110" y="604" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">机器能完成人类经济活动中大部分工作</text><line x1="110" y1="636" x2="730" y2="636" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="110" y="678" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">毛病</text><text x="176" y="678" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">量的是外部效果，还随市场波动</text><rect x="840" y="500" width="680" height="230" rx="18" fill="#16A34A" fill-opacity="0.06" stroke="#16A34A" stroke-width="3"/><text x="870" y="554" fill="#16A34A" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">4. 通用学习式</text><text x="870" y="604" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">给几个例子就能上手，不用从头重训一遍</text><line x1="870" y1="636" x2="1490" y2="636" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="678" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">毛病</text><text x="936" y="678" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">学习多快、多新才算新，仍要划线</text><text x="800" y="812" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">四条路走到最后，都得有人来划一条线</text></svg>