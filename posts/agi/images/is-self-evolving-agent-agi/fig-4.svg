<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">评估成长的三件事：固定测试集、新旧对照、防测试集污染</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">把「变好了」从感觉拉回到可测量</text><rect x="80" y="170" width="454" height="360" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="80" y="170" width="454" height="8" rx="4" fill="#2563EB"/><circle cx="132" cy="236" r="26" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="3"/><text x="132" y="245" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="174" y="246" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">固定测试集</text><text x="116" y="322" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 任务集不能被 Agent 看见</text><text x="116" y="384" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 长技能用的任务不能和评估任务重叠</text><text x="116" y="446" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 否则测出来的是它背下了考题</text><rect x="573" y="170" width="454" height="360" rx="18" fill="#16A34A" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="573" y="170" width="454" height="8" rx="4" fill="#16A34A"/><circle cx="625" cy="236" r="26" fill="#16A34A" fill-opacity="0.14" stroke="#16A34A" stroke-width="3"/><text x="625" y="245" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="667" y="246" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">新旧对照</text><text x="609" y="322" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 改了一版技能，新旧两版同批跑</text><text x="609" y="384" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 比通过率，也比成本</text><text x="609" y="446" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 这是防经验污染最直接的一招</text><rect x="1066" y="170" width="454" height="360" rx="18" fill="#D97706" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><rect x="1066" y="170" width="454" height="8" rx="4" fill="#D97706"/><circle cx="1118" cy="236" r="26" fill="#D97706" fill-opacity="0.14" stroke="#D97706" stroke-width="3"/><text x="1118" y="245" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="1160" y="246" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">防测试集污染</text><text x="1102" y="322" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 评估用例要定期换血</text><text x="1102" y="384" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 评估集高分、真实任务翻车</text><text x="1102" y="446" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 这就是过拟合的信号</text><path d="M80.0,590 L408.5,590 L432.5,636.0 L408.5,682 L80.0,682 L104.0,636.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="264.25" y="646.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">固定任务集</text><path d="M442.5,590 L771.0,590 L795.0,636.0 L771.0,682 L442.5,682 L466.5,636.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="626.75" y="646.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">新旧两版各跑一遍</text><path d="M805.0,590 L1133.5,590 L1157.5,636.0 L1133.5,682 L805.0,682 L829.0,636.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="989.25" y="646.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">比通过率与成本</text><path d="M1167.5,590 L1496.0,590 L1520.0,636.0 L1496.0,682 L1167.5,682 L1191.5,636.0 Z" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="1351.75" y="646.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">决定改还是不改</text><text x="800" y="758" fill="#64748B" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">成长可以自动，判断成长不能自动</text></svg>