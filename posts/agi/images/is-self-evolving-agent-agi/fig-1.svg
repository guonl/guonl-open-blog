<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">两条路线，两种赌注</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">同一个模型出发，一条把力气花在模型本身，一条把力气花在模型外面</text><rect x="650" y="140" width="300" height="104" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="800.0" y="188.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">同一个模型</text><text x="800.0" y="224.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">参数完全一样</text><path d="M700,244 Q620,300 400,336" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><path d="M900,244 Q980,300 1200,336" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="120" y="340" width="560" height="112" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="400.0" y="392.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">路线 A：把力气花在模型上</text><text x="400.0" y="427.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">堆参数、堆数据、重新训练</text><line x1="400" y1="456" x2="400" y2="494" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="120" y="498" width="560" height="104" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="400.0" y="559.1" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">改动落在权重里</text><line x1="400" y1="606" x2="400" y2="644" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="120" y="648" width="560" height="104" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="400.0" y="709.1" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">赌注：模型本身变聪明</text><rect x="920" y="340" width="560" height="112" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="1200.0" y="392.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">路线 B：把力气花在模型外</text><text x="1200.0" y="427.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">长技能、长记忆、改提示词</text><line x1="1200" y1="456" x2="1200" y2="494" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="920" y="498" width="560" height="104" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="1200.0" y="559.1" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">改动落在文件里</text><line x1="1200" y1="606" x2="1200" y2="644" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><rect x="920" y="648" width="560" height="104" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="1200.0" y="709.1" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">赌注：经验越攒越多</text><text x="800" y="822" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">两条路的成本、可逆性、可解释性，都不一样</text></svg>