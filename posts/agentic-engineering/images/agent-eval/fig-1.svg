<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">Eval 的三个基本要素</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">无论多复杂的 Eval，本质都由这三部分组成</text><rect x="48" y="230" width="480" height="580" rx="20" fill="#0891B2" fill-opacity="0.05" stroke="#0891B2" stroke-width="3"/><text x="288.0" y="529.8" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700"></text><rect x="62" y="244" width="452" height="76" rx="14" fill="#0891B2" fill-opacity="0.18"/><text x="288.0" y="292" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">测试用例集</text><text x="288.0" y="358" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">Test Cases</text><line x1="88" y1="386" x2="488" y2="386" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><circle cx="104" cy="428" r="5" fill="#0891B2"/><text x="126" y="434" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">用例是评估的「考题」</text><circle cx="104" cy="480" r="5" fill="#0891B2"/><text x="126" y="486" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">来源：真实用户输入</text><circle cx="104" cy="532" r="5" fill="#0891B2"/><text x="126" y="538" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">来源：手工构造 / 失败回归</text><circle cx="104" cy="584" r="5" fill="#0891B2"/><text x="126" y="590" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">来源：边界对抗 / 合成数据</text><circle cx="104" cy="636" r="5" fill="#0891B2"/><text x="126" y="642" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">覆盖「典型」与「长尾」</text><rect x="560" y="230" width="480" height="580" rx="20" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="3"/><text x="800.0" y="529.8" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700"></text><rect x="574" y="244" width="452" height="76" rx="14" fill="#2563EB" fill-opacity="0.18"/><text x="800.0" y="292" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">评分标准</text><text x="800.0" y="358" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">Scoring</text><line x1="600" y1="386" x2="1000" y2="386" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><circle cx="616" cy="428" r="5" fill="#2563EB"/><text x="638" y="434" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">拿到输出怎么判对错</text><circle cx="616" cy="480" r="5" fill="#2563EB"/><text x="638" y="486" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">规则打分：快、稳、可解释</text><circle cx="616" cy="532" r="5" fill="#2563EB"/><text x="638" y="538" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">模型打分：灵活、判主观</text><circle cx="616" cy="584" r="5" fill="#2563EB"/><text x="638" y="590" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">人工打分：最准、最贵</text><circle cx="616" cy="636" r="5" fill="#2563EB"/><text x="638" y="642" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">实践中通常组合使用</text><rect x="1072" y="230" width="480" height="580" rx="20" fill="#D97706" fill-opacity="0.05" stroke="#D97706" stroke-width="3"/><text x="1312.0" y="529.8" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700"></text><rect x="1086" y="244" width="452" height="76" rx="14" fill="#D97706" fill-opacity="0.18"/><text x="1312.0" y="292" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">指标</text><text x="1312.0" y="358" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">Metrics</text><line x1="1112" y1="386" x2="1512" y2="386" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><circle cx="1128" cy="428" r="5" fill="#D97706"/><text x="1150" y="434" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">评估最终要落到数字</text><circle cx="1128" cy="480" r="5" fill="#D97706"/><text x="1150" y="486" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">准确率 / 通过率</text><circle cx="1128" cy="532" r="5" fill="#D97706"/><text x="1150" y="538" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">任务成功率</text><circle cx="1128" cy="584" r="5" fill="#D97706"/><text x="1150" y="590" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">成本 / 延迟（P50 / P95）</text><circle cx="1128" cy="636" r="5" fill="#D97706"/><text x="1150" y="642" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">工具调用准确率 / 幻觉率</text><circle cx="1128" cy="688" r="5" fill="#D97706"/><text x="1150" y="694" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">不要只看平均值</text></svg>