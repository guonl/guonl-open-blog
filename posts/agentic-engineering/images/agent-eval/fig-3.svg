<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">评估方法学：离线、在线与回归</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">三条并行流程，各司其职</text><rect x="48" y="200" width="240" height="130" rx="16" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="168.0" y="274.1" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">离线评估</text><path d="M320.0,200 L700.0,200 L724.0,265.0 L700.0,330 L320.0,330 L344.0,265.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="530.0" y="275.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">固定用例集</text><path d="M734.0,200 L1114.0,200 L1138.0,265.0 L1114.0,330 L734.0,330 L758.0,265.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="944.0" y="275.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">部署前跑一遍</text><path d="M1148.0,200 L1528.0,200 L1552.0,265.0 L1528.0,330 L1148.0,330 L1172.0,265.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="1358.0" y="275.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">快 · 便宜 · 可复现</text><rect x="48" y="410" width="240" height="130" rx="16" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="168.0" y="484.1" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">在线评估</text><path d="M320.0,410 L700.0,410 L724.0,475.0 L700.0,540 L320.0,540 L344.0,475.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="530.0" y="485.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真实流量</text><path d="M734.0,410 L1114.0,410 L1138.0,475.0 L1114.0,540 L734.0,540 L758.0,475.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="944.0" y="485.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">埋点 / 小流量实验</text><path d="M1148.0,410 L1528.0,410 L1552.0,475.0 L1528.0,540 L1148.0,540 L1172.0,475.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="1358.0" y="485.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">真实 · 慢 · 有风险</text><rect x="48" y="620" width="240" height="130" rx="16" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="168.0" y="694.1" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">回归测试</text><path d="M320.0,620 L700.0,620 L724.0,685.0 L700.0,750 L320.0,750 L344.0,685.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="530.0" y="695.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">全部历史用例</text><path d="M734.0,620 L1114.0,620 L1138.0,685.0 L1114.0,750 L734.0,750 L758.0,685.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="944.0" y="695.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">每次改动重跑</text><path d="M1148.0,620 L1528.0,620 L1552.0,685.0 L1528.0,750 L1148.0,750 L1172.0,685.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="1358.0" y="695.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">防「改一个坏一个」</text><text x="800" y="812" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">健康做法：先离线快速筛选（否掉大多数改动），再在线小流量灰度做最终验证</text></svg>