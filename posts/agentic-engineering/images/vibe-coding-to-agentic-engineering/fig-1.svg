<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">Vibe Coding 在生产环境的三大翻车场景</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">能跑，但没人敢动、没法验收、踩了红线</text><rect x="48" y="200" width="480" height="540" rx="20" fill="#D97706" fill-opacity="0.05" stroke="#D97706" stroke-width="3"/><text x="288.0" y="479.8" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700"></text><rect x="64" y="216" width="448" height="80" rx="14" fill="#D97706" fill-opacity="0.16"/><circle cx="110" cy="256" r="28" fill="#D97706"/><text x="110" y="267" fill="#FFFFFF" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="154" y="267" fill="#D97706" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">代码不可维护</text><text x="88" y="342" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">能跑，但没人懂</text><line x1="88" y1="370" x2="488" y2="370" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><circle cx="110" cy="414" r="5" fill="#D97706"/><text x="132" y="420" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">结构混乱、命名随意</text><circle cx="110" cy="472" r="5" fill="#D97706"/><text x="132" y="478" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">重复逻辑到处都是</text><circle cx="110" cy="530" r="5" fill="#D97706"/><text x="132" y="536" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">缺少注释与错误处理</text><circle cx="110" cy="588" r="5" fill="#D97706"/><text x="132" y="594" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">改动像在拆炸弹</text><circle cx="110" cy="646" r="5" fill="#D97706"/><text x="132" y="652" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">AI 倾向推倒重写</text><rect x="560" y="200" width="480" height="540" rx="20" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="3"/><text x="800.0" y="479.8" fill="#DC2626" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700"></text><rect x="576" y="216" width="448" height="80" rx="14" fill="#DC2626" fill-opacity="0.16"/><circle cx="622" cy="256" r="28" fill="#DC2626"/><text x="622" y="267" fill="#FFFFFF" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="666" y="267" fill="#DC2626" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">缺少验收标准</text><text x="600" y="342" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">没有「做完了」的定义</text><line x1="600" y1="370" x2="1000" y2="370" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><circle cx="622" cy="414" r="5" fill="#DC2626"/><text x="644" y="420" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">「看起来对」不是标准</text><circle cx="622" cy="472" r="5" fill="#DC2626"/><text x="644" y="478" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">边界 / 异常输入易崩溃</text><circle cx="622" cy="530" r="5" fill="#DC2626"/><text x="644" y="536" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">无法判断改好还是改坏</text><circle cx="622" cy="588" r="5" fill="#DC2626"/><text x="644" y="594" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">修好 A 却弄坏 B</text><circle cx="622" cy="646" r="5" fill="#DC2626"/><text x="644" y="652" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">测试应是给 Agent 的契约</text><rect x="1072" y="200" width="480" height="540" rx="20" fill="#7C3AED" fill-opacity="0.05" stroke="#7C3AED" stroke-width="3"/><text x="1312.0" y="479.8" fill="#7C3AED" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700"></text><rect x="1088" y="216" width="448" height="80" rx="14" fill="#7C3AED" fill-opacity="0.16"/><circle cx="1134" cy="256" r="28" fill="#7C3AED"/><text x="1134" y="267" fill="#FFFFFF" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="1178" y="267" fill="#7C3AED" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">安全合规风险</text><text x="1112" y="342" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">AI 不知道你的红线</text><line x1="1112" y1="370" x2="1512" y2="370" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><circle cx="1134" cy="414" r="5" fill="#7C3AED"/><text x="1156" y="420" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">密钥、Token 硬编码</text><circle cx="1134" cy="472" r="5" fill="#7C3AED"/><text x="1156" y="478" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">SQL 注入 / 越权 / 路径穿越</text><circle cx="1134" cy="530" r="5" fill="#7C3AED"/><text x="1156" y="536" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">引入许可证有问题的依赖</text><circle cx="1134" cy="588" r="5" fill="#7C3AED"/><text x="1156" y="594" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">用户数据发到不该发的地方</text><circle cx="1134" cy="646" r="5" fill="#7C3AED"/><text x="1156" y="652" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">缺的不是能力，是约束</text></svg>