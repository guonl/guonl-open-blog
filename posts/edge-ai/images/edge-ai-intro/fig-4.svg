<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">一个任务该放云端还是端侧</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">顺着延迟、数据、网络、算力、成本依次判断</text><path d="M80.0,230 L336.0,230 L360.0,278.0 L336.0,326 L80.0,326 L104.0,278.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="228.0" y="288.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">延迟敏感？</text><path d="M370.0,230 L626.0,230 L650.0,278.0 L626.0,326 L370.0,326 L394.0,278.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="518.0" y="288.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">数据敏感？</text><path d="M660.0,230 L916.0,230 L940.0,278.0 L916.0,326 L660.0,326 L684.0,278.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="808.0" y="288.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">要离线？</text><path d="M950.0,230 L1206.0,230 L1230.0,278.0 L1206.0,326 L950.0,326 L974.0,278.0 Z" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="1098.0" y="288.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">算力需求大？</text><path d="M1240.0,230 L1496.0,230 L1520.0,278.0 L1496.0,326 L1240.0,326 L1264.0,278.0 Z" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="3"/><text x="1388.0" y="288.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">数据量大？</text><rect x="80" y="400" width="680" height="330" rx="18" fill="#16A34A" fill-opacity="0.08" stroke="#16A34A" stroke-width="3"/><text x="120" y="462" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">放端侧，如果</text><text x="130" y="528" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 要求毫秒级、确定性响应</text><text x="130" y="580" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 数据不允许出设备</text><text x="130" y="632" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 需要离线或弱网可用</text><text x="130" y="684" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 数据量大、云端成本高</text><rect x="840" y="400" width="680" height="330" rx="18" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="3"/><text x="880" y="462" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">放云端，如果</text><text x="890" y="528" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 需要大模型的通用能力</text><text x="890" y="580" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 复杂推理、长上下文</text><text x="890" y="632" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 低频、非实时、可接受上传</text><text x="800" y="792" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">多数系统是组合：端侧先过滤，云端做深处理</text></svg>