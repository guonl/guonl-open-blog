<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">端侧能跑多大的模型：内存是第一道墙</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">每 10 亿参数：FP16 约 2GB，INT8 约 1GB，INT4 约 0.5GB</text><rect x="80" y="230" width="680" height="520" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="285" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">参数量 与 内存占用</text><text x="120" y="372" fill="#0F172A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">1B</text><text x="220" y="372" fill="#64748B" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">FP16 2GB | INT8 1GB | INT4 0.5GB</text><text x="120" y="464" fill="#0F172A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">3B</text><text x="220" y="464" fill="#64748B" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">FP16 6GB | INT8 3GB | INT4 1.5GB</text><text x="120" y="556" fill="#0F172A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">7B</text><text x="220" y="556" fill="#64748B" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">FP16 14GB | INT8 7GB | INT4 3.5GB</text><text x="120" y="648" fill="#0F172A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">70B</text><text x="220" y="648" fill="#64748B" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">FP16 140GB | INT8 70GB | INT4 35GB</text><rect x="840" y="230" width="680" height="520" rx="18" fill="#16A34A" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="870" y="285" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">端侧擅长</text><text x="880" y="352" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 唤醒词、图像分类</text><text x="880" y="406" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 人脸识别、OCR</text><text x="880" y="460" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 语音转写、简单检测</text><text x="870" y="560" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">端侧不擅长</text><text x="880" y="627" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 通用推理、长上下文</text><text x="880" y="681" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 复杂多步任务</text><text x="880" y="735" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 端侧硬跑大模型</text></svg>