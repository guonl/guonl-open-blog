<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">带宽决定 decode 的速度上限</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">7B INT4 每生成一个 token 要读约 3.5GB 权重，数字为量级估算</text><rect x="90" y="240" width="1340" height="70" rx="12" fill="#0891B2" fill-opacity="0.12" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="284.0" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">运行环境</text><text x="560.0" y="284.0" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">内存带宽</text><text x="880.0" y="284.0" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">7B INT4 理论上限</text><text x="1240.0" y="284.0" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">说明</text><rect x="90" y="310" width="1340" height="92" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="112" y="364.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">手机 LPDDR5</text><text x="560.0" y="364.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 50 GB/s</text><text x="880.0" y="364.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 14 token/s</text><text x="1240.0" y="364.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">还要跑系统，实际更低</text><rect x="90" y="402" width="1340" height="92" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="112" y="456.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">PC 独显 GDDR6</text><text x="560.0" y="456.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 500 GB/s</text><text x="880.0" y="456.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 140 token/s</text><text x="1240.0" y="456.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">带宽高一个数量级</text><rect x="90" y="494" width="1340" height="92" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="112" y="548.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">云端 HBM</text><text x="560.0" y="548.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 2000 GB/s 以上</text><text x="880.0" y="548.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">单请求几百 token/s</text><text x="1240.0" y="548.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">靠批处理把成本摊薄</text><rect x="90" y="240" width="1340" height="346" rx="12" fill="none" stroke="#CBD5E1" stroke-width="2"/><rect x="90" y="640" width="1340" height="190" rx="18" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="3"/><text x="130" y="700" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">为什么 decode 是带宽受限</text><text x="130" y="748" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每生成 1 个 token，都要把全部权重从内存完整读一遍，但每个权重只参与一次乘加</text><text x="130" y="790" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">算术强度太低，内存搬数据的速度就成了天花板，算力再强也补不上</text></svg>