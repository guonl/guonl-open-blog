<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">两个内存大头：权重与 KV cache</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">权重看参数量和位宽，KV cache 看上下文长度</text><text x="90" y="205" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">权重占用：参数量 乘以 每参数字节数</text><rect x="90" y="240" width="760" height="64" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="281.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">参数量</text><text x="375.0" y="281.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">FP16</text><text x="565.0" y="281.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">INT8</text><text x="755.0" y="281.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">INT4</text><rect x="90" y="304" width="760" height="84" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="112" y="354.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">1B</text><text x="375.0" y="354.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 2 GB</text><text x="565.0" y="354.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 1 GB</text><text x="755.0" y="354.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 0.5 GB</text><rect x="90" y="388" width="760" height="84" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="112" y="438.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">3B</text><text x="375.0" y="438.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 6 GB</text><text x="565.0" y="438.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 3 GB</text><text x="755.0" y="438.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 1.5 GB</text><rect x="90" y="472" width="760" height="84" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="112" y="522.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">7B</text><text x="375.0" y="522.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 14 GB</text><text x="565.0" y="522.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 7 GB</text><text x="755.0" y="522.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 3.5 GB</text><rect x="90" y="556" width="760" height="84" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="112" y="606.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">70B</text><text x="375.0" y="606.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 140 GB</text><text x="565.0" y="606.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 70 GB</text><text x="755.0" y="606.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">约 35 GB</text><rect x="90" y="240" width="760" height="400" rx="12" fill="none" stroke="#CBD5E1" stroke-width="2"/><rect x="930" y="205" width="580" height="480" rx="18" fill="#D97706" fill-opacity="0.06" stroke="#D97706" stroke-width="3"/><text x="970" y="268" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">KV cache 怎么算</text><text x="970" y="322" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">2 * 层数 * KV头数 * 头维度 * 长度 * 字节数</text><text x="970" y="372" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">2 指 K 和 V 各存一份</text><text x="970" y="418" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">以 7B（32 层 / 8 个 KV 头 / 每头 128 维）为例</text><text x="970" y="464" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">FP16：约 128 KB / token</text><text x="970" y="510" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">4K 上下文：约 0.5 GB</text><text x="970" y="556" fill="#DC2626" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">32K 上下文：约 4 GB</text><text x="970" y="610" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">把 KV cache 也量化到 INT8，这块直接减半</text><text x="970" y="656" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">不用 GQA 的模型，KV 头数多 4 倍，这块再涨 4 倍</text><text x="90" y="745" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">权重是常量，模型一加载就定死了；KV cache 是变量，上下文越长它越大</text><text x="90" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">长上下文场景里 KV cache 甚至超过权重，两个大头一起涨，就撞上了内存墙</text></svg>