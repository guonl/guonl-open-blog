<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">端侧跑 7B 的内存都花在哪</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">以 8GB 内存的手机、7B INT4 模型、4K 上下文为例，数字为量级估算</text><text x="140" y="190" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">8GB 内存的构成（条长按 GB 等比）</text><text x="140" y="257.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">系统与其他应用</text><rect x="400" y="226" width="240.0" height="46" rx="10" fill="#64748B" fill-opacity="0.22" stroke="#64748B" stroke-width="2.5"/><text x="662.0" y="257.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 3.0 GB</text><text x="140" y="331.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">7B INT4 权重</text><rect x="400" y="300" width="280.0" height="46" rx="10" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="2.5"/><text x="702.0" y="331.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 3.5 GB</text><text x="140" y="405.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">KV cache（4K 上下文）</text><rect x="400" y="374" width="40.0" height="46" rx="10" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2.5"/><text x="462.0" y="405.0" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 0.5 GB</text><text x="140" y="479.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">运行时与余量</text><rect x="400" y="448" width="80.0" height="46" rx="10" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="2.5"/><text x="502.0" y="479.0" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 1.0 GB</text><line x1="1040" y1="218" x2="1040" y2="540" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/><text x="1052" y="232" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">8GB 总容量</text><text x="140" y="570" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">四项加起来约 8GB，把整台手机的内存占满。权重是固定成本，KV cache 是变量</text><text x="140" y="608" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">更麻烦的是手机给单个 App 的内存额度远小于总容量，通常只有两三 GB</text><text x="140" y="686" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">KV cache 随上下文增长（7B，GQA 8 个 KV 头，FP16，估算）</text><text x="140" y="742.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">2K 上下文</text><rect x="400" y="712" width="40.0" height="44" rx="10" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2.5"/><text x="462.0" y="742.0" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 0.25 GB</text><text x="140" y="796.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">8K 上下文</text><rect x="400" y="766" width="160.0" height="44" rx="10" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2.5"/><text x="582.0" y="796.0" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 1 GB</text><text x="140" y="850.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">32K 上下文</text><rect x="400" y="820" width="640.0" height="44" rx="10" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="2.5"/><text x="1062.0" y="850.0" fill="#DC2626" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 4 GB（已经超过权重）</text></svg>