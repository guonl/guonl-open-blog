<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">内存被谁吃掉了：权重是固定成本，KV cache 随上下文线性增长</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">以 7B 量级、Q4 量化为例，数字为量级估算</text><rect x="80" y="214" width="933" height="96" rx="14" fill="#2563EB" fill-opacity="0.24" stroke="#2563EB" stroke-width="3"/><rect x="1013" y="214" width="117" height="96" rx="0" fill="#D97706" fill-opacity="0.24" stroke="#D97706" stroke-width="3"/><rect x="1130" y="214" width="70" height="96" rx="0" fill="#64748B" fill-opacity="0.24" stroke="#64748B" stroke-width="3"/><rect x="80" y="214" width="1120" height="96" rx="14" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="94" y="272.0" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">权重 约 4.0 GB</text><rect x="1240" y="224" width="26" height="26" rx="6" fill="#2563EB" fill-opacity="0.30" stroke="#2563EB" stroke-width="2"/><text x="1282" y="246" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">权重 约 4.0 GB</text><rect x="1240" y="268" width="26" height="26" rx="6" fill="#D97706" fill-opacity="0.30" stroke="#D97706" stroke-width="2"/><text x="1282" y="290" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">KV cache 约 0.5 GB</text><rect x="1240" y="312" width="26" height="26" rx="6" fill="#64748B" fill-opacity="0.30" stroke="#64748B" stroke-width="2"/><text x="1282" y="334" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">运行时 约 0.3 GB</text><text x="1242" y="376" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">合计 约 4.8 GB</text><line x1="80" y1="400" x2="1520" y2="400" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="80" y="462" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">上下文长度对 KV cache 的影响</text><text x="460" y="550" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">2K 上下文</text><rect x="480" y="518" width="45" height="46" rx="8" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2"/><text x="545.0" y="550" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 0.25 GB</text><text x="460" y="626" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">4K 上下文</text><rect x="480" y="594" width="90" height="46" rx="8" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2"/><text x="590.0" y="626" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 0.5 GB</text><text x="460" y="702" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">8K 上下文</text><rect x="480" y="670" width="180" height="46" rx="8" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2"/><text x="680.0" y="702" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 1.0 GB</text><text x="460" y="778" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">32K 上下文</text><rect x="480" y="746" width="720" height="46" rx="8" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2"/><text x="1220.0" y="778" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 4.0 GB</text><text x="80" y="850" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">上下文翻一倍，KV cache 也翻一倍；把 KV 也量化成 8 位，这块还能再减半</text></svg>