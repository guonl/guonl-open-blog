<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">量化级别换来了什么：体积、内存、质量</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">以 7B 量级模型为例，数字为量级估算，实际以你下载的文件为准</text><text x="330" y="266" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">Q8_0</text><rect x="352" y="236" width="829" height="42" rx="8" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="2"/><text x="1198.8000000000002" y="266" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">7.4 GB</text><text x="1552" y="266" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">几乎无损</text><text x="330" y="350" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">Q6_K</text><rect x="352" y="320" width="627" height="42" rx="8" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="2"/><text x="997.1999999999999" y="350" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">5.6 GB</text><text x="1552" y="350" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">基本无损</text><text x="330" y="434" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">Q5_K_M</text><rect x="352" y="404" width="538" height="42" rx="8" fill="#0891B2" fill-opacity="0.22" stroke="#0891B2" stroke-width="2"/><text x="907.6" y="434" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">4.8 GB</text><text x="1552" y="434" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">很接近原始</text><text x="330" y="518" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">Q4_K_M</text><rect x="352" y="488" width="470" height="42" rx="8" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="2"/><text x="840.4000000000001" y="518" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">4.2 GB</text><text x="1552" y="518" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">轻微下降，推荐</text><text x="330" y="602" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">Q3_K_M</text><rect x="352" y="572" width="381" height="42" rx="8" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2"/><text x="750.8" y="602" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">3.4 GB</text><text x="1552" y="602" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">可感知下降</text><text x="330" y="686" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">Q2_K</text><rect x="352" y="656" width="314" height="42" rx="8" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="2"/><text x="683.5999999999999" y="686" fill="#DC2626" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">2.8 GB</text><text x="1552" y="686" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">明显下降</text><line x1="80" y1="760" x2="1520" y2="760" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="80" y="810" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">越往下：文件越小、加载后占用内存越小、生成质量越低</text><text x="80" y="852" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">权重内存约等于文件体积；实际内存还要再加上下文 KV cache 和运行时开销</text></svg>