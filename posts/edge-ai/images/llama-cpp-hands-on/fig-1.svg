<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">llama.cpp 做了什么：从原始权重到本地可跑</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">把训练框架里的浮点权重，变成普通 CPU 也能流式加载的量化文件</text><rect x="48" y="250" width="330" height="200" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="213.0" y="346.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">原始权重</text><text x="213.0" y="382.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">FP16 / BF16，十几 GB</text><line x1="386" y1="350.0" x2="430" y2="350.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="438" y="250" width="330" height="200" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="603.0" y="346.0" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">量化</text><text x="603.0" y="382.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">压成 4 到 8 位整数</text><line x1="776" y1="350.0" x2="820" y2="350.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="828" y="250" width="330" height="200" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="993.0" y="346.0" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">GGUF 单文件</text><text x="993.0" y="382.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">权重、词表、超参打包</text><line x1="1166" y1="350.0" x2="1210" y2="350.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="1218" y="250" width="330" height="200" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1383.0" y="346.0" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">本地推理</text><text x="1383.0" y="382.0" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">mmap 加载，CPU 或 GPU 跑</text><rect x="80" y="570" width="1440" height="240" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="626" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">llama.cpp 提供的东西</text><text x="122" y="682" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 零依赖的 C/C++ 实现，能编译 C 的地方就能跑，不需要 Python 和深度学习框架</text><text x="122" y="728" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· GGUF 格式：把权重、词表、超参、对话模板收进一个文件，加载时不用再猜</text><text x="122" y="774" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 量化内核：把解量化融进矩阵乘，权重按 4 到 8 位存储，读取量随之下降</text></svg>