<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">两种跑法：命令行一次性问答，还是常驻的本地服务</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">同一份 GGUF、同一套推理内核，区别只在于有没有 HTTP 这一层</text><rect x="80" y="230" width="680" height="300" rx="18" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="120" y="292" fill="#0891B2" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">llama-cli</text><text x="130" y="356" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 一次加载、一次问答，退出即释放内存</text><text x="130" y="408" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 参数直接写在命令里，适合脚本化测试</text><text x="130" y="460" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 配合 llama-bench 跑基准，比较量化级别</text><rect x="840" y="230" width="680" height="300" rx="18" fill="#16A34A" fill-opacity="0.07" stroke="#16A34A" stroke-width="3"/><text x="880" y="292" fill="#16A34A" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">llama-server</text><text x="890" y="356" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 提供 OpenAI 兼容接口，改个 base_url 就能接</text><text x="890" y="408" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 模型常驻内存，多个请求共享同一份权重</text><text x="890" y="460" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 适合本地应用、编辑器插件、自己的脚本</text><rect x="80" y="640" width="1440" height="140" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="800.0" y="706.0" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">同一份 GGUF 模型文件  +  同一套量化推理内核</text><text x="800.0" y="743.0" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">上层是命令行还是 HTTP 服务，只影响怎么调用，不影响模型怎么算</text><line x1="400" y1="636" x2="400" y2="536" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><line x1="1200" y1="636" x2="1200" y2="536" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/></svg>