<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">让网络变小：深度可分离卷积把计算量砍到约八分之一</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">以输入 64x64x32、输出 64 通道、卷积核 3x3 为例的量级估算</text><rect x="80" y="230" width="680" height="300" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="112" y="286" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">标准卷积</text><text x="112" y="342" fill="#64748B" font-size="21" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">H x W x Cin x Cout x K x K</text><text x="112" y="400" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">64 x 64 x 32 x 64 x 9</text><text x="112" y="464" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 75.5 M 次乘加</text><text x="112" y="514" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每个输出通道都要扫过全部输入通道</text><rect x="840" y="230" width="680" height="300" rx="18" fill="#16A34A" fill-opacity="0.06" stroke="#16A34A" stroke-width="3"/><text x="872" y="286" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">深度可分离卷积</text><text x="872" y="338" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">第一步 深度卷积：</text><text x="1047.2" y="338" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">H x W x Cin x K x K</text><text x="872" y="426" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">第二步 逐点卷积：</text><text x="1047.2" y="426" fill="#64748B" font-size="20" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">H x W x Cin x Cout</text><text x="872" y="374" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">约 1.18 M</text><text x="872" y="462" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">约 8.39 M</text><text x="872" y="514" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">合计 约 9.6 M，约为原来的 1/8</text><text x="320" y="645" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">标准卷积</text><rect x="340" y="620" width="981" height="48" rx="8" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="2"/><text x="1340" y="650" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 75.5 M</text><text x="320" y="725" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="700">深度可分离</text><rect x="340" y="700" width="125" height="48" rx="8" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="2"/><text x="485" y="730" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 9.6 M</text><text x="80" y="812" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">省下的比例约等于 1/Cout + 1/(K x K)：通道越多、卷积核越大，省得越多</text></svg>