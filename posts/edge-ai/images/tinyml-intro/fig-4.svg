<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">从训练到 MCU：模型是怎么变成 C 数组的</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">训练在云端完成，部署只是把一段静态数据放进 Flash</text><rect x="48" y="250" width="272" height="220" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="184.0" y="356.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">训练</text><text x="184.0" y="391.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">PyTorch 训练，浮点模型</text><line x1="324" y1="360.0" x2="352" y2="360.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="356" y="250" width="272" height="220" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="492.0" y="356.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">转成 TFLite</text><text x="492.0" y="391.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">图结构固定下来</text><line x1="632" y1="360.0" x2="660" y2="360.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="664" y="250" width="272" height="220" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="800.0" y="356.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">量化到 INT8</text><text x="800.0" y="391.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">权重与激活都定点化</text><line x1="940" y1="360.0" x2="968" y2="360.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="972" y="250" width="272" height="220" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1108.0" y="356.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">转成 C 数组</text><text x="1108.0" y="391.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">生成 .cc 文件</text><line x1="1248" y1="360.0" x2="1276" y2="360.0" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="1280" y="250" width="272" height="220" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1416.0" y="356.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">链接进固件</text><text x="1416.0" y="391.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">随程序一起烧进芯片</text><rect x="80" y="560" width="1440" height="260" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="616" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">运行时在芯片上干两件事</text><rect x="112" y="650" width="660" height="130" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="442.0" y="711.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">TFLite Micro</text><text x="442.0" y="746.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">解释图结构、调度算子，管一块固定内存 arena</text><rect x="830" y="650" width="660" height="130" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1160.0" y="711.0" fill="#7C3AED" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">CMSIS-NN</text><text x="1160.0" y="746.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">用 Cortex-M 的 DSP 指令把算子算快</text><text x="800" y="852" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">一个管流程，一个管计算；模型文件本身不用改</text></svg>