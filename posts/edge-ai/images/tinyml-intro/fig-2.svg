<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">端侧的三个约束，在 MCU 上被放大到极限</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">内存、算力、功耗互相咬合，动一个就要动另外两个</text><rect x="80" y="230" width="440" height="450" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="108" y="288" fill="#2563EB" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">内存</text><line x1="104" y1="308" x2="496" y2="308" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="108" y="358" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">手机 / 端侧 SoC</text><text x="108" y="392" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">GB 级内存，模型可以整个装进内存</text><text x="108" y="462" fill="#2563EB" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">MCU</text><text x="108" y="496" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">几十到几百 KB，权重放 Flash</text><text x="108" y="528" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">中间张量靠一块固定缓冲反复复用</text><line x1="104" y1="566" x2="496" y2="566" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="108" y="610" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">被放大成</text><text x="108" y="646" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">每一 KB 都要算清楚</text><rect x="582" y="230" width="440" height="450" rx="18" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="610" y="288" fill="#0891B2" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">算力</text><line x1="606" y1="308" x2="998" y2="308" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="610" y="358" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">手机 / 端侧 SoC</text><text x="610" y="392" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">GHz 级主频，带 NPU 和 SIMD</text><text x="610" y="462" fill="#0891B2" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">MCU</text><text x="610" y="496" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">几十 MHz，多数没有浮点单元</text><text x="610" y="528" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">一次乘加都要省着用</text><line x1="606" y1="566" x2="998" y2="566" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="610" y="610" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">被放大成</text><text x="610" y="646" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">能不用浮点就不用浮点</text><rect x="1084" y="230" width="440" height="450" rx="18" fill="#D97706" fill-opacity="0.06" stroke="#D97706" stroke-width="3"/><text x="1112" y="288" fill="#D97706" font-size="30" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">功耗</text><line x1="1108" y1="308" x2="1500" y2="308" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="1112" y="358" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">手机 / 端侧 SoC</text><text x="1112" y="392" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">几瓦，靠手机电池和散热</text><text x="1112" y="462" fill="#D97706" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">MCU</text><text x="1112" y="496" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">毫瓦级，靠纽扣电池或能量采集</text><text x="1112" y="528" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">大部分时间在休眠，等触发</text><line x1="1108" y1="566" x2="1500" y2="566" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="1112" y="610" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">被放大成</text><text x="1112" y="646" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">功耗直接决定电池寿命</text><text x="80" y="750" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">三个约束在 MCU 上同时收紧，任何一个都不允许单独放宽</text><text x="80" y="796" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">所以选模型的标准也变了：不是准确率最高，而是每 KB 内存、每毫秒、每微焦换来的收益最高</text></svg>