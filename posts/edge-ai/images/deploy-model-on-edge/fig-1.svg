<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">端侧部署的完整链路</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">从现成模型到量化后的 ONNX，每一步都能单独验证</text><path d="M80.0,200 L336.0,200 L360.0,256.0 L336.0,312 L80.0,312 L104.0,256.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="228.0" y="266.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1. 取模型</text><path d="M370.0,200 L626.0,200 L650.0,256.0 L626.0,312 L370.0,312 L394.0,256.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="518.0" y="266.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2. 导出 ONNX</text><path d="M660.0,200 L916.0,200 L940.0,256.0 L916.0,312 L660.0,312 L684.0,256.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="808.0" y="266.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3. ORT 推理</text><path d="M950.0,200 L1206.0,200 L1230.0,256.0 L1206.0,312 L950.0,312 L974.0,256.0 Z" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="1098.0" y="266.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4. 量化</text><path d="M1240.0,200 L1496.0,200 L1520.0,256.0 L1496.0,312 L1240.0,312 L1264.0,256.0 Z" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="3"/><text x="1388.0" y="266.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5. 对比</text><rect x="80.0" y="380.0" width="280.0" height="300.0" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="220.0" y="526.0" fill="#2563EB" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">torchvision</text><text x="220.0" y="561.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">取现成模型</text><rect x="370.0" y="380.0" width="280.0" height="300.0" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="510.0" y="526.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">torch.onnx</text><text x="510.0" y="561.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">导出 ONNX</text><rect x="660.0" y="380.0" width="280.0" height="300.0" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="800.0" y="526.0" fill="#7C3AED" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">onnxruntime</text><text x="800.0" y="561.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">跑 FP32 基线</text><rect x="950.0" y="380.0" width="280.0" height="300.0" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="1090.0" y="526.0" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">quantize_*</text><text x="1090.0" y="561.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">动态 / 静态量化</text><rect x="1240.0" y="380.0" width="280.0" height="300.0" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1380.0" y="526.0" fill="#16A34A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">对比</text><text x="1380.0" y="561.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">精度 / 延迟 / 体积</text><text x="80" y="740" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">顺序不能反：先用 FP32 把基线跑对，再动量化，否则出了问题分不清是导出错了还是量化错了</text><text x="80" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每一步都留下产物（onnx 文件、量化后的 onnx、对比表），出问题可以回退到上一步</text></svg>