<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">量化前后对比：精度、延迟、体积</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">数字来自一次真实测量（ResNet18 + 真实照片），换设备、换版本都会变</text><rect x="110" y="200" width="1370" height="68" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#CBD5E1" stroke-width="2"/><text x="132" y="243.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">指标</text><text x="635.0" y="243.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">FP32 基线</text><text x="970.0" y="243.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">动态量化 INT8</text><text x="1310.0" y="243.0" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">静态量化 INT8</text><rect x="110" y="268" width="1370" height="78" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="132" y="315.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">模型体积</text><text x="635.0" y="315.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">46.7 MB</text><text x="970.0" y="315.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">11.7 MB</text><text x="1310.0" y="315.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">11.8 MB</text><rect x="110" y="346" width="1370" height="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="132" y="393.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">单张延迟（中位数）</text><text x="635.0" y="393.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">13.9 ms</text><text x="970.0" y="393.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">9.2 ms</text><text x="1310.0" y="393.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">3.5 ms</text><rect x="110" y="424" width="1370" height="78" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="132" y="471.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">相对 FP32 的速度</text><text x="635.0" y="471.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">1.0 倍</text><text x="970.0" y="471.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">1.5 倍</text><text x="1310.0" y="471.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">4.0 倍</text><rect x="110" y="502" width="1370" height="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="132" y="549.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Top-1 与 FP32 一致率</text><text x="635.0" y="549.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">基线</text><text x="970.0" y="549.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">85.0%</text><text x="1310.0" y="549.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">85.2%</text><rect x="110" y="580" width="1370" height="78" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="132" y="627.0" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Top-5 与 FP32 一致率</text><text x="635.0" y="627.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">基线</text><text x="970.0" y="627.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">100%</text><text x="1310.0" y="627.0" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">100%</text><rect x="110" y="200" width="1370" height="458" rx="12" fill="none" stroke="#CBD5E1" stroke-width="2"/><rect x="110" y="680" width="1370" height="180" rx="18" fill="#0891B2" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="730" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">怎么读这张表</text><text x="150" y="778" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">体积：两条路线都降到约四分之一，省下的是权重，这一点是确定的</text><text x="150" y="820" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">延迟：静态量化拿到 4 倍加速，动态量化只有 1.5 倍，因为激活也要跟着整数化才有收益</text></svg>