<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#2563EB"/></marker><marker id="a16A34A" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#16A34A"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">动态量化与静态量化差在哪</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">差在校准这一步：静态量化要先摸清激活的取值范围</text><rect x="80" y="200" width="680" height="580" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="120" y="268" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">动态量化</text><rect x="840" y="200" width="680" height="580" rx="18" fill="#16A34A" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="880" y="268" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">静态量化</text><rect x="120" y="320" width="600" height="84" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="420.0" y="370.4" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">权重离线量化为 INT8</text><line x1="420" y1="404" x2="420" y2="432" stroke="#2563EB" stroke-width="3" marker-end="url(#a2563EB)"/><rect x="120" y="432" width="600" height="84" rx="16" 