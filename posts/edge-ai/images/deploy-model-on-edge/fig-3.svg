4" width="600" height="84" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1180.0" y="594.4" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">统计激活范围，算 scale</text><line x1="1180" y1="628" x2="1180" y2="656" stroke="#16A34A" stroke-width="3" marker-end="url(#a16A34A)"/><rect x="880" y="656" width="600" height="84" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1180.0" y="706.4" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">激活也离线量化，更快</text><text x="800" y="840" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">两条路线的起点相同，区别只在激活：一个在线量化，一个离线量化</text></svg>