<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">灰度与分批：别一次推给所有设备</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">分批比例、观察窗口、回滚门限，三样先定下来</text><text x="110" y="274" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">第 1 批 内部设备</text><rect x="480" y="250" width="60" height="34" rx="8" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-width="3"/><text x="556" y="274" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">1%</text><text x="110" y="324" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">第 2 批 种子用户</text><rect x="480" y="300" width="150" height="34" rx="8" fill="#0891B2" fill-opacity="0.16" stroke="#0891B2" stroke-width="3"/><text x="646" y="324" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">5%</text><text x="110" y="374" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">第 3 批 灰度用户</text><rect x="480" y="350" width="300" height="34" rx="8" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="3"/><text x="796" y="374" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">10% 到 30%</text><text x="110" y="424" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">全量推送</text><rect x="480" y="400" width="880" height="34" rx="8" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-width="3"/><text x="1376" y="424" fill="#7C3AED" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">100%</text><text x="800" y="490" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">比例只是示例，关键是每批都比上一批大，而且每批都能停住</text><rect x="80" y="530" width="700" height="200" rx="16" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="110" y="582" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">每一批看什么</text><text x="130" y="630" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 启动成功率、崩溃率</text><text x="130" y="668" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 关键功能自检通过率</text><text x="130" y="706" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 回滚率与错误上报</text><rect x="820" y="530" width="700" height="200" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="3"/><text x="850" y="582" fill="#DC2626" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">回滚门限（示例）</text><text x="870" y="630" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 启动失败率超过 1%</text><text x="870" y="668" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 关键功能自检不通过</text><text x="870" y="706" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 崩溃率高于上一版本</text><text x="800" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">门限提前定好，触发就自动回滚，不等人拍板</text></svg>