<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">A/B 双分区：为什么能安全回滚</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">新版本永远先写进没在跑的那个分区，切换只改一个指针</text><rect x="100" y="240" width="620" height="550" rx="18" fill="#64748B" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="130" y="296" fill="#64748B" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Flash 布局</text><rect x="130" y="330" width="560" height="70" rx="16" fill="#0F172A" fill-opacity="0.05" stroke="#0F172A" stroke-width="3"/><text x="410.0" y="372.7" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">Bootloader 与启动指针</text><rect x="130" y="420" width="270" height="120" rx="12" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="3"/><text x="265" y="466" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">分区 A</text><text x="265" y="508" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">v1.4 运行中</text><rect x="420" y="420" width="270" height="120" rx="12" fill="#D97706" fill-opacity="0.10" stroke="#D97706" stroke-width="3"/><text x="555" y="466" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">分区 B</text><text x="555" y="508" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">v1.5 已写入待切换</text><rect x="130" y="560" width="560" height="90" rx="12" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="2"/><text x="410" y="612" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">数据分区（配置、标定、日志）</text><text x="130" y="700" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">切换前先校验 B 的完整性，再改指针</text><text x="130" y="740" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">旧分区不删除，留作回滚</text><rect x="820" y="240" width="700" height="550" rx="18" fill="#0891B2" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="850" y="296" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">切换与回滚</text><text x="850" y="370" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">1. 下载新固件到备用分区</text><text x="850" y="432" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">2. 校验哈希与签名，写元数据</text><text x="850" y="494" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">3. 标记待启动，重启设备</text><text x="850" y="556" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">4. 新版本自检通过，确认有效</text><text x="850" y="618" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">5. 自检失败，切回旧分区</text><text x="850" y="680" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">6. 连续失败超过阈值，停止尝试并上报</text><circle cx="1455" cy="556" r="28" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M1442.4,556 L1452.2,567.2 L1469.0,546.2" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1455" cy="618" r="28" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M1442.4,605.4 L1467.6,630.6 M1467.6,605.4 L1442.4,630.6" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="850" y="750" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">旧版本先保留，确认稳定后再回收空间</text></svg>