<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">从标称 TOPS 到有效算力，中间要过三关</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">宣传页给的是峰值，你要的是自己模型实际能跑到的值</text><path d="M110,210 L1010,210 L180,320 L940,320 Z" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="3"/><text x="560" y="256" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">标称峰值 TOPS</text><text x="560" y="288" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">先问一句：这是哪个精度下的</text><path d="M180,320 L940,320 L250,430 L870,430 Z" fill="#0891B2" fill-opacity="0.14" stroke="#0891B2" stroke-width="3"/><text x="560" y="366" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">乘上利用率</text><text x="560" y="398" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">算子匹配、数据供应、调度不空转</text><path d="M250,430 L870,430 L320,540 L800,540 Z" fill="#D97706" fill-opacity="0.14" stroke="#D97706" stroke-width="3"/><text x="560" y="476" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">算子覆盖率</text><text x="560" y="508" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">表外算子回退到 CPU，这一段不算数</text><path d="M320,540 L800,540 L390,650 L730,650 Z" fill="#16A34A" fill-opacity="0.14" stroke="#16A34A" stroke-width="3"/><text x="560" y="586" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">有效算力</text><text x="560" y="618" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">你这个模型在这颗芯片上跑得到的值</text><text x="560" y="700" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">宣传页的数字只能当上限参考</text><text x="560" y="742" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">换算的办法只有一个：把模型在这颗芯片上真跑一遍</text><rect x="1060" y="220" width="460" height="160" rx="16" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="1092" y="272" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">坑 1 精度</text><text x="1092" y="316" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">TOPS 必须和精度绑定着看</text><text x="1092" y="350" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">INT8 与 FP16 不是一回事</text><rect x="1060" y="400" width="460" height="160" rx="16" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="1092" y="452" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">坑 2 峰值与实测</text><text x="1092" y="496" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">真实模型能跑到峰值</text><text x="1092" y="530" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">百分之几十就算不错</text><rect x="1060" y="580" width="460" height="160" rx="16" fill="#D97706" fill-opacity="0.06" stroke="#D97706" stroke-width="3"/><text x="1092" y="632" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">坑 3 稀疏算力</text><text x="1092" y="676" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">带稀疏的更高 TOPS 来自</text><text x="1092" y="710" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">结构化稀疏，稠密模型用不上</text><text x="1290" y="800" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">像汽车宣传页上的最高时速</text><text x="1290" y="838" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">日常在市区开，决定体验的不是它</text></svg>