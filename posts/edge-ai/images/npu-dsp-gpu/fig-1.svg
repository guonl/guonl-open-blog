<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">四种计算单元：一条从通用到专用的光谱</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">越专用，能效越高，灵活性越低</text><rect x="110" y="228" width="280" height="176" rx="18" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="3"/><text x="250" y="276" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">CPU</text><text x="250" y="316" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">什么都能干</text><text x="250" y="346" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">一次只盯一两件事</text><text x="250" y="376" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">延迟确定</text><line x1="250" y1="408" x2="250" y2="416" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="480" y="228" width="280" height="176" rx="18" fill="#0891B2" fill-opacity="0.08" stroke="#0891B2" stroke-width="3"/><text x="620" y="276" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">GPU</text><text x="620" y="316" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">成千上万个小核心</text><text x="620" y="346" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">适合规则并行</text><text x="620" y="376" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">功耗与调度开销大</text><line x1="620" y1="408" x2="620" y2="416" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="850" y="228" width="280" height="176" rx="18" fill="#D97706" fill-opacity="0.08" stroke="#D97706" stroke-width="3"/><text x="990" y="276" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">DSP</text><text x="990" y="316" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">定长向量、SIMD</text><text x="990" y="346" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">滤波、FFT、卷积</text><text x="990" y="376" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">编程门槛高</text><line x1="990" y1="408" x2="990" y2="416" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="1190" y="228" width="280" height="176" rx="18" fill="#7C3AED" fill-opacity="0.08" stroke="#7C3AED" stroke-width="3"/><text x="1330" y="276" fill="#7C3AED" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">NPU</text><text x="1330" y="316" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">成片乘加阵列</text><text x="1330" y="346" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">片上缓冲反复复用</text><text x="1330" y="376" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">只认固定的算子表</text><line x1="1330" y1="408" x2="1330" y2="416" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><line x1="140" y1="420" x2="1458" y2="420" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><circle cx="250" cy="420" r="11" fill="#2563EB"/><circle cx="620" cy="420" r="11" fill="#0891B2"/><circle cx="990" cy="420" r="11" fill="#D97706"/><circle cx="1330" cy="420" r="11" fill="#7C3AED"/><text x="140" y="466" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">通用、灵活、生态成熟</text><text x="1458" y="466" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">专用、省电、挑模型</text><rect x="80" y="500" width="1440" height="340" rx="18" fill="#64748B" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><line x1="120" y1="548" x2="166" y2="548" stroke="#16A34A" stroke-width="5"/><text x="180" y="556" fill="#16A34A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">能效比（每瓦能跑多少次运算）</text><line x1="640" y1="548" x2="686" y2="548" stroke="#D97706" stroke-width="5"/><text x="700" y="556" fill="#D97706" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei'