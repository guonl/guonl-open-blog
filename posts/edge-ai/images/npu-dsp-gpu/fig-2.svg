<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">能效比：完成同样的运算量，耗能差一个数量级</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">相对值只表示量级，实际倍数随芯片、算子、精度变化很大</text><rect x="80" y="220" width="940" height="430" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="3"/><text x="112" y="274" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">完成同样的运算量，相对能耗（示意）</text><text x="130" y="350" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">CPU</text><rect x="260" y="320" width="460" height="44" rx="8" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="3"/><text x="738.0" y="350" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">100</text><text x="130" y="424" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">GPU</text><rect x="260" y="394" width="207" height="44" rx="8" fill="#0891B2" fill-opacity="0.18" stroke="#0891B2" stroke-width="3"/><text x="485.0" y="424" fill="#0891B2" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 45</text><text x="130" y="498" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">DSP</text><rect x="260" y="468" width="83" height="44" rx="8" fill="#D97706" fill-opacity="0.18" stroke="#D97706" stroke-width="3"/><text x="360.8" y="498" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 18</text><text x="130" y="572" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">NPU</text><rect x="260" y="542" width="37" height="44" rx="8" fill="#16A34A" fill-opacity="0.18" stroke="#16A34A" stroke-width="3"/><text x="314.8" y="572" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">约 8</text><text x="130" y="630" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">数字越小越省电：同样的活，专用单元烧的电少得多</text><rect x="1060" y="220" width="460" height="430" rx="18" fill="#D97706" fill-opacity="0.05" stroke="#D97706" stroke-width="3"/><text x="1092" y="274" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">换个类比</text><text x="1092" y="330" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">搬一车砖，叉车不比人跑得快，</text><text x="1092" y="370" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">但同样一车砖，烧的油少得多。</text><text x="1092" y="410" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">加速器省的是油，不是绝对速度。</text><line x1="1092" y1="452" x2="1488" y2="452" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="1092" y="500" fill="#D97706" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">端侧的三重约束</text><text x="1104" y="544" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 电池：长时间满载掉电快</text><text x="1104" y="582" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 散热：发烫就降频</text><text x="1104" y="620" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 体积：没有风扇可用</text><text x="800" y="736" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">端侧看的是每瓦能算多少次（TOPS/W），不是每秒能算多少次</text><text x="800" y="786" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">峰值算力决定上限，能效比决定这个上限能持续多久、能不能落进功耗预算</text></svg>