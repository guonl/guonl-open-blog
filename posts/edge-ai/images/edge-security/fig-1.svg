<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">安全启动链：一级校验一级</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">信任根在芯片里改不了，每一级只做一件事：验下一级的签名</text><rect x="140" y="200" width="560" height="76" rx="14" fill="#D97706" fill-opacity="0.10" stroke="#D97706" stroke-width="3"/><text x="170" y="234" fill="#D97706" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Boot ROM</text><text x="170" y="262" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">出厂固化在芯片只读区，谁也改不了</text><line x1="420" y1="278" x2="420" y2="296" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="444" y="292" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">验签通过</text><rect x="140" y="300" width="560" height="76" rx="14" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="3"/><text x="170" y="334" fill="#2563EB" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">第一级引导程序</text><text x="170" y="362" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">验签通过才交出控制权</text><line x1="420" y1="378" x2="420" y2="396" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="444" y="392" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">验签通过</text><rect x="140" y="400" width="560" height="76" rx="14" fill="#0891B2" fill-opacity="0.10" stroke="#0891B2" stroke-width="3"/><text x="170" y="434" fill="#0891B2" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">第二级引导程序</text><text x="170" y="462" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">继续校验下一级</text><line x1="420" y1="478" x2="420" y2="496" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="444" y="492" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">验签通过</text><rect x="140" y="500" width="560" height="76" rx="14" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="3"/><text x="170" y="534" fill="#16A34A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">内核</text><text x="170" y="562" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">校验根文件系统</text><line x1="420" y1="578" x2="420" y2="596" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="444" y="592" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">验签通过</text><rect x="140" y="600" width="560" height="76" rx="14" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-width="3"/><text x="170" y="634" fill="#7C3AED" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">根文件系统</text><text x="170" y="662" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">校验应用</text><line x1="420" y1="678" x2="420" y2="696" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="444" y="692" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">验签通过</text><rect x="140" y="700" width="560" height="76" rx="14" fill="#64748B" fill-opacity="0.10" stroke="#64748B" stroke-width="3"/><text x="170" y="734" fill="#64748B" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">应用</text><text x="170" y="762" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">启动完成</text><rect x="780" y="200" width="740" height="576" rx="18" fill="#64748B" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="812" y="254" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">信任根为什么必须在这里</text><text x="830" y="300" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· Boot ROM 的代码固化在只读区，改不了</text><text x="830" y="338" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 验签公钥的哈希烧进 eFuse 或 OTP，擦不掉</text><text x="830" y="376" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 整条链的信任都收敛到这一小块</text><line x1="812" y1="424" x2="1488" y2="424" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="812" y="474" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">两件常被混淆的事</text><text x="830" y="520" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 验签用公钥：可以公开，放在设备里不怕被读</text><text x="830" y="558" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 签名用私钥：留在厂商的签名服务器，永不进设备</text><line x1="812" y1="606" x2="1488" y2="606" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="812" y="656" fill="#DC2626" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">代价要提前想清楚</text><text x="830" y="696" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 启动变慢：每级一次验签，大固件几十到几百毫秒</text><text x="830" y="732" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 密钥烧进去就改不了，私钥泄露只能换新设备</text><text x="830" y="768" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 调试变麻烦，量产必须彻底关掉开发模式</text><text x="800" y="836" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">安全启动只保证跑的是签过名的代码，不保证代码本身没有漏洞</text></svg>