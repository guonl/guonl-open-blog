hor="start" font-weight="400">根文件系统只读，数据写单独分区</text><circle cx="1482" cy="628" r="22" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M1472.1,628 L1479.8,636.8 L1493.0,620.3" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="112" y1="662" x2="728" y2="662" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><line x1="872" y1="662" x2="1488" y2="662" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><text x="120" y="686" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">隔离</text><text x="120" y="718" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">进程之间没有隔离</text><circle cx="722" cy="702" r="22" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M712.1,692.1 L731.9,711.9 M731.9,692.1 L712.1,711.9" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="880" y="686" fill="#16A34A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">隔离</text><text x="880" y="718" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">跑模型与管网络的进程分开</text><circle cx="1482" cy="702" r="22" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M1472.1,702 L1479.8,710.8 L1493.0,694.3" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="806" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">权限收得越紧，被攻破后能造成的破坏就越小</text><text x="800" y="848" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">把一台什么都能干的通用计算机，收成一台只干这一件事的专用设备</text></svg>