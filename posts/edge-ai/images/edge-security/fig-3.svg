<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">攻击面收敛：默认全关，只开需要的</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">每一项关掉或收紧，都少一类入口</text><rect x="80" y="220" width="680" height="540" rx="18" fill="#DC2626" fill-opacity="0.04" stroke="#DC2626" stroke-width="3"/><text x="112" y="274" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">出厂默认</text><rect x="840" y="220" width="680" height="540" rx="18" fill="#16A34A" fill-opacity="0.04" stroke="#16A34A" stroke-width="3"/><text x="872" y="274" fill="#16A34A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">加固之后</text><text x="120" y="316" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">调试口</text><text x="120" y="348" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">JTAG 与调试串口开放</text><circle cx="722" cy="332" r="22" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M712.1,322.1 L731.9,341.9 M731.9,322.1 L712.1,341.9" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="880" y="316" fill="#16A34A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">调试口</text><text x="880" y="348" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">量产固件关闭，或至少加认证</text><circle cx="1482" cy="332" r="22" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M1472.1,332 L1479.8,340.8 L1493.0,324.3" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="112" y1="366" x2="728" y2="366" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><line x1="872" y1="366" x2="1488" y2="366" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><text x="120" y="390" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">口令</text><text x="120" y="422" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">默认口令的登录页面</text><circle cx="722" cy="406" r="22" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M712.1,396.1 L731.9,415.9 M731.9,396.1 L712.1,415.9" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="880" y="390" fill="#16A34A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">口令</text><text x="880" y="422" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">改掉默认口令，去掉用不上的登录入口</text><circle cx="1482" cy="406" r="22" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M1472.1,406 L1479.8,414.8 L1493.0,398.3" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="112" y1="440" x2="728" y2="440" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><line x1="872" y1="440" x2="1488" y2="440" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><text x="120" y="464" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">服务与端口</text><text x="120" y="496" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">示例程序开的端口</text><circle cx="722" cy="480" r="22" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M712.1,470.1 L731.9,489.9 M731.9,470.1 L712.1,489.9" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="880" y="464" fill="#16A34A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">服务与端口</text><text x="880" y="496" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">只留必要端口，逐个核对监听列表</text><circle cx="1482" cy="480" r="22" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M1472.1,480 L1479.8,488.8 L1493.0,472.3" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="112" y1="514" x2="728" y2="514" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><line x1="872" y1="514" x2="1488" y2="514" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/><text x="120" y="538" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">进程权限</text><text x="120" y="570" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">所有进程以 root 运行</text><circle cx="722" cy="554" r="22" fi