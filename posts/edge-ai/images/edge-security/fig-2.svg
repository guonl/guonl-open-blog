<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">设备密钥放哪：差别不在算法强弱</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">关键只有一条：私钥能不能被读出来</text><rect x="80" y="220" width="680" height="470" rx="18" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="3"/><text x="112" y="276" fill="#DC2626" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">错误做法：硬编码在固件里</text><rect x="120" y="308" width="600" height="112" rx="14" fill="#0B1220" stroke="#CBD5E1" stroke-width="2"/><text x="146" y="352" fill="#FCA5A5" font-size="21" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">DEVICE_KEY = "0f8a1c..."</text><text x="146" y="392" fill="#94A3B8" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">所有设备共用同一把私钥</text><text x="130" y="470" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 固件会被读出来，密钥跟着一起泄露</text><text x="130" y="514" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 一台泄露等于全部泄露</text><text x="130" y="558" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 没法吊销，换密钥等于全网重刷固件</text><circle cx="700" cy="636" r="26" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M688.3,624.3 L711.7,647.7 M711.7,624.3 L688.3,647.7" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="660" y="644" fill="#DC2626" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">读 flash 就能拿到</text><rect x="840" y="220" width="680" height="470" rx="18" fill="#16A34A" fill-opacity="0.05" stroke="#16A34A" stroke-width="3"/><text x="872" y="276" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">正确做法：一机一密 + 专用存储</text><rect x="880" y="306" width="600" height="62" rx="12" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/><text x="902" y="334" fill="#16A34A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">安全元件 SE</text><text x="902" y="358" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">独立小芯片，专做密钥与加解密</text><rect x="880" y="382" width="600" height="62" rx="12" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/><text x="902" y="410" fill="#16A34A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">TPM</text><text x="902" y="434" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">密钥存储与度量，多用于计算平台</text><rect x="880" y="458" width="600" height="62" rx="12" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/><text x="902" y="486" fill="#16A34A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">芯片 OTP</text><text x="902" y="510" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">只能写一次的受保护密钥区</text><text x="890" y="560" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 私钥生成后就出不来，运算在芯片内部做</text><text x="890" y="600" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 主处理器只拿到结果，拿不到私钥本身</text><text x="890" y="640" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· mTLS 双向认证，云端能按证书吊销单台设备</text><text x="800" y="750" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">机密性靠密钥，密钥靠硬件：软件层的加密再强，密钥在同一个软件层里就一起被拿走</text><text x="800" y="800" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">把读到密钥变成必须物理攻破芯片，门槛高了一个数量级</text></svg>