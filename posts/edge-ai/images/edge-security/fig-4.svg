<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">安全更新链路：防线在设备端</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">签名在设备端做，就不必信任传输通道和服务器</text><path d="M80.0,230 L336.0,230 L360.0,278.0 L336.0,326 L80.0,326 L104.0,278.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="228.0" y="288.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1. 厂商签名</text><path d="M370.0,230 L626.0,230 L650.0,278.0 L626.0,326 L370.0,326 L394.0,278.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="518.0" y="288.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2. 发布与下载</text><path d="M660.0,230 L916.0,230 L940.0,278.0 L916.0,326 L660.0,326 L684.0,278.0 Z" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="3"/><text x="808.0" y="288.0" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3. 设备端验签</text><path d="M950.0,230 L1206.0,230 L1230.0,278.0 L1206.0,326 L950.0,326 L974.0,278.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="1098.0" y="288.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4. 写入备用分区</text><path d="M1240.0,230 L1496.0,230 L1520.0,278.0 L1496.0,326 L1240.0,326 L1264.0,278.0 Z" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="3"/><text x="1388.0" y="288.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5. 重启切换或回滚</text><rect x="80" y="380" width="900" height="330" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="3"/><text x="112" y="434" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">设备端验签，任何一步不过就拒绝</text><text x="130" y="486" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">1.</text><text x="172" y="486" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">型号匹配</text><text x="360" y="486" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">固件型号与设备对不上，直接拒绝</text><circle cx="944" cy="480" r="20" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M935.0,480 L942.0,488.0 L954.0,473.0" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="546" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">2.</text><text x="172" y="546" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">版本不回退</text><text x="360" y="546" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">低于已安装版本，当成降级攻击</text><circle cx="944" cy="540" r="20" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M935.0,540 L942.0,548.0 L954.0,533.0" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="606" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">3.</text><text x="172" y="606" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">公钥验签</text><text x="360" y="606" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">用内置公钥验描述文件的签名</text><circle cx="944" cy="600" r="20" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M935.0,600 L942.0,608.0 L954.0,593.0" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="666" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">4.</text><text x="172" y="666" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">内容核对</text><text x="360" y="666" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">固件哈希与描述文件里的哈希一致</text><circle cx="944" cy="660" r="20" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><path d="M935.0,660 L942.0,668.0 L954.0,653.0" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="1020" y="380" width="500" height="330" rx="18" fill="#D97706" fill-opacity="0.05" stroke="#D97706" stroke-width="3"/><text x="1052" y="434" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">配套要有</text><text x="1070" y="486" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· A/B 双分区，启动失败自动切回旧分区</text><text x="1070" y="536" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 反回滚计数器只增不减，存在受保护区域</text><text x="1070" y="586" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 更新失败要有重试和回退，别卡在半新半旧</text><text x="1070" y="636" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 支持多把验签公钥，为密钥轮换留出空间</text><rect x="80" y="740" width="1440" height="110" rx="18" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="3"/><text x="112" y="792" fill="#DC2626" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">TLS 不能替代固件签名</text><text x="112" y="824" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">攻击者可以用自己的服务器配一张合法证书，给设备推恶意固件：TLS 是好的，固件是假的</text></svg>