<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">一个周期的时间预算</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">控制环 100 Hz：整个周期只有 10 ms，所有任务都要挤在这条线内</text><text x="160" y="182" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">控制环 100 Hz：一个周期 10 ms</text><rect x="160" y="205" width="130" height="88" rx="12" fill="#DC2626" fill-opacity="0.16" stroke="#DC2626" stroke-width="3"/><text x="225.0" y="259" fill="#DC2626" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">中断</text><rect x="290" y="205" width="260" height="88" rx="12" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="3"/><text x="420.0" y="259" fill="#2563EB" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">控制计算</text><rect x="550" y="205" width="195" height="88" rx="12" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-width="3"/><text x="647.5" y="259" fill="#16A34A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">通信/日志</text><rect x="745" y="205" width="715" height="88" rx="12" fill="#64748B" fill-opacity="0.06" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8"/><text x="1102.5" y="259" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">余量</text><line x1="1460" y1="185" x2="1460" y2="310" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/><text x="1472" y="226" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">10 ms</text><text x="160" y="340" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">1 ms 中断 + 2 ms 控制计算 + 1.5 ms 通信与日志 = 4.5 ms，剩下 5.5 ms 是余量</text><text x="160" y="430" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">一次大模型推理：几百毫秒</text><rect x="160" y="455" width="1340" height="88" rx="12" fill="#DC2626" fill-opacity="0.10" stroke="#DC2626" stroke-width="3"/><rect x="160" y="455" width="130" height="88" rx="12" fill="#2563EB" fill-opacity="0.25" stroke="#2563EB" stroke-width="3"/><text x="225" y="509" fill="#2563EB" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">10 ms</text><text x="400" y="509" fill="#DC2626" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">整条红条是一次推理的耗时量级，蓝段是一个控制周期的长度</text><text x="800" y="596" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">两者差一到两个数量级：推理还没算完，控制环已经该走下一拍了</text><rect x="160" y="650" width="1340" height="130" rx="16" fill="#64748B" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="196" y="700" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">WCET：最坏执行时间</text><text x="196" y="748" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">把每个任务的最坏执行时间加起来，仍要留在周期内，这才是实时系统给的保证</text><text x="800" y="850" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">平均值好看没有用，控制环要的是最坏情况也能按时完成</text></svg>