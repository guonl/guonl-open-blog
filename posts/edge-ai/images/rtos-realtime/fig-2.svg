<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">硬实时、软实时、非实时</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">区别不在快慢，在错过截止时间之后会发生什么</text><rect x="80" y="230" width="453" height="430" rx="18" fill="#DC2626" fill-opacity="0.07" stroke="#DC2626" stroke-width="3"/><text x="110" y="306" fill="#DC2626" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">硬实时</text><text x="110" y="354" fill="#DC2626" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">错过 = 系统失效</text><line x1="110" y1="384" x2="503" y2="384" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="114" y="444" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 电机电流环、力控内环</text><text x="114" y="494" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 安全气囊、飞行控制</text><text x="114" y="544" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 要求：最坏情况必须满足</text><line x1="110" y1="578" x2="503" y2="578" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="110" y="626" fill="#DC2626" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">看最坏延迟</text><rect x="573" y="230" width="453" height="430" rx="18" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="603" y="306" fill="#D97706" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">软实时</text><text x="603" y="354" fill="#D97706" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">错过 = 体验变差</text><line x1="603" y1="384" x2="996" y2="384" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="607" y="444" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 音频与视频播放</text><text x="607" y="494" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 界面响应、语音交互</text><text x="607" y="544" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 要求：平均达标，尾部别太差</text><line x1="603" y1="578" x2="996" y2="578" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="603" y="626" fill="#D97706" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">看平均值与尾部</text><rect x="1066" y="230" width="453" height="430" rx="18" fill="#64748B" fill-opacity="0.07" stroke="#64748B" stroke-width="3"/><text x="1096" y="306" fill="#64748B" font-size="32" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">非实时</text><text x="1096" y="354" fill="#64748B" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">没有截止时间</text><line x1="1096" y1="384" x2="1489" y2="384" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="1100" y="444" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 批处理、日志归档</text><text x="1100" y="494" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 模型训练、数据分析</text><text x="1100" y="544" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 要求：吞吐优先，慢点没关系</text><line x1="1096" y1="578" x2="1489" y2="578" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="1096" y="626" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">看吞吐量</text><text x="800" y="745" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">同一个系统里三档可以同时存在：控制环硬实时，感知软实时，日志非实时</text></svg>