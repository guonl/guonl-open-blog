" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/></g><rect x="72" y="56" width="224" height="44" rx="22" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/><text x="184.0" y="86" fill="#38BDF8" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">实时性与算控一体</text><text x="150" y="176" fill="#22C55E" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">控制环：周期固定，每拍都要准时</text><rect x="150" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="216" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="282" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="348" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="414" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="480" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="546" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="612" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="678" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><rect x="744" y="192" width="46" height="40" rx="8" fill="#22C55E" fill-opacity="0.35" stroke="#22C55E" stroke-width="2"/><text x="150" y="268" fill="#94A3B8" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">每 10 ms 一拍，抖动要压到微秒级</text><text x="150" y="356" fill="#F59E0B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">大模型推理：一次几百毫秒，而且不稳定</text><rect x="150" y="372" width="360" height="56" rx="8" fill="#F59E0B" fill-opacity="0.34" stroke="#F59E0B" stroke-width="2"/><text x="330" y="407" fill="#F59E0B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">典型 180 ms</text><rect x="510" y="372" width="500" height="56" rx="8" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 8"/><text x="760" y="407" fill="#F59E0B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">最坏 900 ms</text><text x="150" y="462" fill="#94A3B8" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">这次 180 ms，下次 900 ms，最坏情况说不准</text><text x="72" y="520" fill="#F8FAFC" font-size="58" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">RTOS 与实时性</text><text x="72" y="572" fill="#94A3B8" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">为什么 AI 和实时控制会打架</text><rect x="72" y="596" width="120" height="8" rx="4" fill="#38BDF8"/><text x="1128" y="606" fill="#94A3B8" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="500">guonl-open-blog</text></svg>