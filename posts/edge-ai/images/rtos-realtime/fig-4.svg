<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">优先级反转与优先级继承</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">高优先级任务被低优先级挡住，又被中优先级插队，这叫优先级反转</text><text x="200" y="185" fill="#DC2626" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">没有优先级继承</text><text x="420" y="185" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">高优先级被中优先级拖住</text><text x="80" y="248" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">高</text><rect x="200" y="210" width="1280" height="56" rx="10" fill="#64748B" fill-opacity="0.04"/><text x="80" y="314" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">中</text><rect x="200" y="276" width="1280" height="56" rx="10" fill="#64748B" fill-opacity="0.04"/><text x="80" y="380" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">低</text><rect x="200" y="342" width="1280" height="56" rx="10" fill="#64748B" fill-opacity="0.04"/><rect x="300" y="210" width="900" height="56" rx="10" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="2"/><text x="750.0" y="245" fill="#DC2626" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">阻塞：等锁</text><rect x="1200" y="210" width="200" height="56" rx="10" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="2"/><text x="1300.0" y="245" fill="#2563EB" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">执行</text><rect x="480" y="276" width="520" height="56" rx="10" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2"/><text x="740.0" y="311" fill="#D97706" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">运行</text><rect x="200" y="342" width="280" height="56" rx="10" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="2"/><text x="340.0" y="377" fill="#16A34A" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">持锁运行</text><rect x="480" y="342" width="520" height="56" rx="10" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="2"/><text x="740.0" y="377" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">被抢占（锁还握着）</text><rect x="1000" y="342" width="200" height="56" rx="10" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="2"/><text x="1100.0" y="377" fill="#16A34A" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">持锁运行</text><line x1="1200" y1="200" x2="1200" y2="404" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 6"/><text x="1200" y="428" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">这里才释放锁</text><text x="800" y="470" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">高优先级白等了 900 个时间单位，而中优先级根本不需要那把锁</text><text x="200" y="560" fill="#16A34A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">有了优先级继承</text><text x="420" y="560" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">低优先级临时升到最高，尽快还锁</text><text x="80" y="624" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">高</text><rect x="200" y="586" width="1280" height="56" rx="10" fill="#64748B" fill-opacity="0.04"/><text x="80" y="690" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">中</text><rect x="200" y="652" width="1280" height="56" rx="10" fill="#64748B" fill-opacity="0.04"/><text x="80" y="756" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">低</text><rect x="200" y="718" width="1280" height="56" rx="10" fill="#64748B" fill-opacity="0.04"/><rect x="300" y="586" width="680" height="56" rx="10" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="2"/><text x="640.0" y="621" fill="#DC2626" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">阻塞：等锁</text><rect x="980" y="586" width="200" height="56" rx="10" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="2"/><text x="1080.0" y="621" fill="#2563EB" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">执行</text><rect x="480" y="652" width="500" height="56" rx="10" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="2"/><text x="730.0" y="687" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">就绪，但抢不动</text><rect x="1180" y="652" width="180" height="56" rx="10" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-width="2"/><text x="1270.0" y="687" fill="#D97706" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">执行</text><rect x="200" y="718" width="280" height="56" rx="10" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="2"/><text x="340.0" y="753" fill="#16A34A" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">持锁运行</text><rect x="480" y="718" width="500" height="56" rx="10" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="2"/><text x="730.0" y="753" fill="#16A34A" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">持锁运行（优先级已提升）</text><line x1="980" y1="576" x2="980" y2="780" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 6"/><text x="980" y="804" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">释放锁</text><text x="800" y="850" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">锁一还出来，高优先级立刻执行；中优先级只能排在后面</text></svg>