<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker><marker id="a0891B2" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#0891B2"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">端侧先过滤，云端做深处理</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">把数据量和信息量分开：大部分数据在本地丢掉，只把有价值的部分送上去</text><rect x="90" y="230" width="380" height="400" rx="18" fill="#16A34A" fill-opacity="0.07" stroke="#16A34A" stroke-width="3"/><text x="116" y="286" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">端 · 第一道过滤</text><text x="120" y="354" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 小模型常驻，毫秒级响应</text><text x="120" y="408" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 逐帧判断有无异常</text><text x="120" y="462" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 丢掉绝大多数无用数据</text><text x="120" y="516" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 只上传命中的片段</text><text x="120" y="570" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 断网也能继续工作</text><rect x="610" y="230" width="380" height="400" rx="18" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="3"/><text x="636" y="286" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">边 · 区域聚合</text><text x="640" y="354" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 把多路设备的数据聚合</text><text x="640" y="408" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 跨设备关联、二次筛选</text><text x="640" y="462" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 本地留存，不出园区</text><text x="640" y="516" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 汇总后按需上云</text><rect x="1130" y="230" width="380" height="400" rx="18" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="3"/><text x="1156" y="286" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">云 · 深处理</text><text x="1160" y="354" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 大模型做复杂推理</text><text x="1160" y="408" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 长周期统计与分析</text><text x="1160" y="462" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 模型训练与版本管理</text><text x="1160" y="516" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 把新模型下发到端边</text><line x1="470" y1="360" x2="608" y2="360" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="539" y="338" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">候选片段</text><line x1="990" y1="360" x2="1128" y2="360" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="1059" y="338" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">汇总结果</text><line x1="1128" y1="570" x2="990" y2="570" stroke="#0891B2" stroke-width="3" marker-end="url(#a0891B2)"/><text x="1059" y="604" fill="#0891B2" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">模型下发</text><line x1="608" y1="570" x2="470" y2="570" stroke="#0891B2" stroke-width="3" marker-end="url(#a0891B2)"/><text x="539" y="604" fill="#0891B2" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">模型下发</text><text x="800" y="780" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">端侧解决大部分数据不用上传，云端解决少数疑难需要更强的模型</text></svg>