<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">六个反复出现的反模式</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">共同的毛病：把某一条约束当成了全部</text><rect x="80" y="190" width="706" height="159" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="138.0" cy="248" r="28" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M125.4,235.4 L150.6,260.6 M150.6,235.4 L125.4,260.6" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="188.0" y="244" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">把重任务硬塞端侧</text><text x="188.0" y="284" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">任务超出端侧算力上限</text><text x="188.0" y="322" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：拆成端侧过滤加云端深处理</text><rect x="814" y="190" width="706" height="159" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="872.0" cy="248" r="28" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M859.4,235.4 L884.6,260.6 M884.6,235.4 L859.4,260.6" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="922.0" y="244" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">把敏感数据硬传云端</text><text x="922.0" y="284" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">原始图像、语音整包上传</text><text x="922.0" y="322" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：端侧提特征，只传不可逆结果</text><rect x="80" y="375" width="706" height="159" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="138.0" cy="433" r="28" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M125.4,420.4 L150.6,445.6 M150.6,420.4 L125.4,445.6" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="188.0" y="429" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">为了省事全上云</text><text x="188.0" y="469" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">原型阶段的惯性带到量产</text><text x="188.0" y="507" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：先按硬约束划清边界</text><rect x="814" y="375" width="706" height="159" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="872.0" cy="433" r="28" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M859.4,420.4 L884.6,445.6 M884.6,420.4 L859.4,445.6" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="922.0" y="429" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">只算推理成本</text><text x="922.0" y="469" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">忽略带宽和流量费用</text><text x="922.0" y="507" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：把传输成本一起算进账单</text><rect x="80" y="560" width="706" height="159" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="138.0" cy="618" r="28" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M125.4,605.4 L150.6,630.6 M150.6,605.4 L125.4,630.6" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="188.0" y="614" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">端云模型版本不一致</text><text x="188.0" y="654" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">两边各自迭代，结论对不上</text><text x="188.0" y="692" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：模型版本管理提前设计</text><rect x="814" y="560" width="706" height="159" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="872.0" cy="618" r="28" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M859.4,605.4 L884.6,630.6 M884.6,605.4 L859.4,630.6" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="922.0" y="614" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">把边当摆设</text><text x="922.0" y="654" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">边只做转发，数据原样上云</text><text x="922.0" y="692" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：让边做聚合和本地闭环</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">反模式不是判断错了维度，而是只看了一两个维度</text></svg>