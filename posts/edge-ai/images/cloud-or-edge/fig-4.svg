<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">任务分层的决策流程</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">三个硬约束先筛，软约束再算账</text><rect x="110" y="180" width="700" height="88" rx="14" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="150" y="235" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">1. 要毫秒级、且延迟必须确定吗？</text><rect x="1000" y="180" width="500" height="88" rx="14" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/><text x="1250" y="235" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">端侧</text><line x1="812" y1="226" x2="998" y2="226" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="905" y="210" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">是</text><rect x="110" y="284" width="700" height="88" rx="14" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="150" y="339" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">2. 数据不允许离开设备吗？</text><rect x="1000" y="284" width="500" height="88" rx="14" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/><text x="1250" y="339" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">端侧</text><line x1="812" y1="330" x2="998" y2="330" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="905" y="314" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">是</text><rect x="110" y="388" width="700" height="88" rx="14" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="150" y="443" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">3. 断网时也必须能用吗？</text><rect x="1000" y="388" width="500" height="88" rx="14" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/><text x="1250" y="443" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">端侧</text><line x1="812" y1="434" x2="998" y2="434" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="905" y="418" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">是</text><rect x="110" y="536" width="700" height="88" rx="14" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="150" y="591" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">4. 小模型够用、且数据量很大吗？</text><rect x="1000" y="536" width="500" height="88" rx="14" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/><text x="1250" y="591" fill="#16A34A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">端侧先过滤，异常上云</text><line x1="812" y1="582" x2="998" y2="582" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="905" y="566" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">是</text><rect x="110" y="640" width="700" height="88" rx="14" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="150" y="695" fill="#0F172A" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">5. 以上都不成立吗？</text><rect x="1000" y="640" width="500" height="88" rx="14" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/><text x="1250" y="695" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">云端</text><line x1="812" y1="686" x2="998" y2="686" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="905" y="670" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">都不命中</text><line x1="110" y1="506" x2="1320" y2="506" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="1340" y="514" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">软约束</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">多数真实任务会同时用到两边：端侧做过滤和即时响应，云端做深处理</text></svg>