<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">判断一个任务该放哪一层：五个维度</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">前三个是硬约束，后两个是可以算账的软约束</text><rect x="80" y="190" width="1440" height="96" rx="16" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="2"/><rect x="92" y="204" width="8" height="68" rx="4" fill="#2563EB"/><text x="122" y="250" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">延迟</text><text x="380" y="248" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">能等多久？要确定性吗？</text><text x="1000" y="248" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">毫秒级且要确定，放端侧</text><line x1="352" y1="206" x2="352" y2="270" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><line x1="966" y1="206" x2="966" y2="270" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="80" y="302" width="1440" height="96" rx="16" fill="#0891B2" fill-opacity="0.07" stroke="#0891B2" stroke-width="2"/><rect x="92" y="316" width="8" height="68" rx="4" fill="#0891B2"/><text x="122" y="362" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">数据敏感性</text><text x="380" y="360" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">数据能离开设备吗？</text><text x="1000" y="360" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">不能出设备放端侧，可脱敏再上云</text><line x1="352" y1="318" x2="352" y2="382" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><line x1="966" y1="318" x2="966" y2="382" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="80" y="414" width="1440" height="96" rx="16" fill="#16A34A" fill-opacity="0.07" stroke="#16A34A" stroke-width="2"/><rect x="92" y="428" width="8" height="68" rx="4" fill="#16A34A"/><text x="122" y="474" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">离线要求</text><text x="380" y="472" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">断网时还能用吗？</text><text x="1000" y="472" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">必须离线可用，放端侧</text><line x1="352" y1="430" x2="352" y2="494" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><line x1="966" y1="430" x2="966" y2="494" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="80" y="526" width="1440" height="96" rx="16" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="2"/><rect x="92" y="540" width="8" height="68" rx="4" fill="#D97706"/><text x="122" y="586" fill="#D97706" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">算力需求</text><text x="380" y="584" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">小模型够用还是要通用能力？</text><text x="1000" y="584" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">要通用大模型能力，放云端</text><line x1="352" y1="542" x2="352" y2="606" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><line x1="966" y1="542" x2="966" y2="606" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="80" y="638" width="1440" height="96" rx="16" fill="#7C3AED" fill-opacity="0.07" stroke="#7C3AED" stroke-width="2"/><rect x="92" y="652" width="8" height="68" rx="4" fill="#7C3AED"/><text x="122" y="698" fill="#7C3AED" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">成本</text><text x="380" y="696" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">数据量多大？调用多频繁？</text><text x="1000" y="696" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">量大先端侧过滤，低频上云</text><line x1="352" y1="654" x2="352" y2="718" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><line x1="966" y1="654" x2="966" y2="718" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">硬约束决定能不能这么做，软约束决定这么做划不划算</text></svg>