<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">per-tensor 与 per-channel</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">同一个张量里各通道范围差得多时，一套 scale 会浪费掉大部分格点</text><rect x="80" y="190" width="700" height="520" rx="18" fill="#2563EB" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="240" fill="#2563EB" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">per-tensor：整个张量一套 scale</text><rect x="110" y="310" width="32" height="40" rx="8" fill="#2563EB" fill-opacity="0.30" stroke="#2563EB" stroke-width="2"/><text x="110" y="296" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">通道 A  最大值 0.1</text><rect x="110" y="400" width="640" height="40" rx="8" fill="#2563EB" fill-opacity="0.30" stroke="#2563EB" stroke-width="2"/><text x="110" y="386" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">通道 B  最大值 2.0</text><rect x="110" y="490" width="320" height="40" rx="8" fill="#2563EB" fill-opacity="0.30" stroke="#2563EB" stroke-width="2"/><text x="110" y="476" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">通道 C  最大值 1.0</text><line x1="750" y1="290" x2="750" y2="550" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 6"/><text x="640" y="574" fill="#DC2626" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">scale 按最大值 2.0 定</text><text x="110" y="620" fill="#DC2626" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">通道 A 的值全挤在头几个格点里</text><text x="110" y="662" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">整数格点利用率：低</text><rect x="840" y="190" width="680" height="520" rx="18" fill="#16A34A" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="870" y="240" fill="#16A34A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">per-channel：每个通道一套 scale</text><rect x="870" y="310" width="31" height="40" rx="8" fill="#16A34A" fill-opacity="0.30" stroke="#16A34A" stroke-width="2"/><text x="870" y="296" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">通道 A  自己的 scale</text><line x1="901" y1="298" x2="901" y2="362" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 6"/><rect x="870" y="400" width="620" height="40" rx="8" fill="#16A34A" fill-opacity="0.30" stroke="#16A34A" stroke-width="2"/><text x="870" y="386" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">通道 B  自己的 scale</text><line x1="1490" y1="388" x2="1490" y2="452" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 6"/><rect x="870" y="490" width="310" height="40" rx="8" fill="#16A34A" fill-opacity="0.30" stroke="#16A34A" stroke-width="2"/><text x="870" y="476" fill="#0F172A" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">通道 C  自己的 scale</text><line x1="1180" y1="478" x2="1180" y2="542" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="620" fill="#16A34A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">每个通道按自己的最大值定 scale</text><text x="870" y="662" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">整数格点利用率：高</text><text x="800" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">per-channel 只多存几个 scale，代价很小，是权重量化的默认做法</text></svg>