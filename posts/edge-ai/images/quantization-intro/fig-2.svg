<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">对称量化与非对称量化</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">区别在于零点是否对齐，以及数据范围怎么映射</text><text x="110" y="230" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">对称：零点对齐，z 恒等于 0</text><rect x="140" y="358" width="1320" height="44" rx="10" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="2"/><line x1="140" y1="380" x2="1460" y2="380" stroke="#CBD5E1" stroke-width="3"/><line x1="800" y1="340" x2="800" y2="420" stroke="#2563EB" stroke-width="3"/><text x="140" y="334" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">最小 -2.5</text><text x="1460" y="334" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">最大 2.5</text><text x="800" y="334" fill="#2563EB" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">0</text><text x="140" y="424" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">格点 -127</text><text x="1460" y="424" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">格点 127</text><text x="110" y="470" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">0 落在整数 0 上，正负对称，映射最省事</text><text x="110" y="560" fill="#D97706" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">非对称：零点偏移，z 不等于 0</text><rect x="140" y="688" width="1320" height="44" rx="10" fill="#D97706" fill-opacity="0.18" stroke="#D97706" stroke-width="2"/><line x1="140" y1="710" x2="1460" y2="710" stroke="#CBD5E1" stroke-width="3"/><line x1="140" y1="670" x2="140" y2="746" stroke="#D97706" stroke-width="3"/><text x="140" y="664" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">最小 0.0</text><text x="1460" y="664" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">最大 6.0</text><text x="140" y="774" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">格点 0</text><text x="1460" y="774" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">格点 255</text><text x="110" y="824" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">非负数据映射到 0 到 255，不会浪费一半整数范围</text></svg>