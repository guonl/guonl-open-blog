<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">为什么量化能提速：内存带宽是主线</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">内存受限的推理里，耗时主要花在把权重读进来</text><rect x="80" y="190" width="800" height="520" rx="18" fill="#2563EB" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="240" fill="#2563EB" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">7B 模型读一遍权重的耗时估算</text><line x1="170" y1="630" x2="820" y2="630" stroke="#CBD5E1" stroke-width="3"/><rect x="230" y="340" width="150" height="290" rx="10" fill="#2563EB" fill-opacity="0.30" stroke="#2563EB" stroke-width="3"/><rect x="490" y="485" width="150" height="145" rx="10" fill="#16A34A" fill-opacity="0.30" stroke="#16A34A" stroke-width="3"/><text x="305" y="322" fill="#2563EB" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">约 0.28 秒</text><text x="565" y="467" fill="#16A34A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">约 0.14 秒</text><text x="305" y="666" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">FP16  14GB</text><text x="565" y="666" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">INT8  7GB</text><text x="110" y="696" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">按约 50GB/s 内存带宽估算，忽略激活值与算子开销</text><rect x="920" y="190" width="600" height="520" rx="18" fill="#16A34A" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="950" y="240" fill="#16A34A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">为什么瓶颈在带宽</text><text x="950" y="312" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 逐 token 生成时，每个权重只参与一次乘加</text><text x="950" y="374" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 算术强度接近 1，计算单元大部分时间在等数据</text><text x="950" y="436" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 权重字节数减半，这部分耗时也接近减半</text><text x="950" y="498" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 批大小很大时算力才是瓶颈，收益变小</text><text x="950" y="600" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">同一份数据，读的字节数越少，等的时间越短</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">提速的主线是把要搬的字节数变少，整数运算的收益是第二条</text></svg>