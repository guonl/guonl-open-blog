<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">浮点数与定点数：表示方式与占用</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">FP32 用 4 个字节换动态范围，INT8 用 1 个字节换节省</text><rect x="80" y="190" width="700" height="520" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="244" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">FP32：三部分拼成一个数</text><rect x="110" y="280" width="40" height="56" rx="8" fill="#DC2626" fill-opacity="0.30" stroke="#DC2626" stroke-width="2"/><rect x="156" y="280" width="140" height="56" rx="8" fill="#D97706" fill-opacity="0.30" stroke="#D97706" stroke-width="2"/><rect x="302" y="280" width="448" height="56" rx="8" fill="#2563EB" fill-opacity="0.30" stroke="#2563EB" stroke-width="2"/><text x="130" y="368" fill="#DC2626" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">1 位符号</text><text x="226" y="368" fill="#D97706" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">8 位指数</text><text x="526" y="368" fill="#2563EB" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">23 位尾数</text><text x="110" y="442" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 能表示 1e-38 到 1e38 的动态范围</text><text x="110" y="492" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 每个数占 4 个字节</text><text x="110" y="542" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 数值大小变化时精度基本一致</text><text x="110" y="612" fill="#64748B" font-size="22" font-family="'SF Mono','Menlo','Consolas',monospace" text-anchor="start">FP32 = 1 + 8 + 23</text><rect x="840" y="190" width="680" height="520" rx="18" fill="#16A34A" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="870" y="244" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">INT8：一条均匀的刻度尺</text><line x1="890" y1="330" x2="1470" y2="330" stroke="#CBD5E1" stroke-width="3"/><circle cx="890" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="931" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="973" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1014" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1056" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1097" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1138" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1180" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1221" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1263" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1304" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1345" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1387" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1428" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><circle cx="1470" cy="330" r="6" fill="#16A34A" fill-opacity="0.7"/><text x="890" y="302" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">最小 -128</text><text x="1470" y="302" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">最大 127</text><text x="890" y="376" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">每个格点间距相同，间距就是 scale</text><text x="870" y="442" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 每个数占 1 个字节</text><text x="870" y="492" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 用 scale 把实数贴到最近的格点</text><text x="870" y="542" fill="#0F172A" font-size="23" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· zero point 决定 0 落在哪个格点</text><text x="870" y="612" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">取值 -128 到 127，一共 256 个格点</text><text x="800" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">定点数没有指数位，靠一套 scale 把实数均匀映射到整数格点</text></svg>