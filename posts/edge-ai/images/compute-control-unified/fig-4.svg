<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">数据通路：从传感器到控制输出</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">感知走慢回路，控制在快回路，中间用共享内存衔接</text><rect x="80" y="280" width="240" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="200.0" y="346.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">传感器</text><text x="200.0" y="380.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">相机 IMU 编码器</text><rect x="380" y="280" width="240" height="140" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="500.0" y="346.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">信号前端</text><text x="500.0" y="380.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">滤波 时间同步</text><rect x="680" y="280" width="240" height="140" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="800.0" y="346.0" fill="#7C3AED" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">感知推理</text><text x="800.0" y="380.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">NPU 跑模型</text><rect x="980" y="280" width="240" height="140" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="1100.0" y="346.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">控制计算</text><text x="1100.0" y="380.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">实时核跑控制器</text><rect x="1280" y="280" width="240" height="140" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1400.0" y="346.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">执行器</text><text x="1400.0" y="380.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">电机 舵机</text><line x1="320" y1="350" x2="376" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="620" y1="350" x2="676" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="920" y1="350" x2="976" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><line x1="1220" y1="350" x2="1276" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#a64748B)"/><text x="800" y="480" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">感知结果和传感器数据都落在共享内存里，控制环直接读，不经过网络和拷贝</text><rect x="80" y="520" width="1440" height="120" rx="16" fill="#7C3AED" fill-opacity="0.05" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 8"/><text x="110" y="566" fill="#7C3AED" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">慢回路：感知到目标（1 Hz 到 30 Hz，允许抖动）</text><text x="110" y="612" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">NPU 跑推理，输出目标位置、意图、语义地图</text><text x="1490" y="566" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">经共享内存交给控制环</text><rect x="80" y="660" width="1440" height="120" rx="16" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 8"/><text x="110" y="706" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">快回路：状态到控制量（100 Hz 到 kHz，抖动有上界）</text><text x="110" y="752" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">实时核读传感器直接闭环，不等感知结果</text><text x="1490" y="706" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="400">延迟必须落在周期预算内</text></svg>