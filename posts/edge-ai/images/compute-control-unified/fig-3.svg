<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">实时域与非实时域：隔离靠三件事</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">中断优先级、内存分区、核间通信，缺一个都不算隔离</text><rect x="80" y="240" width="453" height="420" rx="18" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="3"/><text x="114.0" y="305" fill="#2563EB" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">中断优先级</text><text x="114.0" y="385" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 实时核的中断不被 AI 侧屏蔽</text><text x="114.0" y="447" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 高优先级事件立刻抢占</text><text x="114.0" y="509" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 推理用低优先级软中断收通知</text><text x="114.0" y="571" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 关键中断的响应有上界</text><rect x="573" y="240" width="453" height="420" rx="18" fill="#0891B2" fill-opacity="0.06" stroke="#0891B2" stroke-width="3"/><text x="607.3333333333333" y="305" fill="#0891B2" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">内存分区</text><text x="607.3333333333333" y="385" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 实时域内存静态预分配</text><text x="607.3333333333333" y="447" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· AI 侧用独立内存池</text><text x="607.3333333333333" y="509" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· MPU 或 MMU 划界，越界就拦</text><text x="607.3333333333333" y="571" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 带宽给实时访问留份额</text><rect x="1067" y="240" width="453" height="420" rx="18" fill="#16A34A" fill-opacity="0.06" stroke="#16A34A" stroke-width="3"/><text x="1100.6666666666665" y="305" fill="#16A34A" font-size="28" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">核间通信</text><text x="1100.6666666666665" y="385" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 共享内存加环形缓冲</text><text x="1100.6666666666665" y="447" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 邮箱触发，不做忙轮询</text><text x="1100.6666666666665" y="509" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 数据零拷贝，只传句柄</text><text x="1100.6666666666665" y="571" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 协议定长，运行期不分配</text><text x="800" y="730" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">隔离的目标不是让 AI 变慢，而是让控制环的最坏延迟不受 AI 影响</text></svg>