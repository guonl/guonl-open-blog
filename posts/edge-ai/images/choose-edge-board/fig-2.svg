<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">选型三步：先看任务，再看约束，最后看预算</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">顺序不能倒，前一步定档位，后一步只在档位里挑</text><path d="M80.0,230 L529.3333333333333,230 L553.3333333333333,278.0 L529.3333333333333,326 L80.0,326 L104.0,278.0 Z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="3"/><text x="324.66666666666663" y="288.0" fill="#2563EB" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">先看任务</text><path d="M563.3333333333333,230 L1012.6666666666665,230 L1036.6666666666665,278.0 L1012.6666666666665,326 L563.3333333333333,326 L587.3333333333333,278.0 Z" fill="#0891B2" fill-opacity="0.12" stroke="#0891B2" stroke-width="3"/><text x="807.9999999999999" y="288.0" fill="#0891B2" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">再看约束</text><path d="M1046.6666666666665,230 L1495.9999999999998,230 L1519.9999999999998,278.0 L1495.9999999999998,326 L1046.6666666666665,326 L1070.6666666666665,278.0 Z" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="3"/><text x="1291.3333333333333" y="288.0" fill="#16A34A" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">最后看预算</text><rect x="80" y="400" width="453" height="330" rx="18" fill="#2563EB" fill-opacity="0.07" stroke="#2563EB" stroke-width="3"/><text x="106" y="458" fill="#2563EB" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">先看任务</text><line x1="106" y1="486" x2="507" y2="486" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="110" y="546" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 要跑什么模型？分类、检测还是生成</text><text x="110" y="598" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 延迟要求多少？毫秒级还是几百毫秒</text><text x="110" y="650" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 模型多大？几百 KB 还是几 GB</text><text x="110" y="702" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 输入是什么？音频、图像还是多路视频</text><rect x="573" y="400" width="453" height="330" rx="18" fill="#D97706" fill-opacity="0.07" stroke="#D97706" stroke-width="3"/><text x="599" y="458" fill="#D97706" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">再看约束</text><line x1="599" y1="486" x2="1000" y2="486" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="603" y="546" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 功耗与散热：能不能长时间满载</text><text x="603" y="598" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 接口：摄像头、CAN、GPIO 够不够</text><text x="603" y="650" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 环境：温度、震动、防护等级</text><text x="603" y="702" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 要不要实时：控制环能不能被拖慢</text><rect x="1066" y="400" width="453" height="330" rx="18" fill="#16A34A" fill-opacity="0.07" stroke="#16A34A" stroke-width="3"/><text x="1092" y="458" fill="#16A34A" font-size="27" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">最后看预算</text><line x1="1092" y1="486" x2="1493" y2="486" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="1096" y="546" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 单件价格，还是量产 BOM 成本</text><text x="1096" y="598" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 开发成本：工具链成熟度、文档质量</text><text x="1096" y="650" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 人力：生态熟悉的人好不好找</text><text x="1096" y="702" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 供货：交期、长期供应、二手溢价</text><text x="800" y="800" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">任务和约束决定档位，预算只决定在这个档位里挑哪一块</text></svg>