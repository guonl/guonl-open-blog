<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">几个典型任务，对应哪一档板子</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">先让任务挑档位，再在同一个档位里比工具链和价格</text><rect x="80.0" y="230.0" width="700.0" height="133.33333333333334" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="430.0" y="292.6666666666667" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">超低功耗、常开的小模型</text><text x="430.0" y="327.6666666666667" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">ESP32-S3：唤醒词、手势、异常检测</text><rect x="820.0" y="230.0" width="700.0" height="133.33333333333334" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="1170.0" y="292.6666666666667" fill="#2563EB" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">轻量视觉、原型与教学</text><text x="1170.0" y="327.6666666666667" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">树莓派：单路摄像头，CPU 或外接加速棒</text><rect x="80.0" y="403.33333333333337" width="700.0" height="133.33333333333334" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="430.0" y="466.00000000000006" fill="#D97706" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">多路视频 + 本地小模型</text><text x="430.0" y="501.00000000000006" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">RK3588：多路解码、检测、边缘盒子</text><rect x="820.0" y="403.33333333333337" width="700.0" height="133.33333333333334" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1170.0" y="466.00000000000006" fill="#16A34A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">本地大模型、多传感器融合</text><text x="1170.0" y="501.00000000000006" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">Jetson：CUDA 生态，机器人主控常用</text><rect x="80.0" y="576.6666666666667" width="700.0" height="133.33333333333334" rx="16" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="3"/><text x="430.0" y="639.3333333333334" fill="#DC2626" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">要实时控制，也要跑 AI</text><text x="430.0" y="674.3333333333334" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">MCU 管控制，SoC 管推理，中间走通信</text><rect x="820.0" y="576.6666666666667" width="700.0" height="133.33333333333334" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1170.0" y="639.3333333333334" fill="#7C3AED" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">量产、成本卡得很死</text><text x="1170.0" y="674.3333333333334" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">按 BOM 倒推，选刚好够用的那一颗</text><text x="800" y="790" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">同一个任务往往有好几块板子都能跑，差别在余量、工具链和总成本</text></svg>