<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">四个最常见的选板误区</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">共同的毛病：只盯着一个数字，忽略了板子是一整套约束</text><rect x="80" y="210" width="706" height="200" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="142.0" cy="274" r="30" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M128.5,260.5 L155.5,287.5 M155.5,260.5 L128.5,287.5" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="196.0" y="270" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">只看 TOPS</text><text x="196.0" y="314" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">峰值算力不等于模型实际能跑出多少</text><line x1="196.0" y1="342" x2="756.0" y2="342" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="196.0" y="382" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：把模型真跑一遍，看有效算力</text><rect x="814" y="210" width="706" height="200" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="876.0" cy="274" r="30" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M862.5,260.5 L889.5,287.5 M889.5,260.5 L862.5,287.5" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="930.0" y="270" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">忽略内存带宽</text><text x="930.0" y="314" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">算力再高，数据喂不上也白搭</text><line x1="930.0" y1="342" x2="1490.0" y2="342" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="930.0" y="382" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：带宽和片上缓存一起看</text><rect x="80" y="460" width="706" height="200" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="142.0" cy="524" r="30" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M128.5,510.5 L155.5,537.5 M155.5,510.5 L128.5,537.5" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="196.0" y="520" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">忽略功耗散热</text><text x="196.0" y="564" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">跑几分钟就降频，峰值只是纸面数字</text><line x1="196.0" y1="592" x2="756.0" y2="592" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="196.0" y="632" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：按持续功耗和散热能力来选</text><rect x="814" y="460" width="706" height="200" rx="16" fill="#DC2626" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><circle cx="876.0" cy="524" r="30" fill="#DC2626" fill-opacity="0.12" stroke="#DC2626" stroke-width="3"/><path d="M862.5,510.5 L889.5,537.5 M889.5,510.5 L862.5,537.5" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/><text x="930.0" y="520" fill="#DC2626" font-size="26" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">忽略软件生态</text><text x="930.0" y="564" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">算子不支持、工具链残缺，模型跑不起来</text><line x1="930.0" y1="592" x2="1490.0" y2="592" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><text x="930.0" y="632" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">更好的做法：先确认算子覆盖和工具链成熟度</text><text x="800" y="760" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">选板不是挑最贵或最强的，是挑一块刚好覆盖任务、又落在约束里的板子</text></svg>