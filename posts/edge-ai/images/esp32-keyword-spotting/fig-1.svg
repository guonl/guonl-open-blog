<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs><marker id="a64748B" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#64748B"/></marker><marker id="aD97706" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#D97706"/></marker></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">关键词唤醒的端到端链路</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">训练在 PC，推理在 MCU，两边靠一个量化后的模型文件交接</text><rect x="80" y="210" width="1440" height="240" rx="18" fill="#2563EB" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="262" fill="#2563EB" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">训练侧 · PC</text><rect x="100" y="300" width="320" height="122" rx="16" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="3"/><text x="260.0" y="357.0" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1. 采集语音</text><text x="260.0" y="391.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">16 kHz 单声道，每条约 1 秒</text><line x1="424" y1="361" x2="456" y2="361" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="460" y="300" width="320" height="122" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="620.0" y="357.0" fill="#0891B2" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2. 训练模型</text><text x="620.0" y="391.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">几层卷积，参数量几万到几十万</text><line x1="784" y1="361" x2="816" y2="361" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="820" y="300" width="320" height="122" rx="16" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="3"/><text x="980.0" y="357.0" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3. 量化 int8</text><text x="980.0" y="391.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">训练后量化，体积约缩到四分之一</text><line x1="1144" y1="361" x2="1176" y2="361" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="1180" y="300" width="320" height="122" rx="16" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="3"/><text x="1340.0" y="357.0" fill="#7C3AED" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4. 导出 .tflite</text><text x="1340.0" y="391.0" fill="#64748B" font-size="18" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">量化后的模型文件</text><line x1="800" y1="456" x2="800" y2="520" stroke="#D97706" stroke-width="4" marker-end="url(#aD97706)"/><text x="832" y="496" fill="#D97706" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">交接：量化后的 .tflite 模型文件</text><rect x="80" y="530" width="1440" height="290" rx="18" fill="#16A34A" fill-opacity="0.04" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="582" fill="#16A34A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">设备侧 · MCU</text><rect x="100" y="612" width="680" height="160" rx="16" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="3"/><text x="440.0" y="688.0" fill="#0891B2" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5. 转成 C 数组，编进固件</text><text x="440.0" y="723.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">xxd 转成十六进制文本，const 修饰后留在 flash</text><line x1="786" y1="692" x2="818" y2="692" stroke="#64748B" stroke-width="4" marker-end="url(#a64748B)"/><rect x="824" y="612" width="676" height="160" rx="16" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="3"/><text x="1162.0" y="688.0" fill="#16A34A" font-size="25" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">6. 采样与滑窗推理</text><text x="1162.0" y="723.0" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">每 100 毫秒取最近 1 秒，算 MFCC 后跑一次推理</text><text x="800" y="856" fill="#64748B" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="500">设备只负责推理，不做训练；模型换一代，只需要换这一个文件</text></svg>