<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#E2E8F0" stroke-width="1"/><defs></defs><text x="48" y="66" fill="#0F172A" font-size="34" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="700">内存预算：模型放 flash，运行时缓冲占 RAM</text><text x="48" y="104" fill="#64748B" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" font-weight="400">ESP32 的 SRAM 在几百 KB 量级，每一块都要留出余量</text><rect x="80" y="210" width="560" height="440" rx="18" fill="#D97706" fill-opacity="0.05" stroke="#D97706" stroke-width="3"/><text x="112" y="264" fill="#D97706" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">Flash（只读，不占 RAM）</text><rect x="120" y="300" width="480" height="120" rx="14" fill="#D97706" fill-opacity="0.10" stroke="#D97706" stroke-width="3"/><text x="360" y="352" fill="#D97706" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">kws_int8_tflite[]</text><text x="360" y="390" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">几十 KB，编进固件</text><text x="120" y="480" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· xxd 把 .tflite 转成 C 数组</text><text x="120" y="526" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· const 修饰，留在 flash 不占 SRAM</text><text x="120" y="572" fill="#0F172A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">· 模型更大时也可放外部 flash 或 SPIFFS</text><text x="120" y="624" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">设备端不做训练，模型是一段静态数据</text><rect x="680" y="210" width="840" height="440" rx="18" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="3"/><text x="712" y="264" fill="#2563EB" font-size="24" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">SRAM（运行时占用）</text><text x="712" y="344" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">tensor arena</text><rect x="1000" y="316" width="397" height="40" rx="8" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="3"/><text x="1412.8" y="344" fill="#2563EB" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">64 KB（示例）</text><text x="712" y="404" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">音频环形缓冲</text><rect x="1000" y="376" width="198" height="40" rx="8" fill="#0891B2" fill-opacity="0.16" stroke="#0891B2" stroke-width="3"/><text x="1214.4" y="404" fill="#0891B2" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">32 KB</text><text x="712" y="464" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">特征缓冲 40 x 13</text><rect x="1000" y="436" width="28" height="40" rx="8" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-width="3"/><text x="1044" y="464" fill="#16A34A" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">约 2 KB</text><text x="712" y="524" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">MFCC 中间结果</text><rect x="1000" y="496" width="37" height="40" rx="8" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-width="3"/><text x="1053.2" y="524" fill="#7C3AED" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">几 KB</text><text x="712" y="584" fill="#0F172A" font-size="21" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="500">栈与临时缓冲</text><rect x="1000" y="556" width="74" height="40" rx="8" fill="#D97706" fill-opacity="0.16" stroke="#D97706" stroke-width="3"/><text x="1090.4" y="584" fill="#D97706" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="600">要留余量</text><text x="712" y="624" fill="#64748B" font-size="19" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="400">arena 给太小 AllocateTensors 直接失败，给太大又挤占别的内存</text><rect x="80" y="690" width="1440" height="130" rx="18" fill="#64748B" fill-opacity="0.05" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="736" fill="#0F172A" font-size="22" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="700">整块 SRAM 的预算（示意）</text><rect x="112" y="756" width="1376" height="46" rx="8" fill="#CBD5E1" fill-opacity="0.35"/><rect x="112" y="756" width="480" height="46" rx="8" fill="#2563EB" fill-opacity="0.28"/><rect x="600" y="756" width="240" height="46" rx="8" fill="#0891B2" fill-opacity="0.24"/><text x="352" y="787" fill="#2563EB" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">arena + 音频 + 特征 + 栈</text><text x="720" y="787" fill="#0891B2" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">余量</text><text x="1300" y="787" fill="#64748B" font-size="20" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="400">给别的功能留出的空间</text></svg>